  --font-pixel: "Silkscreen", "Courier New", monospace;
  --r: 10px;
  color-scheme: dark;
}
:root[data-theme="light"] {
  --bg: #e4f1ff;
  --bg-deep: #dde6f5;
  --panel: #fffaf0;
  --panel-2: #f7efdf;
  --panel-3: #ece2cc;
  --frame: #d07a33;
  --frame-dark: #9a5320;
  --frame-light: #f6b06a;
  --ink: #2a2140;
  --muted: #6a6487;
  --good: #1e9a52;
  --bad: #d63a3a;
  --gold: #c08600;
  --c0: #ec5a2c; --c1: #2f72e6; --c2: #9b46e6; --c3: #d99a00; --c4: #12a892; --c5: #e6437e;
  color-scheme: light;
}
:root[data-theme="light"] body { background-image: radial-gradient(circle at 20% 0%, #ffffff 0, transparent 55%), radial-gradient(circle at 90% 100%, #fde9cf 0, transparent 50%); }
:root[data-theme="light"] .logo h1 { color: #f3902f; text-shadow: 0 3px 0 #7a3e14; }
:root[data-theme="light"] .chart line:not([stroke-dasharray]) { stroke: rgba(42, 33, 64, 0.1); }
:root[data-theme="light"] .stepper button, :root[data-theme="light"] .tside, :root[data-theme="light"] .mbtn, :root[data-theme="light"] .agenda button, :root[data-theme="light"] .choice > span { box-shadow: inset 0 -3px 0 rgba(0,0,0,0.12), 0 0 0 2px #c9b896; }
:root[data-theme="light"] .tbl th, :root[data-theme="light"] .tbl td { border-bottom-color: rgba(42, 33, 64, 0.08); }
:root[data-theme="light"] .title-screen { background: #bfe3ff; }
:root[data-theme="light"] .title-logo { background: rgba(255, 250, 240, 0.95); }
:root[data-theme="light"] .title-logo h1 { color: #f3902f; text-shadow: 0 4px 0 #7a3e14, 0 7px 0 rgba(0,0,0,0.15); }
:root[data-theme="light"] .pcard, :root[data-theme="light"] .tcard { box-shadow: 0 0 0 2px #c9b896, 0 4px 10px rgba(0,0,0,0.08); }
:root[data-theme="light"] #tip { background: #fffaf0; color: var(--ink); border-color: var(--frame); box-shadow: 0 6px 18px rgba(80, 50, 20, 0.22); }
:root[data-theme="light"] .overlay { background: rgba(60, 70, 110, 0.45); }
.btn.blue, .title-btns .btn.navy { color: #f6efe0; }
:root[data-theme="light"] .title-btns .btn.navy { background: linear-gradient(#4f82ee, #2f5fd0); box-shadow: inset 0 -4px 0 rgba(0,0,0,0.25), 0 0 0 2px #1d3a86, 0 6px 0 rgba(0,0,0,0.15); }
* { box-sizing: border-box; }
html, body { background: var(--bg); }
body {
  color: var(--ink);
  font-family: var(--font-ui);
  font-weight: 700;
  font-size: 15px;
  line-height: 1.35;
  padding-left: max(14px, env(safe-area-inset-left, 0px));
  padding-right: max(14px, env(safe-area-inset-right, 0px));
  padding-block: 14px 32px;
  background-image: radial-gradient(circle at 20% 0%, #1b2756 0, transparent 55%), radial-gradient(circle at 90% 100%, #1d1640 0, transparent 50%);
  background-color: var(--bg);
}
button, input { font: inherit; color: inherit; }
:focus-visible { outline: 3px solid var(--gold); outline-offset: 2px; }
.app { max-width: 1240px; margin: 0 auto; display: grid; gap: 12px; }
.num { font-variant-numeric: tabular-nums; }
.pos { color: var(--good); }
.neg { color: var(--bad); }
.muted { color: var(--muted); }

/* Chunky framed window, like a game dialog. */
.win {
  background: var(--panel);
  border: 3px solid var(--frame);
  border-radius: var(--r);
  box-shadow: 0 0 0 3px var(--frame-dark), inset 0 2px 0 rgba(255,255,255,0.06), 0 10px 24px rgba(0,0,0,0.35);
  min-width: 0;
}
.win-title {
  display: flex; align-items: center; gap: 10px;
  background: linear-gradient(var(--panel-3), var(--panel-2));
  border-bottom: 3px solid var(--frame-dark);
  padding: 8px 12px; border-radius: 7px 7px 0 0;
  font-family: var(--font-display); font-weight: 700; font-size: 15px; letter-spacing: 0.02em; text-transform: uppercase;
}
.win-title .x { color: #fff; }
.win-title .x { margin-left: auto; width: 22px; height: 22px; border-radius: 5px; background: #d9443a; box-shadow: inset 0 -3px 0 rgba(0,0,0,0.3); display: grid; place-items: center; font-family: var(--font-pixel); font-size: 12px; }
.win-body { padding: 14px; display: grid; gap: 14px; }

/* Top bar */
.topbar { display: flex; flex-wrap: wrap; align-items: center; gap: 10px 12px; padding: 10px 16px; }
.topbar .tools { display: flex; gap: 6px; }
.logo { display: flex; align-items: center; gap: 12px; }
.logo h1 { margin: 0; font-family: var(--font-display); font-weight: 700; font-size: 30px; line-height: 1; letter-spacing: 0.01em; text-shadow: 0 3px 0 #000, 0 0 18px rgba(243, 144, 47, 0.25); }
.logo canvas { width: 40px; height: 40px; image-rendering: pixelated; }
.topbar .sub { font-size: 13px; color: var(--muted); font-weight: 800; margin-top: 4px; }
.topbar .spacer { flex: 1; }
.topbar .sep { width: 2px; align-self: stretch; background: rgba(255,255,255,0.1); }
.round { font-family: var(--font-display); font-weight: 700; font-size: 21px; letter-spacing: 0.02em; }
.cashchip { display: grid; text-align: center; line-height: 1.15; }
.wallet { display: flex; align-items: stretch; gap: 0; padding: 0; border: 0; border-radius: 10px; overflow: hidden; cursor: pointer; font: inherit; color: var(--ink); background: var(--bg-deep); box-shadow: 0 0 0 3px var(--frame-dark), inset 0 2px 0 rgba(0,0,0,0.35); }
.wallet:hover, .wallet:focus-visible { box-shadow: 0 0 0 3px var(--gold), inset 0 2px 0 rgba(0,0,0,0.35); outline: none; }
.wallet > span { display: grid; align-content: center; gap: 1px; padding: 6px 14px; text-align: left; line-height: 1.1; }
.wallet small { font-size: 10px; font-weight: 900; color: var(--muted); text-transform: uppercase; letter-spacing: 0.1em; }
.wallet small em { font-style: normal; color: var(--gold); letter-spacing: 0; }
.w-cash { background: linear-gradient(180deg, rgba(76, 217, 100, 0.16), rgba(76, 217, 100, 0.04)); }
.w-cash b { font-family: var(--font-display); font-size: 28px; color: var(--good); text-shadow: 0 2px 0 rgba(0,0,0,0.35); }
.w-cash b.neg { color: var(--bad); }
.w-cash b.bump { animation: wbump 600ms ease-out; }
@keyframes wbump { 0% { transform: scale(1.12); filter: brightness(1.6); } 100% { transform: none; filter: none; } }
.w-debt { border-left: 2px solid rgba(255,255,255,0.08); min-width: 128px; }
.w-debt b { font-family: var(--font-display); font-size: 20px; color: var(--muted); }
.w-debt.has b { color: var(--bad); }
.w-bar { display: block; height: 6px; margin-top: 3px; border-radius: 3px; background: rgba(255,255,255,0.1); overflow: hidden; }
.w-bar > i { display: block; height: 100%; background: var(--gold); } .w-bar.hi > i { background: var(--bad); }
.w-left { font-size: 9px !important; letter-spacing: 0.04em !important; text-transform: none !important; margin-top: 2px; }
:root[data-theme="light"] .wallet { background: #fffaf0; }
:root[data-theme="light"] .w-cash b { text-shadow: none; }
@media (max-width: 1500px) { .topbar .logo h1 { font-size: 24px; } .topbar .sub { font-size: 12px; } .topbar .round { font-size: 17px; } .w-cash b { font-size: 24px; } .w-debt b { font-size: 17px; } .wallet > span { padding: 5px 11px; } .topbar .tools .btn { padding-left: 8px; padding-right: 8px; } }
@media (max-width: 1180px) { .topbar .sub { display: none; } }
/* Between phone and wide desktop the name would be cut to "FRIE…": show just the logo icon instead. */
@media (min-width: 1200px) and (max-width: 1560px) { .topbar .logo > div { display: none; } }
@media (min-width: 1200px) { .topbar { flex-wrap: nowrap; } .topbar .logo { min-width: 0; flex: 0 1 auto; } .topbar .logo > div { min-width: 0; } .topbar .logo h1, .topbar .sub { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; } .topbar > * { flex-shrink: 0; } .topbar > .logo { flex-shrink: 1; } .topbar .spacer { flex: 1 1 0; min-width: 0; } }
@media (max-width: 760px) { .wallet { order: 5; width: 100%; } .wallet > span { flex: 1; } .w-cash b { font-size: 24px; } }
.cashchip span { font-size: 11px; color: var(--muted); text-transform: uppercase; letter-spacing: 0.08em; }
.cashchip b { font-size: 24px; font-weight: 900; }
@media (max-width: 760px) { .topbar .sep { display: none; } .logo h1 { font-size: 22px; } }
.btn {
  border: 0; cursor: pointer; border-radius: 8px; padding: 10px 16px;
  background: var(--panel-3); color: var(--ink); font-weight: 900; letter-spacing: 0.03em; text-transform: uppercase; font-size: 13px;
  box-shadow: inset 0 -4px 0 rgba(0,0,0,0.35), 0 0 0 2px var(--frame-dark);
}
.btn:hover { filter: brightness(1.12); }
.btn:active { transform: translateY(2px); box-shadow: inset 0 -2px 0 rgba(0,0,0,0.35), 0 0 0 2px var(--frame-dark); }
.btn.go { background: linear-gradient(#ffad55, var(--accent)); color: var(--accent-ink); font-family: var(--font-display); font-size: 15px; font-weight: 700; padding: 12px 20px; box-shadow: inset 0 -4px 0 rgba(0,0,0,0.3), 0 0 0 2px var(--frame-dark), 0 0 16px rgba(243,144,47,0.35); }
.btn.snd { font-family: var(--font-display); font-weight: 700; font-size: 11px; padding: 8px 10px; }
.btn.snd[aria-pressed="false"] { opacity: 0.6; }
.btn.blue { background: linear-gradient(#3e72e6, var(--blue)); font-family: var(--font-display); font-weight: 700; font-size: 14px; padding: 12px 18px; box-shadow: inset 0 -4px 0 rgba(0,0,0,0.3), 0 0 0 2px #142a63; }

/* Player cards */
.players { display: grid; grid-template-columns: repeat(auto-fit, minmax(190px, 1fr)); gap: 10px; }
.pcard { position: relative; display: grid; grid-template-columns: 58px minmax(0, 1fr) auto; gap: 10px; align-items: center; padding: 9px 10px; border-radius: 10px; background: linear-gradient(160deg, color-mix(in srgb, var(--pc) 16%, var(--panel)), var(--bg-deep)); border: 3px solid var(--pc); box-shadow: 0 0 0 2px #050817, 0 0 14px color-mix(in srgb, var(--pc) 30%, transparent); min-width: 0; }
.pcard.me { background: linear-gradient(160deg, color-mix(in srgb, var(--pc) 34%, var(--panel)), var(--bg-deep)); }
.pcard .face { width: 58px; height: 58px; padding: 3px; border-radius: 8px; background: var(--pc); box-shadow: inset 0 0 0 2px rgba(0,0,0,0.35); }
.pcard .face canvas { display: block; width: 100%; height: 100%; image-rendering: pixelated; border-radius: 5px; }
.pcard .name { font-family: var(--font-display); font-weight: 700; font-size: 14px; text-transform: uppercase; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.pcard .co { font-size: 12px; color: var(--muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.pcard .val { font-size: 21px; font-weight: 900; line-height: 1.1; }
.pcard .val small { font-size: 11px; font-weight: 800; margin-left: 4px; }
.pcard .side { display: grid; justify-items: center; gap: 6px; }
.pcard .trait { width: 18px; height: 18px; image-rendering: pixelated; }
.ring { width: 38px; height: 38px; border-radius: 50%; display: grid; place-items: center; background: conic-gradient(var(--pc) calc(var(--p) * 1%), rgba(255,255,255,0.12) 0); }
.ring span { width: 30px; height: 30px; border-radius: 50%; background: var(--bg-deep); display: grid; place-items: center; font-size: 10.5px; font-weight: 900; font-variant-numeric: tabular-nums; }
.pcard .trend { font-family: var(--font-pixel); font-size: 13px; text-align: right; line-height: 1.1; }
.pcard .tag { display: inline-block; font-size: 10px; font-weight: 900; padding: 1px 5px; border-radius: 4px; background: var(--bad); color: #fff; margin-top: 2px; }
.pcard .tag.own { background: var(--good); color: #062614; }

/* Skyline */
.skyline .stage { position: relative; overflow: hidden; border-radius: 0 0 7px 7px; }
.skyline canvas { display: block; width: 100%; height: auto; image-rendering: pixelated; }
.sign { position: absolute; transform: translate(-50%, -100%); padding: 2px 6px; border: 2px solid var(--pc); background: rgba(6, 9, 26, 0.88); color: var(--pc); font-family: var(--font-display); font-weight: 700; font-size: clamp(8px, 1.15vw, 13px); line-height: 1.2; white-space: nowrap; text-transform: uppercase; border-radius: 3px; box-shadow: 0 0 10px color-mix(in srgb, var(--pc) 70%, transparent), inset 0 0 6px color-mix(in srgb, var(--pc) 40%, transparent); text-shadow: 0 0 6px color-mix(in srgb, var(--pc) 80%, transparent); pointer-events: none; }
.sign.me { color: #fff; background: color-mix(in srgb, var(--pc) 55%, #06091a); }
@media (max-width: 560px) { .sign { font-size: 7px; padding: 1px 3px; border-width: 1px; } }

/* Main: side menu + window */
.main { display: grid; grid-template-columns: 116px minmax(0, 1fr); gap: 12px; align-items: start; }
.menu { display: grid; gap: 8px; padding: 8px; }
.menu h2 { margin: 2px 0 2px; font-family: var(--font-display); font-size: 14px; text-align: center; font-weight: 700; }
.mbtn { display: grid; justify-items: center; gap: 5px; padding: 10px 4px 8px; border-radius: 8px; border: 0; cursor: pointer; background: var(--panel-2); box-shadow: inset 0 -4px 0 rgba(0,0,0,0.3), 0 0 0 2px #0b1027; font-family: var(--font-display); font-size: 10px; font-weight: 700; text-transform: uppercase; }
.mbtn canvas { width: 40px; height: 40px; image-rendering: pixelated; }
.mbtn[aria-current="true"] { background: linear-gradient(var(--frame-light), var(--frame)); color: var(--accent-ink); box-shadow: inset 0 -4px 0 rgba(0,0,0,0.25), 0 0 0 2px var(--frame-dark); }
@media (max-width: 760px) {
  .main { grid-template-columns: minmax(0, 1fr); }
  .menu { grid-auto-flow: column; grid-auto-columns: minmax(78px, 1fr); overflow-x: auto; }
  .menu h2 { display: none; }
}

.grid2 { display: grid; grid-template-columns: minmax(0, 1.25fr) minmax(0, 1fr); gap: 14px; align-items: start; }
@media (max-width: 980px) { .grid2 { grid-template-columns: minmax(0, 1fr); } }
.card { background: var(--panel-2); border-radius: 8px; padding: 12px; display: grid; gap: 10px; box-shadow: inset 0 0 0 2px rgba(255,255,255,0.05); min-width: 0; }
.card h3 { margin: 0; font-size: 15px; font-weight: 900; }
.card .hint { font-size: 12.5px; color: var(--muted); font-weight: 700; }
.chart svg { display: block; width: 100%; height: auto; }
.chart text { fill: var(--muted); font-family: var(--font-ui); font-weight: 800; font-size: 11px; }

/* Stepper control */
.ctl { display: grid; gap: 8px; background: var(--panel-3); border-radius: 8px; padding: 10px 12px; box-shadow: inset 0 0 0 2px rgba(0,0,0,0.25); }
.ctl label, .ctl .lbl { font-weight: 900; font-size: 14px; }
.stepper { display: grid; grid-template-columns: 38px minmax(0, 1fr) 38px; gap: 8px; align-items: center; }
.stepper button { height: 36px; border-radius: 7px; border: 0; cursor: pointer; background: var(--panel); color: var(--ink); font-size: 20px; font-weight: 900; box-shadow: inset 0 -3px 0 rgba(0,0,0,0.35), 0 0 0 2px #0b1027; }
.stepper button:active { transform: translateY(1px); }
.stepper output { display: block; text-align: center; background: var(--bg-deep); border-radius: 6px; padding: 6px 4px; font-size: 18px; font-weight: 900; font-variant-numeric: tabular-nums; box-shadow: inset 0 2px 0 rgba(0,0,0,0.4); }
input[type="range"] { width: 100%; accent-color: var(--accent); }
.zonebar { display: flex; height: 6px; border-radius: 3px; overflow: hidden; }
.zonelegend { display: flex; justify-content: space-between; font-size: 10.5px; color: var(--muted); font-weight: 800; }
.note { font-size: 12.5px; color: var(--gold); font-weight: 800; }

.choices { display: grid; grid-template-columns: repeat(auto-fit, minmax(130px, 1fr)); gap: 8px; }
.choice { position: relative; }
.choice input { position: absolute; opacity: 0; pointer-events: none; }
.choice > span { display: grid; align-content: start; gap: 3px; padding: 10px; border-radius: 8px; background: var(--panel-3); cursor: pointer; height: 100%; box-shadow: inset 0 -3px 0 rgba(0,0,0,0.3), 0 0 0 2px #0b1027; }
.choice > span b { font-size: 14px; } .choice > span b .num { font-size: 12.5px; margin-left: 6px; opacity: 0.85; }
.choice > span small { font-size: 12px; color: var(--muted); font-weight: 700; line-height: 1.3; }
.choice > span em.cost { font-style: normal; font-size: 12px; font-weight: 900; color: var(--gold); } .choice input:checked + span em.cost { color: #3d1c00; }
.choice input:checked + span { background: linear-gradient(var(--frame-light), var(--frame)); color: var(--accent-ink); }
.choice input:checked + span small { color: #3d1c00; }
.choice input:focus-visible + span { outline: 3px solid var(--gold); outline-offset: 2px; }
.choice input:disabled + span { opacity: 0.35; cursor: not-allowed; }
.choices.traits { grid-template-columns: repeat(2, minmax(0, 1fr)); }
.career .car-top { display: flex; gap: 12px; align-items: center; }
.car-lvl { flex: none; width: 44px; height: 44px; display: grid; place-items: center; border-radius: 10px; background: linear-gradient(var(--frame-light), var(--frame)); color: var(--accent-ink); font-family: var(--font-display); font-size: 22px; box-shadow: 0 0 0 3px var(--frame-dark); }
.car-title { font-family: var(--font-display); font-size: 18px; }
.career .mbar { height: 8px; border-radius: 4px; background: rgba(255,255,255,0.1); overflow: hidden; margin: 4px 0 2px; } .career .mbar i { display: block; height: 100%; background: var(--gold); }
.roofs { display: grid; grid-template-columns: repeat(auto-fill, minmax(120px, 1fr)); gap: 6px; }
.roofpick { display: flex; align-items: center; gap: 6px; padding: 6px 8px; border: 0; border-radius: 8px; background: var(--panel-3); color: var(--ink); font: inherit; font-size: 12px; font-weight: 800; cursor: pointer; text-align: left; }
.roofpick canvas { width: 32px; height: 24px; image-rendering: pixelated; flex: none; }
.roofpick.on { box-shadow: 0 0 0 2px var(--gold); } .roofpick:disabled { opacity: 0.45; cursor: not-allowed; }
.xp-parts { display: flex; flex-wrap: wrap; gap: 6px 14px; font-size: 13px; font-weight: 800; color: var(--muted); } .xp-parts b { color: var(--good); }
.reviews { display: grid; gap: 8px; }
.review { padding: 8px 10px; border-radius: 8px; background: var(--panel-2); display: grid; gap: 3px; }
.review.me { box-shadow: inset 3px 0 0 var(--frame); }
.rv-head { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; } .rv-head .muted { font-size: 12px; font-weight: 800; }
.rv-stars { margin-left: auto; color: var(--gold); letter-spacing: 1px; font-size: 15px; }
.rv-q { font-size: 13px; font-weight: 700; color: var(--muted); font-style: italic; }
.rules-box { padding: 10px 12px; border-radius: 10px; background: var(--panel-2); }
.rules-box summary { cursor: pointer; display: flex; gap: 8px; align-items: baseline; flex-wrap: wrap; }
.rules-box .orow { margin-top: 8px; }
.choices.row3 { grid-template-columns: repeat(3, minmax(0, 1fr)); align-content: start; }
@media (max-width: 520px) { .choices.traits { grid-template-columns: 1fr; } }
:root[data-theme="light"] .trait-card em { color: #8a5a00; }
.trait-card > span { grid-template-columns: 34px minmax(0, 1fr); column-gap: 10px; align-content: start; }
.trait-card canvas { grid-row: 1 / span 3; width: 34px; height: 34px; image-rendering: pixelated; background: rgba(0,0,0,0.25); border-radius: 6px; padding: 4px; box-sizing: border-box; }
.trait-card em { font-style: normal; font-size: 12.5px; font-weight: 900; color: var(--gold); }
.trait-card input:checked + span em { color: #3d1c00; }
.trait-card small { grid-column: 2; }
.qual { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 6px; }
.qual .choice span { text-align: center; font-family: var(--font-display); font-weight: 700; font-size: 18px; padding: 8px 0; }

.meter { display: grid; gap: 4px; }
.meter .row { display: flex; justify-content: space-between; font-size: 13px; }
.meter .track { height: 12px; border-radius: 6px; background: var(--bg-deep); overflow: hidden; box-shadow: inset 0 2px 0 rgba(0,0,0,0.4); }
.meter .track div { height: 100%; border-radius: 6px; }

.kv { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; }
.kv div { background: var(--panel-3); border-radius: 8px; padding: 8px 10px; display: grid; }
.kv span { font-size: 11px; color: var(--muted); text-transform: uppercase; letter-spacing: 0.06em; }
.kv b { font-size: 18px; font-variant-numeric: tabular-nums; }

.sumline { display: flex; justify-content: space-between; gap: 10px; font-size: 13.5px; }
@media (max-width: 640px) { .sumline:has(.fxrow) { flex-wrap: wrap; } .sumline .fxrow { margin-left: auto; } }
.sumline.total { border-top: 2px dashed rgba(255,255,255,0.12); padding-top: 6px; font-size: 15px; font-weight: 900; }

.rival { display: grid; grid-template-columns: minmax(0, 1fr) 150px; gap: 10px; align-items: center; background: var(--panel-3); padding: 10px; border-radius: 8px; border-left: 5px solid var(--pc); }
@media (max-width: 520px) { .rival { grid-template-columns: minmax(0, 1fr); } }
.own-bar { display: flex; height: 10px; border-radius: 5px; overflow: hidden; background: var(--bg-deep); margin-top: 6px; }
.locked { font-size: 13.5px; color: var(--muted); background: var(--panel-3); border: 2px dashed rgba(255,255,255,0.15); padding: 12px; border-radius: 8px; }

/* Feed */
.feed { display: grid; gap: 6px; max-height: 210px; overflow-y: auto; padding-right: 4px; }
.msg { display: grid; grid-template-columns: 44px minmax(0, 1fr); gap: 8px; align-items: start; font-size: 14px; line-height: 1.35; }
.msg > div { padding-top: 2px; }
.msg canvas { width: 28px; height: 28px; image-rendering: pixelated; border-radius: 5px; justify-self: center; }
.feed-round { display: flex; align-items: center; gap: 8px; margin: 4px 0 0; font-family: var(--font-pixel); font-size: 10px; color: var(--muted); text-transform: uppercase; letter-spacing: 0.08em; }
.feed-round::after { content: ""; flex: 1; height: 2px; background: rgba(255,255,255,0.07); }
:root[data-theme="light"] .feed-round::after { background: rgba(0,0,0,0.08); }
.feed-round:first-child { margin-top: 0; }
.msg .icon { width: 44px; height: 22px; padding: 0 5px; border-radius: 5px; display: grid; place-items: center; font-family: var(--font-pixel); font-size: 9.5px; letter-spacing: 0.02em; background: var(--gold); color: #2b1d00; }
.msg .icon.news { background: var(--accent); }
.msg .rnd { font-family: var(--font-pixel); font-size: 10px; color: var(--muted); margin-right: 6px; }
.msg b.who { margin-right: 4px; }

/* Modal (results / final / new game) */
.overlay { position: fixed; inset: 0; background: rgba(5, 8, 22, 0.72); display: grid; place-items: center; z-index: 20; padding: max(14px, env(safe-area-inset-top, 0px)) max(14px, env(safe-area-inset-right, 0px)) max(14px, env(safe-area-inset-bottom, 0px)) max(14px, env(safe-area-inset-left, 0px)); overflow-y: auto; }
.overlay .win { width: min(760px, 100%); max-height: calc(100% - 8px); overflow-y: auto; }
.kpis { display: grid; grid-template-columns: repeat(auto-fit, minmax(120px, 1fr)); gap: 8px; }
.kpi { background: var(--panel-3); border-radius: 8px; padding: 8px 10px; display: grid; }
.kpi span { font-size: 11px; color: var(--muted); text-transform: uppercase; letter-spacing: 0.06em; }
.kpi b { font-size: 20px; font-variant-numeric: tabular-nums; }
.segbar { display: grid; grid-template-columns: 94px minmax(0, 1fr) 46px; gap: 8px; align-items: center; font-size: 13.5px; }
.segbar .track { height: 14px; background: var(--bg-deep); border-radius: 4px; overflow: hidden; }
.form { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 12px; }
.form input[type="text"] { width: 100%; padding: 9px 10px; border-radius: 7px; border: 0; background: var(--bg-deep); box-shadow: inset 0 2px 0 rgba(0,0,0,0.4); font-weight: 800; }
select#wc-target { width: 100%; padding: 9px 10px; border-radius: 7px; border: 0; background: var(--bg-deep); color: var(--ink); box-shadow: inset 0 2px 0 rgba(0,0,0,0.4); font: inherit; font-weight: 800; }
.podium { display: grid; gap: 6px; }
.podium .row { display: grid; grid-template-columns: 34px 28px minmax(0, 1fr) auto; gap: 10px; align-items: center; background: var(--panel-3); padding: 8px 10px; border-radius: 8px; }
.podium .row.me { box-shadow: 0 0 0 2px var(--gold); }
.podium .rank { font-family: var(--font-display); font-weight: 700; font-size: 18px; text-align: center; }
.podium canvas { width: 28px; height: 28px; image-rendering: pixelated; border-radius: 5px; }

/* TV news */
.overlay .win.tvwin { width: min(640px, 100%); }
.tv { display: grid; gap: 10px; }
.tv-set { position: relative; background: linear-gradient(#6b4528, #3d2614); border-radius: 22px; padding: 16px 16px 12px; box-shadow: 0 0 0 3px #1e1209, inset 0 3px 0 rgba(255,255,255,0.12), 0 14px 30px rgba(0,0,0,0.5); margin-top: 26px; }
.tv-set::before, .tv-set::after { content: ""; position: absolute; top: -26px; width: 3px; height: 34px; background: #9aa3b5; border-radius: 2px; }
.tv-set::before { left: 42%; transform: rotate(-28deg); }
.tv-set::after { left: 56%; transform: rotate(28deg); }
.tv.inline .tv-set { margin-top: 0; }
.tv.inline .tv-set::before, .tv.inline .tv-set::after { display: none; }
.tv-screen { position: relative; border-radius: 14px; overflow: hidden; background: #000; box-shadow: 0 0 0 4px #1a1009, inset 0 0 30px rgba(0,0,0,0.6); }
.tv-screen canvas { display: block; width: 100%; height: auto; image-rendering: pixelated; }
.tv-screen::after { content: ""; position: absolute; inset: 0; background: repeating-linear-gradient(rgba(0,0,0,0.16) 0 1px, transparent 1px 3px), radial-gradient(ellipse at center, transparent 55%, rgba(0,0,0,0.45)); pointer-events: none; }
.tv-logo { position: absolute; top: 8px; left: 10px; font-family: var(--font-display); font-weight: 700; font-size: 13px; color: #fff; background: var(--accent); padding: 1px 6px; border-radius: 3px; }
.tv-live { position: absolute; top: 8px; right: 10px; font-family: var(--font-display); font-weight: 700; font-size: 12px; color: #fff; background: #d62828; padding: 1px 6px; border-radius: 3px; }
.tv-lower { position: absolute; left: 0; right: 0; bottom: 22px; display: flex; align-items: stretch; }
.tv-tag { background: #d62828; color: #fff; font-family: var(--font-display); font-weight: 700; font-size: clamp(9px, 1.7vw, 13px); padding: 4px 8px; text-transform: uppercase; white-space: nowrap; display: grid; place-items: center; }
.tv-head { flex: 1; background: rgba(248, 244, 232, 0.96); color: #10142c; font-family: var(--font-display); font-weight: 700; font-size: clamp(11px, 2.3vw, 18px); padding: 4px 10px; line-height: 1.2; }
.tv-ticker { position: absolute; left: 0; right: 0; bottom: 0; height: 22px; background: #0a0f24; color: var(--gold); font-weight: 800; font-size: 13px; overflow: hidden; white-space: nowrap; display: flex; align-items: center; }
.tv-ticker span { display: inline-block; padding-left: 100%; animation: ticker 16s linear infinite; }
@keyframes ticker { to { transform: translateX(-100%); } }
.tv-panel { display: flex; align-items: center; gap: 10px; padding: 10px 6px 0; }
.tv-grill { flex: 1; height: 12px; border-radius: 4px; background: repeating-linear-gradient(90deg, #2a190c 0 3px, #4a2f1a 3px 6px); }
.tv-knob { width: 16px; height: 16px; border-radius: 50%; background: radial-gradient(circle at 35% 35%, #d9d9d9, #6b6b6b); box-shadow: 0 0 0 2px #1e1209; }
.fxrow { display: flex; flex-wrap: wrap; gap: 6px; justify-content: center; }
.fx { white-space: nowrap; font-size: 13px; font-weight: 900; padding: 4px 10px; border-radius: 999px; background: var(--panel-3); box-shadow: inset 0 0 0 2px rgba(255,255,255,0.08); }
.fx.up { color: var(--good); box-shadow: inset 0 0 0 2px rgba(79,217,135,0.4); }
.fx.down { color: var(--bad); box-shadow: inset 0 0 0 2px rgba(255,98,98,0.4); }
.fx.dur { color: var(--muted); }
@media (prefers-reduced-motion: reduce) { .tv-ticker span { animation: none; padding-left: 8px; } }
.subtabs { display: flex; flex-wrap: wrap; gap: 6px; }
.subtabs button { border: 0; cursor: pointer; padding: 7px 12px; border-radius: 7px; background: var(--panel-3); font-weight: 900; font-size: 13px; box-shadow: inset 0 -3px 0 rgba(0,0,0,0.3); }
.subtabs button[aria-pressed="true"] { background: linear-gradient(var(--frame-light), var(--frame)); color: var(--accent-ink); }
.research { display: grid; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); gap: 8px; }
.research .choice span b { display: flex; justify-content: space-between; gap: 6px; }

#tip { position: fixed; z-index: 60; max-width: 300px; padding: 7px 10px; background: #060a1f; color: var(--ink); border: 2px solid var(--frame); border-radius: 7px; font-size: 13px; font-weight: 800; line-height: 1.4; white-space: pre-line; pointer-events: none; font-variant-numeric: tabular-nums; box-shadow: 0 6px 18px rgba(0,0,0,0.5); }
[data-tip] { cursor: help; }
button[data-tip] { cursor: pointer; }
.tbl { overflow-x: auto; }
.tbl table { width: 100%; border-collapse: collapse; font-size: 13px; }
.tbl th, .tbl td { padding: 6px 7px; border-bottom: 1px solid rgba(255,255,255,0.07); text-align: left; white-space: nowrap; }
.tbl th { font-size: 11px; color: var(--muted); text-transform: uppercase; letter-spacing: 0.06em; }
.tbl .r { text-align: right; }
.tbl.compact th, .tbl.compact td { padding: 6px 5px; }
.tbl.compact th { letter-spacing: 0.02em; }
.tbl tr.me td { background: rgba(243, 144, 47, 0.12); }
.tbl tr.total td { font-weight: 900; border-top: 2px solid rgba(255,255,255,0.15); }
.tbl tr.locked-row td { opacity: 0.5; }
.dot { display: inline-block; width: 10px; height: 10px; border-radius: 2px; margin-right: 6px; vertical-align: -1px; }
.segbar .track.stack { display: flex; }
.segbar .track.stack div { height: 100%; }
.newscard { display: grid; grid-template-columns: 40px minmax(0, 1fr); gap: 10px; align-items: start; background: var(--panel-3); border-radius: 8px; padding: 10px; }
.newscard .icon { width: 40px; height: 28px; border-radius: 5px; display: grid; place-items: center; font-family: var(--font-pixel); font-size: 10px; background: var(--accent); color: #2b1d00; }
.mbtn { position: relative; }
.menu h2.grp { font-size: 11px; color: var(--muted); text-transform: uppercase; letter-spacing: 0.06em; margin-top: 4px; }
.mbtn .tag { position: absolute; top: 4px; right: 4px; padding: 1px 5px; border-radius: 4px; font-family: var(--font-ui); font-size: 10px; font-weight: 900; background: var(--good); color: #062614; }
.mbtn .tag.req { background: var(--bad); color: #fff; }
.mbtn .tag.gold { background: var(--gold); color: #2b1d00; }
.mbtn .tag.done { background: transparent; color: var(--good); font-size: 14px; padding: 0; }
.agenda { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; padding: 8px 12px; }
.agenda .lbl { font-family: var(--font-display); font-size: 13px; font-weight: 700; margin-right: 4px; }
.agenda button { border: 0; cursor: pointer; padding: 7px 12px; border-radius: 7px; font-weight: 900; font-size: 13px; background: var(--panel-3); color: var(--ink); box-shadow: inset 0 -3px 0 rgba(0,0,0,0.3); }
.agenda button.req { background: var(--bad); color: #fff; }
.agenda button.gold { background: var(--gold); color: #2b1d00; }
.agenda button.new { background: var(--good); color: #062614; }
.intro { font-size: 13.5px; font-weight: 700; line-height: 1.45; background: var(--panel-3); border-left: 4px solid var(--gold); padding: 8px 12px; border-radius: 6px; margin-bottom: 12px; }
.intro b { color: var(--gold); }
.steps { margin: 0; padding: 0; list-style: none; display: grid; gap: 9px; counter-reset: st; }
.steps li { display: grid; grid-template-columns: 26px minmax(0, 1fr); gap: 10px; font-size: 13.5px; line-height: 1.45; }
.steps li::before { counter-increment: st; content: counter(st); width: 26px; height: 26px; border-radius: 6px; background: var(--gold); color: #2b1d00; display: grid; place-items: center; font-family: var(--font-display); font-weight: 700; }
.own-wrap { position: relative; padding-top: 12px; }
.trade { display: grid; gap: 6px; }
.trade .tl { font-size: 11px; font-weight: 900; text-transform: uppercase; letter-spacing: 0.06em; color: var(--muted); }
.trade .tl.sell { color: var(--bad); }
.own-wrap .own-bar { margin-top: 0; }
.own-wrap .half { position: absolute; left: 50%; top: 0; bottom: -3px; width: 2px; background: #fff; }
.own-wrap .half span { position: absolute; top: -2px; left: 4px; font-size: 10px; font-weight: 900; white-space: nowrap; }
.legend { display: flex; flex-wrap: wrap; gap: 4px 12px; font-size: 12px; color: var(--muted); font-weight: 700; }
.legend i { display: inline-block; width: 10px; height: 10px; border-radius: 2px; margin-right: 4px; vertical-align: -1px; }
.vote-opts { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 12px; }
.vote-opt { display: grid; gap: 10px; align-content: start; background: var(--panel-3); padding: 14px; border-radius: 10px; box-shadow: 0 0 0 2px #0b1027; }
.vote-opt h3 { margin: 0; font-family: var(--font-display); font-size: 18px; font-weight: 700; }
.vote-opt.picked { box-shadow: 0 0 0 3px var(--gold); }
.vote-opt .fxrow { justify-content: flex-start; }
.sheet-h { display: flex; justify-content: space-between; align-items: center; gap: 10px; }
.btn.small { padding: 5px 10px; font-size: 11px; }
.reqbox { background: rgba(255,98,98,0.12); box-shadow: inset 0 0 0 2px var(--bad); }
.mbtn .badge { position: absolute; top: 4px; right: 6px; min-width: 18px; height: 18px; padding: 0 4px; border-radius: 9px; background: var(--bad); color: #fff; font-family: var(--font-ui); font-size: 11px; font-weight: 900; display: grid; place-items: center; }

.srows { display: grid; gap: 6px; position: relative; }
.srow { display: grid; grid-template-columns: 30px 28px minmax(0, 1fr) auto auto; gap: 10px; align-items: center; background: var(--panel-3); padding: 8px 10px; border-radius: 8px; border-left: 5px solid var(--pc); transition: transform 600ms cubic-bezier(.3, 1.3, .5, 1); }
.srow canvas { width: 28px; height: 28px; image-rendering: pixelated; border-radius: 4px; }
.srow.me { box-shadow: 0 0 0 2px var(--gold); }
.srow .rank { font-family: var(--font-display); font-weight: 700; font-size: 18px; text-align: center; }
.srow .sprofit, .srow .sval { font-weight: 900; font-variant-numeric: tabular-nums; opacity: 0; transition: opacity 250ms; text-align: right; }
.srow .sval small { font-size: 11px; margin-left: 4px; }
.srow.in .sprofit, .srow.in .sval { opacity: 1; }
@media (max-width: 560px) { .srow { grid-template-columns: 24px 24px minmax(0, 1fr) auto; } .srow .sprofit { display: none; } }
.boardroom { background: #1a0f08; border-radius: 8px; padding: 6px; box-shadow: inset 0 0 0 3px #3a2416; }
.boardroom canvas { display: block; width: 100%; height: auto; image-rendering: pixelated; border-radius: 4px; }
.title-chip { display: inline-block; font-size: 11px; font-weight: 900; padding: 1px 7px; border-radius: 999px; background: var(--gold); color: #2b1d00; margin: 2px 4px 2px 0; }
.ctl input[type="text"] { width: 100%; padding: 9px 10px; border-radius: 7px; border: 0; background: var(--bg-deep); color: var(--ink); box-shadow: inset 0 2px 0 rgba(0,0,0,0.4); font: inherit; font-weight: 800; }
.optwin { width: min(620px, 100%) !important; }
.lobby { max-width: 1000px; width: 100%; margin: 0 auto; }
.coach { position: fixed; left: 50%; transform: translateX(-50%); bottom: 16px; z-index: 19; width: min(340px, calc(100vw - 32px)); padding: 12px 14px; border-radius: 10px; background: linear-gradient(#f0d898, #e2c27a); color: #2b1d00; font-weight: 800; font-size: 14px; line-height: 1.4; display: grid; gap: 6px; box-shadow: 0 10px 30px rgba(0,0,0,0.45), 0 0 0 3px #8a6420; }
.coach[hidden] { display: none; }
.coach .coach-k { font-size: 11px; font-weight: 900; text-transform: uppercase; letter-spacing: 0.08em; color: #7a5716; }
.coach .linkbtn { color: #7a5716; justify-self: start; font-size: 12.5px; }
.coach-hl { outline: 3px solid var(--gold) !important; outline-offset: 2px; animation: coachpulse 1.1s ease-in-out infinite; position: relative; z-index: 2; }
@keyframes coachpulse { 50% { outline-color: rgba(255, 207, 74, 0.25); } }
@media (max-width: 640px) { .coach { bottom: auto; top: 6px; padding: 8px 10px; font-size: 13px; gap: 4px; box-shadow: 0 6px 18px rgba(0,0,0,0.45); } .coach .coach-k { font-size: 10px; } }
.acc-chip { position: absolute; top: 14px; right: 14px; z-index: 3; display: grid; justify-items: end; gap: 1px; padding: 7px 12px; border: 0; border-radius: 8px; cursor: pointer; background: rgba(22, 30, 64, 0.94); color: var(--ink); box-shadow: 0 0 0 3px var(--frame-dark), inset 0 -3px 0 rgba(0,0,0,0.3); font: inherit; }
:root[data-theme="light"] .acc-chip { background: rgba(255, 250, 240, 0.95); }
.acc-chip b { font-family: var(--font-display); font-size: 14px; }
.acc-chip span { font-size: 11.5px; font-weight: 900; color: var(--muted); letter-spacing: 0.06em; }
.acc-chip .badge { position: absolute; top: -6px; left: -6px; }
@media (max-width: 640px) { .acc-chip { top: 6px; right: 6px; grid-auto-flow: column; align-items: baseline; gap: 8px; padding: 4px 9px; } .acc-chip b { font-size: 12px; } .acc-chip span { font-size: 10.5px; } .title-logo { margin-top: 24px; } }
.tside .soon.new { background: var(--good); color: #062614; }
.invitebar { position: fixed; top: 12px; left: 50%; transform: translateX(-50%); z-index: 40; display: flex; gap: 8px; align-items: center; flex-wrap: wrap; justify-content: center; max-width: calc(100vw - 24px); padding: 10px 14px; border-radius: 10px; background: linear-gradient(#f0d898, #e2c27a); color: #2b1d00; font-weight: 800; box-shadow: 0 10px 30px rgba(0,0,0,0.45), 0 0 0 3px #8a6420; }
.invitebar[hidden] { display: none; }
.frow { display: grid; grid-template-columns: 12px minmax(0, 1fr) auto auto; gap: 8px; align-items: center; padding: 7px 4px; border-bottom: 1px solid rgba(255,255,255,0.07); }
.frow .btn { padding: 5px 10px; }
.odot { width: 10px; height: 10px; border-radius: 50%; background: #5b6690; }
.odot.on { background: var(--good); box-shadow: 0 0 8px var(--good); }
.achwin { width: min(860px, 100%) !important; }
.achgrid { display: grid; grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); gap: 8px; }
.achcard { display: grid; grid-template-columns: 42px minmax(0, 1fr); gap: 10px; align-items: center; padding: 10px; border-radius: 9px; background: var(--panel-3); opacity: 0.7; }
.achcard.got { opacity: 1; background: linear-gradient(#f0d898, #e2c27a); color: #2b1d00; box-shadow: 0 0 0 2px #8a6420; }
.achcard small { display: block; font-size: 12px; font-weight: 700; }
.achcard .mbar { height: 7px; margin-top: 4px; }
.ach-ico { font-size: 30px; text-align: center; }
.toast { position: fixed; top: 16px; left: 50%; transform: translate(-50%, -140%); z-index: 70; display: flex; gap: 10px; align-items: center; padding: 10px 16px; border-radius: 10px; background: linear-gradient(#f0d898, #e2c27a); color: #2b1d00; box-shadow: 0 10px 30px rgba(0,0,0,0.5), 0 0 0 3px #8a6420; transition: transform 300ms cubic-bezier(.2, 1.3, .4, 1); pointer-events: none; }
.toast.show { transform: translate(-50%, 0); }
.toast small { display: block; font-size: 11px; font-weight: 900; text-transform: uppercase; letter-spacing: 0.08em; color: #7a5716; }
.toast b { font-family: var(--font-display); font-size: 16px; }
input[type="email"] { padding: 9px 10px; border-radius: 7px; border: 0; background: var(--bg-deep); color: var(--ink); font: inherit; font-weight: 800; box-shadow: inset 0 2px 0 rgba(0,0,0,0.4); }
html.tvmode body { overflow: hidden; }
html.tvmode .tv { position: fixed; inset: 0; display: grid; grid-template-rows: auto 1fr; gap: 14px; padding: 18px 22px; background: radial-gradient(ellipse at 50% 0%, #22306b, #0a0f24 70%); color: var(--ink); overflow: hidden; }
html.tvmode[data-theme="light"] .tv { background: radial-gradient(ellipse at 50% 0%, #fff2d8, #e8dcc2 70%); }
html.tvmode .tvp-head { display: flex; align-items: center; gap: 18px; }
html.tvmode .tv-brand { display: flex; align-items: center; gap: 12px; margin-right: auto; } html.tvmode .tv-brand canvas { width: 44px; height: 44px; image-rendering: pixelated; }
html.tvmode .tv-brand b { font-family: var(--font-display); font-size: clamp(22px, 2.6vw, 38px); } html.tvmode .tv-brand span { font-weight: 900; color: var(--muted); }
html.tvmode .tv-code, html.tvmode .tv-round { display: grid; justify-items: center; padding: 8px 18px; border-radius: 10px; background: rgba(0,0,0,0.3); box-shadow: 0 0 0 3px var(--frame-dark); }
html.tvmode .tv-code span, html.tvmode .tv-round span { font-size: 13px; font-weight: 900; color: var(--muted); text-transform: uppercase; letter-spacing: .08em; }
html.tvmode .tv-code b { font-family: var(--font-display); font-size: clamp(26px, 3vw, 44px); color: var(--gold); letter-spacing: .15em; }
html.tvmode .tv-round b { font-family: var(--font-display); font-size: clamp(26px, 3vw, 44px); } html.tvmode .tv-round b.low { color: var(--bad); }
html.tvmode .tv-main { display: grid; grid-template-columns: minmax(0, 1fr) minmax(280px, 26vw); gap: 16px; min-height: 0; }
html.tvmode .tv-city { display: flex; align-items: flex-end; justify-content: space-around; gap: 2vw; padding: 20px 2vw 10px; border-radius: 14px; background: linear-gradient(#0d1430 0%, #1a2350 75%, #2a2a2a 75.5%, #1d1d1d 100%); box-shadow: 0 0 0 3px var(--frame-dark); min-height: 0; }
html.tvmode .tv-bld { flex: 1; max-width: 220px; height: 100%; display: grid; grid-template-rows: auto 1fr auto auto; justify-items: center; align-items: end; text-align: center; gap: 4px; }
html.tvmode .tv-tower { width: 72%; height: 100%; display: flex; align-items: flex-end; } html.tvmode .tv-tower i { display: block; width: 100%; height: var(--h); background: repeating-linear-gradient(0deg, var(--pc) 0 18px, rgba(255, 209, 102, 0.85) 18px 24px, var(--pc) 24px 30px); border: 3px solid rgba(0,0,0,0.35); border-bottom: 0; transition: height 1.2s cubic-bezier(.2, 1.2, .4, 1); }
html.tvmode .tv-bld.dead .tv-tower i { background: #555; }
html.tvmode .tv-bld b { font-family: var(--font-display); font-size: clamp(14px, 1.4vw, 22px); color: #fff; } html.tvmode .tv-bld span { font-weight: 800; color: #c8d0f0; font-size: clamp(12px, 1.1vw, 17px); }

  function bindLobby() {

    on("#btn-leave", "click", async () => { try { await api().rpc("leave_game", { p_game_id: MP.gameId }); } catch (e) {} mpStop(); mpForget(); MP.gameId = null; S = { screen: "title", opts: S.opts || DEFAULT_OPTS, modal: null }; render(); });
    on("#btn-mp-start", "click", async () => {
      MP.working = true; MP.error = ""; render();
      try { await api().call("start", { game_id: MP.gameId }); } catch (e) { MP.error = e.message; }

  async function onlineAction(kind) {
    const val = (id) => (modal.querySelector(id) || {}).value || "";
    const name = val("#mp-name").trim(), company = val("#mp-company").trim(), trait = (modal.querySelector('input[name="mp-trait"]:checked') || {}).value || "visionary", code = val("#mp-code").trim().toUpperCase();
    S.opts = { ...(S.opts || DEFAULT_OPTS), name: name || (S.opts || {}).name, company: company || (S.opts || {}).company, trait };
    if (kind !== "rejoin" && (!name || !company)) { S.onlineError = "Fill in your name and company name first."; renderModal(); bindModal(); return; }
    if (kind === "join" && !/^[A-Z0-9]{6}$/.test(code)) { S.onlineError = "Game codes are 6 letters and numbers."; renderModal(); bindModal(); return; }
    S.onlineBusy = true; S.onlineError = ""; renderModal(); bindModal();
    try {
      await api().signIn();
      let res;
      if (kind === "create") res = await api().rpc("create_game", { p_player_name: name, p_company_name: company, p_trait: trait, p_industry: "chocolate", p_difficulty: "standard", p_mode: "live", p_rounds: 8 });
      else if (kind === "join") res = await api().rpc("join_game", { p_code: code, p_player_name: name, p_company_name: company, p_trait: trait });
      else { const sv = mpLocal(); res = { game_id: sv.gameId, player_id: sv.playerId }; }
      S.onlineBusy = false; S.modal = null;
      await mpEnter(res.game_id, res.player_id);
    } catch (e) {
      S.onlineBusy = false;
      S.onlineError = /duplicate key.*company/i.test(e.message) ? "Someone in that game already uses that company name." : e.message;
      if (S.screen === "title") { S.modal = "online"; renderModal(); bindModal(); }
    }
  }


  // ======================================================================
  // The desk: a pixel calculator and a notepad, floating above the game.
  // Click any number in a table while it's open to paste it in.
  // ======================================================================
  const CALC = { open: false, tab: "calc", cur: "0", acc: null, op: null, fresh: true, mem: 0, tape: [], pos: null, flash: "" };
  try { const p = JSON.parse(localStorage.getItem("ft-calc-pos") || "null"); if (p && Number.isFinite(p.x)) CALC.pos = p; } catch (e) {}
  const OPS = { "+": (a, b) => a + b, "−": (a, b) => a - b, "×": (a, b) => a * b, "÷": (a, b) => (b === 0 ? NaN : a / b) };
  const calcVal = () => Number(CALC.cur);
  const tidy = (x) => (Number.isFinite(x) ? Math.round(x * 1e9) / 1e9 : NaN);
  // Calculator display: digits grouped like the rest of the game; huge or tiny results as "9.8765 × 10¹⁹" (never "e+19").
  const SUP = "⁰¹²³⁴⁵⁶⁷⁸⁹";
  function calcFmt(str) {
    if (str === "Error") return str;
    const n = String(str), x = Number(n);
    if (!Number.isFinite(x)) return "Error";
    if (Math.abs(x) >= 1e15 || (x !== 0 && Math.abs(x) < 1e-6) || /e/i.test(n)) {
      const [m, e] = x.toExponential(4).split("e"), ex = Number(e);
      return m.replace(/\.?0+$/, "").replace("-", "−") + " × 10" + (ex < 0 ? "⁻" : "") + String(Math.abs(ex)).split("").map((d) => SUP[d]).join("");
    }
    const neg = n.startsWith("-"), [a, b] = (neg ? n.slice(1) : n).split(".");
    // At most 12 significant digits in total, so long decimals don't push the number out of the display.
    const room = Math.max(1, 12 - String(Number(a || 0)).length);
    const dec = b === undefined ? "" : "." + b.slice(0, room);
    return (neg ? "−" : "") + Number(a || 0).toLocaleString("en") + dec;
  }
  // The pixel font has no superscript digits: show "× 10¹⁹" on the display with a real <sup>.
  const lcdHtml = (t) => esc(t).replace(new RegExp("[⁻" + SUP + "]+", "g"), (m) => "<sup>" + m.split("").map((ch) => (ch === "⁻" ? "−" : SUP.indexOf(ch))).join("") + "</sup>");
  const lcdSize = (t) => (t.length > 19 ? "xs" : t.length > 14 ? "sm" : "");
  const numFmt = (x) => calcFmt(String(tidy(x)));
  function calcPress(k) {
    const C = CALC;
    if (C.cur === "Error" && k !== "C") { C.cur = "0"; C.fresh = true; }
    if (/^[0-9]$/.test(k)) {
      if (C.fresh) { C.cur = k; C.fresh = false; }
      else if (C.cur.replace(/[-.]/g, "").length < 15) C.cur = C.cur === "0" ? k : C.cur === "-0" ? "-" + k : C.cur + k;
    } else if (k === ".") {
      if (C.fresh) { C.cur = "0."; C.fresh = false; } else if (!C.cur.includes(".")) C.cur += ".";
    } else if (k === "⌫") {
      if (!C.fresh) { C.cur = C.cur.slice(0, -1); if (C.cur === "" || C.cur === "-") { C.cur = "0"; C.fresh = true; } }
    } else if (k === "C") {
      if (C.cur !== "0" && !C.fresh) { C.cur = "0"; C.fresh = true; } else { C.acc = null; C.op = null; C.cur = "0"; C.fresh = true; }
    } else if (k === "±") {
      C.cur = C.cur.startsWith("-") ? C.cur.slice(1) : C.cur === "0" ? "0" : "-" + C.cur;
    } else if (k === "%") {
      const v = calcVal();
      C.cur = String(tidy(C.acc !== null && (C.op === "+" || C.op === "−") ? (C.acc * v) / 100 : v / 100)); C.fresh = true;
    } else if (OPS[k]) {
      if (C.acc !== null && C.op && !C.fresh) calcEquals(false);
      C.acc = calcVal(); C.op = k; C.fresh = true;
    } else if (k === "=") calcEquals(true);
    else if (k === "MC") C.mem = 0;
    else if (k === "MR") { C.cur = String(tidy(C.mem)); C.fresh = true; }
    else if (k === "M+") { C.mem = tidy(C.mem + calcVal()); C.fresh = true; }
    else if (k === "M−") { C.mem = tidy(C.mem - calcVal()); C.fresh = true; }
    renderCalcBody();
  }
  function calcEquals(log) {
    const C = CALC;
    if (C.acc === null || !C.op) return;
    const b = calcVal(), r = tidy(OPS[C.op](C.acc, b));
    if (log) C.tape.push(`${numFmt(C.acc)} ${C.op} ${numFmt(b)} = ${Number.isFinite(r) ? numFmt(r) : "Error"}`);
    if (C.tape.length > 30) C.tape.shift();
    C.cur = Number.isFinite(r) ? String(r) : "Error"; C.acc = null; C.op = null; C.fresh = true;
  }
  function calcPaste(n, label) {
    CALC.cur = String(tidy(n)); CALC.fresh = true; CALC.flash = label || "";
    renderCalcBody();
  }
  const CALC_KEYS = [["MC", "mem"], ["MR", "mem"], ["M+", "mem"], ["M−", "mem"], ["C", "clr"], ["⌫", "fn"], ["%", "fn"], ["÷", "op"], ["7"], ["8"], ["9"], ["×", "op"], ["4"], ["5"], ["6"], ["−", "op"], ["1"], ["2"], ["3"], ["+", "op"], ["±", "fn"], ["0"], ["."], ["=", "eq"]];
  function calcHtml() {
    const C = CALC;
    const notes = notesGet();
    return `<div class="win-title" id="calc-drag"><span>Desk</span><span class="calc-tabs" role="tablist"><button type="button" role="tab" data-ctab="calc" aria-selected="${C.tab === "calc"}">Calculator</button><button type="button" role="tab" data-ctab="notes" aria-selected="${C.tab === "notes"}">Notes</button></span><button class="x calc-x" type="button" id="calc-close" aria-label="Close the desk">×</button></div>
      <div class="win-body" id="calc-body">${C.tab === "calc" ? calcBodyHtml() : `<textarea id="notes-ta" class="notes" placeholder="Your plan, assumptions, rivals' habits… Saved with this game." aria-label="Notes">${esc(notes)}</textarea><div class="hint">Saved automatically for this game.</div>`}</div>`;
  }
  function calcBodyHtml() {
    const C = CALC;
    return `<div class="lcd" aria-live="polite"><div class="lcd-top"><span>${C.mem ? "M " + lcdHtml(numFmt(C.mem)) : ""}</span><span>${C.acc !== null && C.op ? lcdHtml(numFmt(C.acc)) + " " + C.op : C.flash ? "pasted: " + esc(C.flash) : ""}</span></div><div class="lcd-num ${lcdSize(calcFmt(C.cur))}">${lcdHtml(calcFmt(C.cur))}</div></div>
      <div class="keys">${CALC_KEYS.map(([k, cls]) => `<button type="button" class="key ${cls || ""} ${C.op === k && C.fresh ? "armed" : ""}" data-k="${k}" aria-label="${{ "⌫": "Backspace", "±": "Plus or minus", "−": "Minus", "×": "Times", "÷": "Divide by", "M−": "Memory minus" }[k] || k}">${k}</button>`).join("")}</div>
      <div class="tape" aria-label="Calculation history">${C.tape.length ? C.tape.slice(-6).map((t) => `<div>${esc(t)}</div>`).join("") : `<div class="muted">Tip: click any number in a table to paste it here. Keyboard works too.</div>`}</div>`;
  }
  function renderCalcBody() {
    const b = $("#calc-body");
    if (b && CALC.tab === "calc") b.innerHTML = calcBodyHtml();
  }
  let calcEl = null;
  function renderCalc() {
    if (!calcEl) {
      calcEl = document.createElement("section");
      calcEl.className = "win calcwin"; calcEl.id = "calcwin"; calcEl.setAttribute("aria-label", "Desk: calculator and notes");
      document.body.appendChild(calcEl);
      calcEl.addEventListener("click", (e) => {
        const k = e.target.closest("[data-k]"), t = e.target.closest("[data-ctab]");
        if (k) { calcPress(k.dataset.k); sfx("click"); }
        if (t) { CALC.tab = t.dataset.ctab; renderCalc(); }
        if (e.target.closest("#calc-close")) toggleCalc(false);
      });
      calcEl.addEventListener("input", (e) => { if (e.target.id === "notes-ta") notesSet(e.target.value); });
      calcEl.addEventListener("pointerdown", calcDragStart);
    }
    calcEl.hidden = !CALC.open || !S || S.screen !== "game" || !S.game;
    if (calcEl.hidden) return;
    calcEl.innerHTML = calcHtml();
    if (CALC.pos && window.innerWidth > 640) { calcEl.style.left = Math.min(CALC.pos.x, window.innerWidth - 120) + "px"; calcEl.style.top = Math.min(Math.max(0, CALC.pos.y), window.innerHeight - 60) + "px"; calcEl.style.right = "auto"; calcEl.style.bottom = "auto"; }
    else { calcEl.style.left = calcEl.style.top = calcEl.style.right = calcEl.style.bottom = ""; }
  }
  function toggleCalc(open) {
    CALC.open = open === undefined ? !CALC.open : open;
    renderCalc();
    const b = $("#btn-calc"); if (b) b.setAttribute("aria-pressed", String(CALC.open));
  }
  function calcDragStart(e) {

  // ----- CEO career: XP from every finished game, a title per level, rooftop decorations to unlock (cosmetic only).
  const LEVELS = [[0, "Intern"], [200, "Trainee"], [500, "Junior Analyst"], [900, "Manager"], [1400, "Director"], [2000, "Vice President"], [2800, "CEO"], [3800, "Chairman"], [5000, "Tycoon"], [6500, "Shark"], [8500, "Mogul"], [11000, "Legend"]];
  const ROOFTOPS = ["Plain roof", "Antenna", "Satellite dish", "Helipad", "Rooftop garden", "Golden dome", "Giant logo", "Rooftop pool", "Statue of you", "Rocket", "Diamond spire", "Money vault"];
  const xpNow = () => Math.max(localGet("ft-stats", {}).xp || 0, (ACC.profile && ACC.profile.stats && ACC.profile.stats.xp) || 0);
  function levelOf(xp) {
    let i = 0;
    while (i + 1 < LEVELS.length && xp >= LEVELS[i + 1][0]) i++;
    return { i, title: LEVELS[i][1], from: LEVELS[i][0], next: LEVELS[i + 1] ? LEVELS[i + 1][0] : null, nextTitle: LEVELS[i + 1] ? LEVELS[i + 1][1] : null };

  /** XP for a finished game: playing, placing, missions, takeovers, new achievements, playing online or the daily. */
  function gameXp(place, players, missionDone, controls, freshAch, mode) {
    const placeXp = place === 1 ? 200 : place === 2 ? 120 : place === 3 ? 80 : 40;

    if (mode === "daily") parts.push(["Daily challenge", 50]);
    const total = Math.min(600, parts.reduce((a, p) => a + p[1], 0));
    return { total, parts };
  }
  function careerCard(compact) {
    const xp = xpNow(), L = levelOf(xp), pct = L.next ? Math.round(((xp - L.from) / (L.next - L.from)) * 100) : 100;

    const roofs = ROOFTOPS.map((n, k) => `<button type="button" class="roofpick ${k === roof ? "on" : ""}" data-roof="${k}" ${k > L.i ? "disabled" : ""}${tipAttr(k > L.i ? "Unlocks at " + LEVELS[k][1] + " (" + LEVELS[k][0].toLocaleString("en") + " XP)" : n)}><canvas data-roofico="${k}" width="16" height="12" aria-hidden="true"></canvas><span>${k > L.i ? "🔒 " : ""}${esc(n)}</span></button>`).join("");

  // Rooftop decorations, drawn on top of a building in the skyline (and as small icons in the picker).
  function drawRoof(g, k, cx, top, color, light) {
    const px = (x, y, w, h, c) => { g.fillStyle = c; g.fillRect(Math.round(cx + x), Math.round(top + y), w, h); };
    switch (k) {
      case 1: px(0, -14, 1, 14, "#cfd6e6"); px(-2, -10, 5, 1, "#cfd6e6"); px(0, -15, 1, 1, cityFrame % 12 < 6 ? "#ff4d4d" : "#6a1f1f"); break;
      case 2: px(-5, -7, 10, 2, "#e6e9f2"); px(-4, -9, 8, 2, "#e6e9f2"); px(-1, -5, 2, 5, "#9aa3b5"); px(3, -12, 1, 4, "#9aa3b5"); break;

    el.textContent = left >= 3600 ? Math.floor(left / 3600) + "h " + String(Math.floor((left % 3600) / 60)).padStart(2, "0") + "m" : Math.floor(left / 60) + ":" + String(left % 60).padStart(2, "0");
    el.classList.toggle("low", left <= 30);
    document.querySelectorAll("[data-tv-lot]").forEach((x) => { const end = Number(x.dataset.end); const l = Math.max(0, Math.ceil((end - Date.now() - (TV.skew || 0)) / 1000)); x.textContent = !end ? "open" : l <= 0 ? "SOLD!" : l <= 10 ? "Going twice… " + l + "s" : l <= 25 ? "Going once… " + l + "s" : l + "s"; });
    if (TV.show && Date.now() > TV.showUntil) { TV.show = null; render(); }
  }
  function tvScreen() {
    const d = TV.data;

    const head = `<header class="tvp-head"><div class="tv-brand"><canvas data-ticon="logo" width="12" height="12" aria-hidden="true"></canvas><b>Friendly Takeover</b><span>Party mode · ${esc((FT.INDUSTRIES[g.industry] || {}).name || "")}</span></div>
      <div class="tv-code"><span>Game code</span><b>${esc(g.code)}</b></div>
      ${g.status === "playing" ? `<div class="tv-round"><span>Round ${g.current_round} / ${g.rounds}</span><b id="tv-timer">…</b></div>` : g.status === "finished" ? `<div class="tv-round"><span>Game over</span><b>🏆</b></div>` : `<div class="tv-round"><span>Lobby</span><b>${d.players.length} in</b></div>`}</header>`;
    if (g.status === "lobby") {
      const cards = d.players.map((p, i) => `<div class="tv-player" style="--pc:${css(COLORS[i % COLORS.length])}"><canvas data-tavatar="${esc(p.id)}" data-color="${i}" width="12" height="12" aria-hidden="true"></canvas><b>${esc(p.name)}</b><span>${esc(p.company)}</span>${p.is_host ? '<i>host</i>' : ""}</div>`).join("");
      return `<section class="tv">${head}<div class="tv-lobby"><h2>Grab your phone and join</h2><div class="tv-join">${esc(join.replace(/^https?:\/\//, ""))}</div><p>or open the game, choose Multiplayer → Join, and type <b>${esc(g.code)}</b></p><div class="tv-players">${cards}</div><p class="tv-wait">Waiting for the host to start${g.bot_count ? ` · ${g.bot_count} bot${g.bot_count > 1 ? "s" : ""} will join` : ""}…</p></div></section>`;
    }

    // Skyline: one building per company, height = company value.

    const buildings = comps.map((c) => { const v = vals[c.companyId] || 0, h = c.bankrupt ? 4 : Math.max(8, (v / max) * 100); const rank = ranked.findIndex((x) => x.companyId === c.companyId) + 1;
      return `<div class="tv-bld ${c.bankrupt ? "dead" : ""}" style="--pc:${colorOf(c.companyId)};--h:${h}%"><span class="tv-rank">#${rank}</span><div class="tv-tower"><i></i></div><b>${esc(c.companyName)}</b><span>${esc(c.playerName)} · ${c.bankrupt ? "bankrupt" : eur(v)}</span></div>`; }).join("");
    const live = d.live || { trades: [], lots: {}, prices: {} };
    const ticker = [...(live.trades || [])].slice(-10).reverse().map((t) => `<div class="tv-tk ${t.qty > 0 ? "up" : "down"}">${t.qty > 0 ? "▲" : "▼"} <b>${esc(nameOf(t.trader))}</b> ${t.qty > 0 ? "bought" : "sold"} ${Math.abs(t.qty)}% of <b>${esc(nameOf(t.target))}</b> at ${eur(t.price)}</div>`).join("");
    const lots = Object.entries(live.lots || {}).map(([k, l]) => `<div class="tv-lot"><b>🔨 ${esc(k === "auction" && R.auction ? FT.AUCTION.items[R.auction.item].name : nameOf(k) + "'s assets")}</b><span>${l.high ? eur(l.high.amount) + " · " + esc(nameOf(l.high.bidder)) : "no bids yet"}</span><i data-tv-lot data-end="${l.endsAt || 0}">…</i></div>`).join("");
    const ready = g.status === "playing" ? d.players.map((p) => `<span class="tv-ready ${p.submitted_round >= g.current_round ? "ok" : ""}">${p.submitted_round >= g.current_round ? "✓" : "…"} ${esc(p.name)}</span>`).join("") : "";
    const news = [...(R.upcoming || []), ...(R.nextNews || []).map((n) => n.headline)].slice(0, 5).map((h) => `<li>${esc(h)}</li>`).join("");
    const chat = (d.chat || []).filter((m) => m.kind === "chat").slice(-5).map((m) => `<div class="tv-msg"><b>${esc(tvName(d, m.from))}:</b> ${esc(m.body)}</div>`).join("");
    let overlay = "";
    if (TV.show || g.status === "finished") {
      const sR = (TV.show && TV.show.data) || R, rr = (TV.show && TV.show.round) || (d.results && d.results.round), H = sR.valueHistory || {};
      const st = [...(sR.standings || [])].sort((a, b) => b.score - a.score);
      const rows = st.map((x, k) => { const h = H[x.companyId] || [], dv = h.length > 1 ? h.at(-1) - h.at(-2) : 0; return `<div class="tv-row" style="--pc:${colorOf(x.companyId)};animation-delay:${k * 180}ms"><span class="n">${k + 1}</span><b>${esc(nameOf(x.companyId))}</b><span class="v">${eur(x.score)}</span><span class="${dv >= 0 ? "pos" : "neg"}">${dv >= 0 ? "▲" : "▼"} ${eur(Math.abs(dv))}</span></div>`; }).join("");

          <div class="tv-box"><h3>Stock exchange</h3>${ticker || `<div class="tv-muted">No trades yet this round.</div>`}</div>
          ${news ? `<div class="tv-box"><h3>In the news</h3><ul class="tv-news">${news}</ul></div>` : ""}
          ${chat ? `<div class="tv-box"><h3>Table talk</h3>${chat}</div>` : ""}
        </aside>
      </div>${overlay}</section>`;
  }

  // ---------------- game flow ----------------
  function newGame(o, showTv) {
    const seed0 = o.seed || (Date.now() & 0x7fffffff);
    const rng = new FT.Rng(seed0);
    const lvl = o.botSkill === "hard" ? "pro-" : "smart-";
    const strategies = rng.shuffle(["budget", "mainstream", "premium", "hype", "raider"]).slice(0, o.bots).map((x) => (x === "raider" ? "smart-raider" : lvl + x));
    const names = rng.shuffle(COMPANY_NAMES[o.industry].filter((n) => n.toLowerCase() !== o.company.toLowerCase()));
    const bots = rng.shuffle(BOT_NAMES);
    const traits = ["ruthless", "visionary", "influencer", "pennyPincher"];
    const players = [{ id: "you", playerName: o.name, companyName: o.company, trait: o.trait }];
    const strat = {};
    strategies.forEach((st, i) => { strat["bot" + i] = st; players.push({ id: "bot" + i, playerName: bots[i], companyName: names[i], trait: rng.pick(traits) }); });
    const rules = o.rules && Object.keys(o.rules).length ? { ...o.rules } : undefined;
    const game = FT.createGame({ industry: o.industry, difficulty: o.difficulty, rounds: o.rounds || 8, seed: seed0, ...(rules ? { rules } : {}) }, players);
    const color = {}; players.forEach((p, i) => (color[p.id] = i));
    const v = CV(game);
    const hist = {}; players.forEach((p) => (hist[p.id] = [v[p.id]]));
    cancelAnimationFrame(titleRaf);
    S = { screen: "game", game, strat, color, hist, opts: o.keepOpts || { ...o, seed: undefined, daily: undefined }, daily: o.daily || null, tab: "production", modal: null, draft: null, chat: [], seed: seed0, anim: null, marketHist: [], reportTab: "income", newsIdx: 0, tvQueue: [], tvIndex: 0 };
    const y0 = { ...game, round: 0, news: [] };
    const sold0 = { budget: 0, mainstream: 0, premium: 0, hype: 0 };
    for (const c of game.companies) for (const k of Object.keys(sold0)) sold0[k] += c.history[0].segments[k].sold;
    S.marketHist.push({ round: 0, potential: FT.segmentPotential(y0), sold: sold0 });
    S.chat.push({ round: 1, kind: "system", text: "Welcome to " + ind().name + ". " + game.config.rounds + " rounds, one winner (or one monopoly). Last year's numbers (year 0) are in Reports and Market: everyone starts equal." });
    for (const n of game.news) S.chat.push({ round: 1, kind: "news", text: n.event.headline + (n.targetCompanyId ? " (it's " + byId(n.targetCompanyId).companyName + ")" : "") });
    resetDraft();
    S.tvQueue = PREFS.tv ? game.news.filter((n) => n.event.kind !== "economy").map(newsItem) : [];
    if (showTv && S.tvQueue.length) { S.modal = "tv"; S.tvIndex = 0; }
    let seen = false;
    try { seen = !!localStorage.getItem("ft-help-seen"); } catch (e) {}
    if (!seen) { S.pendingTv = S.modal === "tv"; S.modal = "help"; }
    if (!S.modal && missionPending()) S.modal = "mission";
    coachStart();
    saveGame();
    render();
  }

  const needsVote = () => !!(S.game.summit && S.game.summit.round === S.game.round && live(me()) && !S.draft.vote && !S.game.finished);
  const salesOpen = () => (S.game.bankruptcySales || []).filter((l) => l.round === S.game.round && live(me()) && !S.game.finished);
  const auctionOpen = () => !!(S.game.auction && S.game.auction.round === S.game.round && live(me()) && !S.game.finished);
  function tabStatus(k) {
    const g = S.game;
    if (k === "boardroom" && needsVote()) return { text: "VOTE", cls: "req" };
    if (k === "boardroom" && liveLots().some((lot) => { const L = liveOf(), l = L && L.lots[lot.key]; return FT.liveLotOpen(S.game, lot.key, liveNow()) && !(l && l.high && l.high.bidder === "you"); })) return { text: "BID", cls: "gold" };
    if (k === "retail" && g.round === diff().retailUnlockRound && !(S.visited || {})[k]) return { text: "NEW", cls: "" };
    if (k === "takeovers" && g.round === diff().takeoverUnlockRound && !(S.visited || {})[k]) return { text: "NEW", cls: "" };
    if (DECIDE_TABS.some(([t]) => t === k) && (S.visited || {})[k]) return { text: "✓", cls: "done" };
    return null;
  }
  // What's special about this round, shown in a strip above the tabs.
  function agenda() {
    const g = S.game, items = [];
    if (g.finished) return "";
    if (needsVote()) items.push(["boardroom", "req", "Vote at the industry summit (required)"]);
    else if (g.summit && g.summit.round === g.round) items.push(["boardroom", "", "Summit vote cast: " + FT.SUMMIT.regulations[g.summit.options[S.draft.vote === "b" ? 1 : 0]].name]);
    if (auctionOpen()) items.push(["boardroom", "gold", "Auction open: " + FT.AUCTION.items[g.auction.item].name]);
    for (const l of salesOpen()) items.push(["boardroom", "gold", "Bankruptcy sale: " + byId(l.companyId).companyName + "'s factory"]);
    for (const ev of g.specialEvents || []) {
      const def = FT.EVENTS[ev.id], tab = ev.id === "investorDay" ? "takeovers" : "production";
      if (ev.round === g.round) items.push([tab, "gold", "Today: " + def.name + " — " + def.description.toLowerCase()]);
      if (ev.round === g.round + 1) items.push([tab, "new", "Next round: " + def.name]);
    }
    if (g.round === diff().retailUnlockRound) items.push(["retail", "new", "New: open your own stores"]);
    if (g.round === diff().takeoverUnlockRound && rulesNow().takeovers) items.push(["takeovers", "new", "New: share trading is open"]);
    if (me().merged) items.push(["takeovers", "", "You merged: you're an investor now"]);
    else if (me().bankrupt) items.push(["boardroom", "req", "You're a journalist: pick a company to expose"]);
    { const attacker = S.game.companies.find((o) => o.id !== "you" && (me().shares.holders[o.id] || 0) >= FT.HOSTILE_BID_SHARES && !me().controlledBy);
      if (attacker && live(me()) && !g.finished) items.push(["takeovers", "req", `Hostile bid: ${attacker.companyName} owns ${me().shares.holders[attacker.id]}% of you. Defend!`]); }
    if (g.round === g.config.rounds) items.push(["finance", "gold", "Final round: the game ends after this one"]);
    if (live(me()) && !S.draft.guidance) items.push(["finance", "", "Investor call: give your forecast (optional)"]);
    const offers = dealList().filter((d) => d.to === "you" && d.status === "offered" && d.round === g.round).length;
    if (offers) items.push(["chat", "gold", offers === 1 ? "A deal offer is waiting in Chat" : offers + " deal offers are waiting in Chat"]);
    const steps = `<span class="muted" style="font-size:12.5px;font-weight:800">Read the news, market and reports, go through the decision tabs, then press Submit.</span>`;
    return `<section class="win agenda" aria-label="This round"><span class="lbl">Round ${g.round}</span>${items.map(([t, c, txt]) => `<button type="button" class="${c}" data-tab="${t}">${esc(txt)}</button>`).join("")}${items.length ? "" : steps}${missionChip()}</section>`;
  }

  function missionChip() {
    const c = me();
    if (!c.mission || c.bankrupt) return "";
    const st = missionStatus(c), urgent = roundsLeft() <= 1 && !st.done && !st.lost;
    return `<button type="button" class="mchip ${st.done ? "done" : ""} ${urgent ? "urgent" : ""}" data-tab="boardroom" aria-label="Secret mission: ${esc(missionText(c).name)}, ${esc(st.chip)}"${tipAttr(missionText(c).text + "\n" + st.line)}><span class="mc-k">${urgent ? "Last chance" : "Secret mission"}</span><b>${esc(missionText(c).name)}</b>${st.pct == null ? "" : `<span class="mc-bar"><i style="width:${Math.round(st.pct * 100)}%"></i></span>`}<span class="mc-v">${st.done ? "✓ " : ""}${esc(st.chip)}</span></button>`;
  }

  // Showdowns, auctions, summits and dirty tricks get their own broadcast.
  function specialTv(items) {
    const out = [], co = (t) => S.game.companies.find((c) => t.includes(c.companyName));
    for (const f of items) {
      const t = f.headline, c = co(t);
      const add = (scene, variant, short, tag, extra) => out.push({ scene, variant, short: short.toUpperCase().slice(0, 34), full: t, chips: [], rounds: 0, tag, ...(extra || {}) });
      if (t.startsWith("Boardroom showdown")) {
        const names = S.game.companies.filter((x) => t.includes(x.companyName));
        add("showdown", "", t.includes("fights off") ? "TAKEOVER BLOCKED!" : "SHOWDOWN WON: CONTROL!", "Showdown", { a: names[0] && names[0].id, b: names[1] && names[1].id });
      } else if (/wins the .* auction/.test(t)) add("auction", "sold", (c ? c.companyName : "") + " WINS AUCTION", "Auction", { a: c && c.id });
      else if (t.startsWith("Auction this round")) add("auction", "", "AUCTION THIS ROUND", "Auction");
      else if (t.startsWith("Bankruptcy sale this round")) add("auction", "", "BANKRUPTCY SALE!", "Auction");
      else if (t.includes("buys what's left of")) add("auction", "sold", (c ? c.companyName : "") + " BUYS THE RUINS", "Auction", { a: c && c.id });
      else if (t.startsWith("Hostile bid!")) { const tg = S.game.companies.find((x) => t.includes("of " + x.companyName + ".")); add("chart", "down", "HOSTILE BID ON " + (tg ? tg.companyName : "A RIVAL"), "Hostile bid", { a: c && c.id, b: tg && tg.id }); }
      else if (t.startsWith("MERGER!")) add("deal", "", "MERGER: TWO BECOME ONE", "Merger", { a: c && c.id });
      else if (t.startsWith("MONOPOLY!")) add("deal", "", "MONOPOLY! GAME OVER", "Monopoly", { a: S.game.monopolyBy, b: S.game.companies.find((x) => x.id !== S.game.monopolyBy && live(x))?.id });
      else if (t.startsWith("Industry summit:")) add("press", "minister", "SUMMIT: TIME TO VOTE", "Summit");
      else if (t.startsWith("Industry summit votes")) add("press", "minister", "NEW RULE PASSED", "Summit");
      else if (t.startsWith("Scandal!") || t.startsWith("Leaked memo")) add("chart", "down", "SCANDAL AT " + (c ? c.companyName : "HQ"), "Scandal");
      else if (t.includes("lawsuit")) add("press", "banker", "COURT RULES", "Courtroom");
      else if (t.includes("Fake plumber") || t.includes("scientists spotted")) add("anchor", "cocoa", "CORPORATE SPY CAUGHT", "Exposed");
      else if (t.includes("queueing around the block")) add("crowd", "phone", "CRAZY LAUNCH IS A HIT", "Launch");
      else if (t.includes("Even the bins refuse it")) add("chart", "down", "CRAZY LAUNCH FLOPS", "Launch");
      else if (t.startsWith("Exclusive by reporter")) add("anchor", "cocoa", "EXCLUSIVE EXPOSE", "Exclusive");
    }
    return out;
  }

  function resetDraft() {
    const c = me(), d = c.lastDecisions;
    S.draft = { ...d, loanChange: 0, buyShares: {}, sellShares: {}, bankruptBids: {}, buyback: 0, research: [], wildcard: null, takeoverStake: 0, auctionBid: 0, vote: null, journalistTarget: null, hire: 0 };
    S.visited = {};
    // Everything starts as last round's plan: forecasting how much to make is the player's job.
    S.draft.production = Math.max(0, Math.min(c.capacity, Math.round(d.production || 0)));
    // Your unlocked rooftop travels with your decisions, so everyone sees it (also online).
    const roof = myRoof(); if (roof !== (c.style ?? 0)) S.draft.style = roof;
  }

  function endRound(silent) {
    if (!silent) sfx("submit");
    const g = S.game;
    const prevValues = CV(g);
    const rng = new FT.Rng((S.seed + g.round * 7919) | 0);
    const decisions = { you: S.draft };
    for (const c of g.companies) {
      if (c.id === "you") continue;
      if (c.bankrupt) {
        // Bankrupt bots turn journalist and go after the leader.
        const v = CV(g), alive = g.companies.filter((o) => live(o));
        if (alive.length) decisions[c.id] = { journalistTarget: alive.sort((a, b) => v[b.id] - v[a.id])[0].id };
        continue;
      }
      let d = FT.botDecisions(S.strat[c.id], g, c, rng);
      d = { ...d, auctionBid: 0, bankruptBids: {} }; // they bid live in single-player
      const threat = Math.max(0, ...Object.values(c.shares.holders));
      if (threat >= 25 && c.cash > 1200000) d = { ...d, buyback: 10 };
      decisions[c.id] = d;
    }
    const round = g.round;
    S.game = FT.resolveRound(g, decisions, dealsForRound(round));
    settleDeals(round);
    afterRound(g, round, rng);
    botPitch();
    renderTalk();
  }

  // Everything that happens on screen after a round is resolved (locally or by the server).
  function afterRound(prev, round, rng) {
    const prevValues = CV(prev);
    const ownerBefore = Object.fromEntries(prev.companies.map((c) => [c.id, c.controlledBy]));
    // Takeovers and showdowns get their own boardroom scene.
    const boards = [];
    for (const f of S.game.feed.filter((x) => x.round === round && x.headline.startsWith("Boardroom showdown"))) {
      const names = S.game.companies.filter((x) => f.headline.includes(x.companyName)).sort((a, b) => f.headline.indexOf(a.companyName) - f.headline.indexOf(b.companyName));
      if (names.length < 2) continue;
      const defended = f.headline.includes("fights off");
      const attacker = defended ? names[1] : names[0], defender = defended ? names[0] : names[1];
      const paid = (co) => (co.history.at(-1) && co.history.at(-1).round === round ? co.history.at(-1).showdownPaid || 0 : 0);
      boards.unshift({ kind: "showdown", attacker: attacker.id, defender: defender.id, attack: paid(attacker), defense: paid(defender), winner: defended ? defender.id : attacker.id });
    }
    for (const c of S.game.companies) {
      if (!c.controlledBy || c.controlledBy === ownerBefore[c.id]) continue;
      const buyerId = c.controlledBy, oldName = c.companyName;
      if (buyerId !== "you" && !S.mp) {
        const nm = funnyNames(byId(buyerId).companyName, c.companyName);
        S.game = FT.renameCompany(S.game, buyerId, c.id, nm[Math.floor(rng.next() * nm.length)]);
      }
      boards.push({ kind: "takeover", buyer: buyerId, target: c.id, oldName, seats: seatsOf(byId(c.id)) });
    }
    S.boardQueue = boards; S.boardIndex = 0;
    const fresh = S.game.finished ? [] : S.game.news.filter((n) => n.roundsLeft === n.event.duration && n.event.kind !== "economy").map(newsItem);
    const unlocks = S.game.round === diff().retailUnlockRound && !S.game.finished
      ? [{ scene: "anchor", variant: "shop", short: "RETAIL OPENS: BUILD YOUR OWN STORES", full: "From this round every company can open its own stores. Check the new Retail tab.", chips: [{ label: "New: Retail tab", good: true }], rounds: 0 }]
      : [];
    const specials = specialTv(S.game.feed.filter((f) => f.round === round || f.round === round + 1));
    S.tvQueue = PREFS.tv ? [...specials.filter((x) => x.tag !== "Showdown"), ...unlocks, ...fresh] : [];
    S.newsIdx = 0;
    const v = CV(S.game);
    if (S.mp) rebuildHist(); else for (const c of S.game.companies) S.hist[c.id].push(v[c.id]);
    // Feed: headlines of this round, then bot banter, then next round's news.
    for (const f of S.game.feed.filter((f) => f.round === round)) {
      if (!S.chat.some((m) => m.text === f.headline)) S.chat.push({ round, kind: "news", text: f.headline });
    }
    if (!S.mp) banter(round, rng, prevValues, v);
    for (const f of S.game.feed.filter((f) => f.round === round + 1)) S.chat.push({ round: round + 1, kind: "news", text: f.headline });
    S.anim = { from: prevValues, to: v, start: performance.now() };
    S.flash = Object.fromEntries(S.game.companies.map((c) => [c.id, v[c.id] >= prevValues[c.id] ? "up" : "down"]));
    S.show = { round, before: prevValues, after: v };
    S.modal = PREFS.show ? "show" : S.game.finished ? (S.boardQueue.length ? "board" : "final") : "results";
    if (S.game.finished) setTimeout(recordGameEnd, 0);
    resetDraft();
    saveGame();
    render();
  }

  function banter(round, rng, before, after) {
    const bots = S.game.companies.filter((c) => c.id !== "you" && live(c));
    const said = new Set();
    for (const c of bots) {
      const ev = c.history.at(-1)?.events || [];
      if (ev.some((e) => e.startsWith("Took control"))) { say(round, c.id, rng.pick(CHAT.takeover)); said.add(c.id); }
      else if (ev.some((e) => e.startsWith("Taken over"))) { say(round, c.id, rng.pick(CHAT.victim)); said.add(c.id); }
    }
    const pick = rng.shuffle(bots.filter((c) => !said.has(c.id))).slice(0, 1 + rng.int(2));
    for (const c of pick) {
      const change = (after[c.id] - before[c.id]) / Math.max(1, before[c.id]);
      const pool = change > 0.06 ? CHAT.up : change < -0.03 ? CHAT.down : CHAT.taunt;
      say(round, c.id, rng.pick(pool));
    }
  }

  // Bar chart drawn to scale; bars colored per company or a single color.
  function barChart(rows, opts) {
    const W = 360, H = 170, L = 44, R = 8, T = 10, B = 26;
    const max = Math.max(...rows.map((r) => r.v), 1) * 1.1;
    const step = niceStep(max / 4);
    const top = Math.ceil(max / step) * step;
    const y = (v) => T + (1 - v / top) * (H - T - B);
    const bw = (W - L - R) / rows.length;
    let s = "";
    for (let t = 0; t <= top + 1e-9; t += step) s += `<line x1="${L}" x2="${W - R}" y1="${y(t)}" y2="${y(t)}" stroke="rgba(255,255,255,0.08)"/><text x="${L - 6}" y="${y(t) + 4}" text-anchor="end">${opts.fmt(t)}</text>`;
    rows.forEach((r, i) => {
      const x = L + i * bw + bw * 0.18, w = bw * 0.64, h = y(0) - y(r.v);
      s += `<rect x="${x}" y="${y(r.v)}" width="${w}" height="${Math.max(0, h)}" rx="3" fill="${r.color}"${r.dim ? ' opacity="0.45"' : ""}${tipAttr(r.tip || r.label + ": " + r.v)}/>`;
      s += `<rect x="${x}" y="${y(r.v)}" width="${w}" height="${Math.min(4, Math.max(0, h))}" fill="rgba(255,255,255,0.25)"/>`;
      s += `<text x="${x + w / 2}" y="${H - 9}" text-anchor="middle">${esc(fitLabel(r.label, bw))}</text>`;
    });
    if (opts.line) s += `<line x1="${L}" x2="${W - R}" y1="${y(opts.line.v)}" y2="${y(opts.line.v)}" stroke="${opts.line.color}" stroke-dasharray="4 3" stroke-width="1.5"/><text x="${W - R}" y="${y(opts.line.v) < T + 12 ? y(opts.line.v) + 12 : y(opts.line.v) - 4}" text-anchor="end" style="fill:${opts.line.color}">${esc(opts.line.label)}</text>`;
    return `<div class="chart"><svg viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(opts.title)}">${s}</svg></div>`;
  }
  function niceStep(x) { const p = Math.pow(10, Math.floor(Math.log10(x || 1))); const n = x / p; return (n <= 1 ? 1 : n <= 2 ? 2 : n <= 2.5 ? 2.5 : n <= 5 ? 5 : 10) * p; }
  // A company name that fits under a bar: whole if it fits, else its first word, else cut with "…".
  function fitLabel(name, px) {
    const max = Math.max(3, Math.floor(px / 7));
    if (name.length <= max) return name;
    const first = name.split(/[\s&]+/)[0];
    if (first.length >= 3 && first.length <= max) return first;
    return name.slice(0, max - 1) + "…";
  }
  const short = (name) => name.replace(/[^A-Za-z0-9 ]/g, "").split(" ").map((w) => w.slice(0, 3)).join("").slice(0, 4).toUpperCase();

        ${stepper("f-prod", "Production (" + i.labels.unit + ")", Math.min(d.production, c.capacity), 0, c.capacity, Math.max(1, Math.round(c.capacity / 100)), units, `<div class="hint muted" style="font-size:12.5px">Capacity ${units(c.capacity)} · overtime above ${units(loadLines().over)} (+${Math.round(FT.COSTS.overtimePremium * 100)}% per unit) · idle machines below ${units(loadLines().idle)} cost money.</div>`)}

  function tabFinance() {
    const c = me(), d = S.draft, v = CV(S.game), p = SP(S.game), fx = fxNow();

  // "750k", "1.2m", "-50 000", "€1,234" → number (NaN if it isn't one).
  function parseAmount(str) {
    const t = String(str || "").trim().toLowerCase().replace(/[€\s,_]/g, "").replace(/[−–]/g, "-");
    const m = t.match(/^(-?\d*\.?\d+)([km]?)$/);
    if (!m) return NaN;
    return Number(m[1]) * (m[2] === "k" ? 1e3 : m[2] === "m" ? 1e6 : 1);
  }
  function trustText(cred) {
    const G = FT.GUIDANCE;

  const RESULT_LABEL = { hit: "Spot on", close: "Close", miss: "Way off" };

    return `<div class="card invcall"><h3>Investor call</h3>

  function valueChart(W, H) {
    const L = 50, R = 10, T = 10, B = 24, ids = S.game.companies.map((c) => c.id), n = S.hist.you.length;
    const max = Math.max(...ids.flatMap((id) => S.hist[id]), 1) * 1.08;
