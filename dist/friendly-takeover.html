    const y = (v) => T + (1 - Math.max(0, v) / top) * (H - T - B);
    let s = "";
    for (let t = 0; t <= top + 1e-9; t += step) s += `<line x1="${L}" x2="${W - R}" y1="${y(t)}" y2="${y(t)}" stroke="rgba(255,255,255,0.08)"/><text x="${L - 6}" y="${y(t) + 4}" text-anchor="end">${eur(t, 0)}</text>`;
    for (let i = 0; i < n; i++) s += `<text x="${x(i)}" y="${H - 7}" text-anchor="middle">${i === 0 ? "Y0" : "R" + i}</text>`;
    for (const id of ids) {
      const pts = S.hist[id].map((v, i) => `${x(i)},${y(v)}`).join(" ");
      s += `<polyline points="${pts}" fill="none" stroke="${colRaw(id)}" stroke-width="${id === "you" ? 3.5 : 2}" stroke-linejoin="round" stroke-linecap="round"/><circle cx="${x(n - 1)}" cy="${y(S.hist[id].at(-1))}" r="${id === "you" ? 5 : 3.5}" fill="${colRaw(id)}"/>`;
    }
    for (const id of ids) S.hist[id].forEach((v, i) => { s += `<circle cx="${x(i)}" cy="${y(v)}" r="7" fill="transparent"${tipAttr(byId(id).companyName + " · " + (i === 0 ? "year 0" : "round " + i) + ": " + eurX(v))}/>`; });
    return `<div class="chart"><svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Company value per round">${s}</svg></div>`;
  }

  function ownBar(c) {
    const parts = [[c.shares.founder, colRaw(c.id), "founder"], [c.shares.treasury, "#5b6690", "bought back"]];
    for (const [h, v] of Object.entries(c.shares.holders)) if (v) parts.push([v, colRaw(h), byId(h).companyName]);

    return (FT.BALANCE.takeoverPremium + FT.BALANCE.premiumPerHeldShare * held) * ruthless * investorDay;
  }
  function planShareCost() {
    const p = SP(S.game);

  function tabTakeovers() {
    if (!rulesNow().takeovers) return `<div class="card"><h3>Takeovers are off</h3><div class="hint">This game is played with the house rule "no takeovers": no share buying, no stock exchange, no takeovers or mergers. Win by running the best company.</div></div>`;

      <li><span><b>Trade live.</b> The stock exchange (top) is open during the round: buy and sell right now, everyone sees it on the ticker, and every share moves the price. You can build up to 50% there.</span></li>

      <li><span><b>Sell or dump shares.</b> Sell shares you own any time during the round on the live stock exchange (${Math.round(FT.EXCHANGE.fee * 100)}% fee). Every share sold pushes the price down ${(FT.EXCHANGE.impactPerShare * 100).toFixed(1)}%, and dumping scares investors: each share also knocks ${(FT.BALANCE.dumpImpactPerShare * 100).toFixed(1)}% off that company's value when the round closes (at most ${Math.round(FT.BALANCE.dumpImpactCapPerRound * 100)}% a round). The panic halves every round. Use it to cash out a stake you can't use, or to hit a rival where it hurts.</span></li>
      <li><span><b>Defend yourself.</b> Buy back your own shares so nobody can buy them, or keep a defense fund. When someone tries to pass 50%, a boardroom showdown decides: the higher sealed stake wins, a tie goes to the defender, and both pay what they staked.</span></li>

    const legend = `<div class="legend"><span><i style="background:linear-gradient(90deg,var(--c0),var(--c1),var(--c2))"></i>Company's own colour: its founder's shares</span><span><i style="background:#5b6690"></i>Bought back</span><span><i style="background:#2c3970"></i>For sale</span><span>Other colours: shares held by that company</span></div>`;
    let status = "";
    if (!unlocked) status = `<div class="locked">Share trading opens in round ${D.takeoverUnlockRound}. Build a war chest until then, or save for your defense.</div>`;
    else if (c.takeoverCooldown > 0) status = `<div class="locked">Your board wants a breather after that takeover: ${c.takeoverCooldown} more round${c.takeoverCooldown > 1 ? "s" : ""} before you can buy again.</div>`;

      return `<div class="rival" style="--pc:${colVar(o.id)}"><div style="min-width:0"><b>${esc(o.companyName)}</b> <span class="muted" style="font-size:12.5px">· ${esc(o.playerName)}</span>
          <div class="muted" style="font-size:12.5px"${tipAttr("Share price " + eurX(p[o.id]) + "\nPremium " + (premiumFor(o) * 100).toFixed(1) + "%\nYou pay " + eurX(pay) + " per share")}>Share price ${eur(p[o.id])} · you pay ${eur(pay)} per share</div>

        <div class="card"><h3>Who owns you</h3>${ownBarWide(c)}<div class="hint">${holders.length ? holders.map(([h, v]) => esc(byId(h).companyName) + " owns " + v + "%").join(" · ") : "No rival owns your shares. Yet."} · for sale ${c.shares.float}% · bought back ${c.shares.treasury}%</div>
          ${c.controlledBy ? `<div class="note">${esc(byId(c.controlledBy).companyName)} controls you. You keep playing, but half your profit goes out as dividends and you score at ${Math.round(B.controlledScoreMultiplier * 100)}%.</div>` : biggest >= 25 ? `<div class="note">Watch out: a rival owns ${biggest}% of you. Consider a buyback or a defense fund.</div>` : ""}</div>

        <div class="card"><h3>Boardroom showdown</h3><ol class="steps">
          <li><span>A showdown only happens when someone's purchase would take them <b>past 50%</b> of a company that has a <b>defense fund</b> of at least ${eurX(FT.SHOWDOWN.minStake)}. No defense fund: the buyer simply gets control.</span></li>

        ${stepper("f-dstake", "Defense fund: what you'll defend with", d.defenseStake, 0, 2000000, 25000, eur, `<div class="hint muted" style="font-size:12.5px">Stays set every round until you change it. Used only if someone tries to take you past 50%. Rivals can't see it.</div>`)}

  // ---------------- boardroom tab ----------------
  // How far along your secret mission is: a 0–1 bar, a short chip label, a full line and a state.
  function missionStatus(c) {
    const g = S.game, B = FT.BALANCE, alive = g.companies.filter((o) => live(o));
    const rankBy = (f) => {
      const mine = f(c), better = alive.filter((o) => o.id !== c.id && f(o) > mine).length, tied = alive.some((o) => o.id !== c.id && f(o) === mine);
      return { rank: better + 1, n: alive.length, mine, top: Math.max(...alive.map(f), 1), tied, label: "#" + (better + 1) + (tied ? " (tied)" : "") + " of " + alive.length };
    };
    const segSold = (seg) => (o) => (o.history.at(-1)?.segments?.[seg]?.sold) || 0;
    const total = (o) => o.history.filter((h) => h.round >= 1).reduce((a, h) => a + h.sold, 0);
    // Online, rivals' brands are secret, so "strongest brand" can't be judged until the end.
    const done = S.mp && c.mission.id === "brand" ? false : FT.missionDone(g, c);
    const out = (pct, chip, line, extra) => ({ pct: pct == null ? null : Math.max(0, Math.min(1, pct)), chip, line, done, ...(extra || {}) });
    if (c.bankrupt) return out(0, "failed", "Bankrupt companies can't complete missions.", { lost: true });
    switch (c.mission.id) {
      case "stake": {
        const t = byId(c.mission.targetId), own = t ? t.shares.holders.you || 0 : 0;
        if (!t || t.bankrupt) return out(0, "target gone", "Your target went bankrupt, so this one can't be completed any more.", { lost: true });
        return out(own / 30, own + "/30%", `You own ${own}% of ${t.companyName}. You need 30%.`);
      }
      case "stores": return out((c.stores || 0) / 8, (c.stores || 0) + "/8 stores", `You have ${c.stores || 0} stores. You need 8.`);

  function effectChips(e, targetName) {
    const chips = [];
    const add = (label, x, goodWhenUp) => chips.push({ label: label + " " + signed(x), good: goodWhenUp ? x > 0 : x < 0 });
    if (e.costMultiplier) add("Costs", e.costMultiplier - 1, false);
    if (e.demandMultiplier) add("Demand", e.demandMultiplier - 1, true);
    if (e.capacityMultiplier) add("Capacity", e.capacityMultiplier - 1, true);
    if (e.interestDelta) chips.push({ label: "Interest " + (e.interestDelta > 0 ? "+" : "−") + Math.abs(e.interestDelta * 100).toFixed(1).replace(".0", "") + " pt", good: e.interestDelta < 0 });
    if (e.segmentMultiplier) for (const [k, v] of Object.entries(e.segmentMultiplier)) add(SEG[k] + " buyers", v - 1, true);
    if (e.randomCompanyBoost) chips.push({ label: (targetName || "One company") + " +" + Math.round(e.randomCompanyBoost * 100) + "% pull", good: true });
    if (e.cheapestBoost) chips.push({ label: "Cheapest sells more", good: true });
    return chips;
  }

  let tvRaf = 0;
  function runTv() {
    cancelAnimationFrame(tvRaf);
    const reduce = reduceMotion();
    const start = performance.now();
    const tick = (now) => {
      const canvases = document.querySelectorAll("canvas[data-tv]");
      if (!canvases.length) return;
      const f = reduce ? 0 : Math.floor((now - start) / 260);
      canvases.forEach((cv) => {
        const g = cv.getContext && cv.getContext("2d");
        const item = TVREG[cv.dataset.tv];
        if (!g || !item) return;
        (SCENES[item.scene] || SCENES.anchor)(g, f, item.variant, item);
      });
      if (!reduce) tvRaf = requestAnimationFrame(tick);
    };
    tvRaf = requestAnimationFrame(tick);
  }

  // ---------------- sound ----------------
  const SND = { ctx: null, sfx: true, music: false, sfxVol: 0.7, musicVol: 0.5, master: null, sfxBus: null, musicBus: null, musicTimer: 0, nextNote: 0, step: 0, lastTick: 0 };
  try {
    const pref = JSON.parse(localStorage.getItem("ft-sound") || "{}");
    if (typeof pref.sfx === "boolean") SND.sfx = pref.sfx;
    if (typeof pref.music === "boolean") SND.music = pref.music;
    if (typeof pref.sfxVol === "number") SND.sfxVol = Math.max(0, Math.min(1, pref.sfxVol));
    if (typeof pref.musicVol === "number") SND.musicVol = Math.max(0, Math.min(1, pref.musicVol));
  } catch (e) {}
  function saveSound() { try { localStorage.setItem("ft-sound", JSON.stringify({ sfx: SND.sfx, music: SND.music, sfxVol: SND.sfxVol, musicVol: SND.musicVol })); } catch (e) {} }
  function setVolume(kind, v) {
    if (kind === "sfx") SND.sfxVol = v; else SND.musicVol = v;
    const bus = kind === "sfx" ? SND.sfxBus : SND.musicBus;
    if (bus) bus.gain.value = v * (kind === "sfx" ? 1.4 : 1.6);
    saveSound();
  }
  function audio() {
    if (SND.ctx) return SND.ctx;
    const AC = window.AudioContext || window.webkitAudioContext;
    if (!AC) return null;
    try {
      SND.ctx = new AC(); SND.master = SND.ctx.createGain(); SND.master.gain.value = 0.5; SND.master.connect(SND.ctx.destination);
      SND.sfxBus = SND.ctx.createGain(); SND.sfxBus.gain.value = SND.sfxVol * 1.4; SND.sfxBus.connect(SND.master);
      SND.musicBus = SND.ctx.createGain(); SND.musicBus.gain.value = SND.musicVol * 1.6; SND.musicBus.connect(SND.master);
    } catch (e) { SND.ctx = null; }
    return SND.ctx;
  }
  function tone(freq, start, dur, type, vol, slideTo, bus) {
    const ac = SND.ctx;
    if (!ac) return;
    const o = ac.createOscillator(), g = ac.createGain();
    o.type = type || "square";
    o.frequency.setValueAtTime(freq, start);
    if (slideTo) o.frequency.exponentialRampToValueAtTime(slideTo, start + dur);
    g.gain.setValueAtTime(0.0001, start);
    g.gain.exponentialRampToValueAtTime(vol || 0.12, start + 0.01);
    g.gain.exponentialRampToValueAtTime(0.0001, start + dur);
    o.connect(g); g.connect(bus || SND.sfxBus || SND.master);
    o.start(start); o.stop(start + dur + 0.02);
  }
  function noise(start, dur, vol) {
    const ac = SND.ctx;
    if (!ac) return;
    const buf = ac.createBuffer(1, Math.floor(ac.sampleRate * dur), ac.sampleRate), data = buf.getChannelData(0);
    for (let k = 0; k < data.length; k++) data[k] = (Math.random() * 2 - 1) * (1 - k / data.length);
    const src = ac.createBufferSource(), g = ac.createGain();
    src.buffer = buf; g.gain.value = vol || 0.08;
    src.connect(g); g.connect(SND.sfxBus || SND.master); src.start(start);
  }
  const NOTE = (n) => 440 * Math.pow(2, (n - 69) / 12);
  function sfx(name) {
    if (!SND.sfx) return;
    const ac = audio();
    if (!ac) return;
    if (ac.state === "suspended") ac.resume();
    const t = ac.currentTime + 0.01;
    switch (name) {
      case "click": tone(880, t, 0.05, "square", 0.05); break;
      case "tab": tone(523, t, 0.04, "square", 0.05); tone(784, t + 0.04, 0.05, "square", 0.05); break;
      case "tick": tone(1400, t, 0.02, "square", 0.025); break;
      case "submit": [60, 64, 67, 72].forEach((n, k) => tone(NOTE(n + 12), t + k * 0.07, 0.09, "square", 0.08)); break;
      case "profit": noise(t, 0.06, 0.06); tone(NOTE(84), t + 0.06, 0.12, "square", 0.08); tone(NOTE(88), t + 0.14, 0.25, "square", 0.08); break;
      case "loss": tone(330, t, 0.35, "sawtooth", 0.07, 110); break;
      case "news": noise(t, 0.12, 0.05); [67, 72, 76].forEach((n, k) => tone(NOTE(n), t + 0.1 + k * 0.12, k === 2 ? 0.45 : 0.12, "triangle", 0.14)); break;
      case "takeover": [60, 64, 67, 72, 67, 72].forEach((n, k) => tone(NOTE(n + 12), t + k * 0.1, k === 5 ? 0.5 : 0.11, "square", 0.08)); break;
      case "win": [60, 64, 67, 72, 76, 79, 84].forEach((n, k) => tone(NOTE(n + 12), t + k * 0.09, k === 6 ? 0.7 : 0.1, "square", 0.08)); break;
      case "lose": [67, 66, 65, 64].forEach((n, k) => tone(NOTE(n - 12), t + k * 0.28, 0.3, "sawtooth", 0.06)); break;
      case "flop": tone(600, t, 0.3, "square", 0.06, 120); break;
    }
  }
  // A small chiptune loop: bass on triangle, melody on square, scheduled ahead of time.
  const MELODY = [72, 0, 76, 79, 77, 0, 76, 72, 74, 0, 77, 81, 79, 77, 76, 0, 72, 0, 76, 79, 81, 79, 77, 76, 74, 76, 74, 71, 72, 0, 0, 0];
  const BASS = [48, 48, 55, 55, 53, 53, 55, 55, 50, 50, 53, 53, 55, 55, 48, 48];
  function scheduleMusic() {
    const ac = SND.ctx;
    if (!ac || !SND.music) return;
    const stepDur = 0.16;
    while (SND.nextNote < ac.currentTime + 0.4) {
      const s = SND.step % 32;
      if (MELODY[s]) tone(NOTE(MELODY[s]), SND.nextNote, stepDur * 0.9, "square", 0.025, 0, SND.musicBus);
      if (s % 2 === 0) tone(NOTE(BASS[(s / 2) % 16]), SND.nextNote, stepDur * 1.8, "triangle", 0.05, 0, SND.musicBus);
      SND.nextNote += stepDur;
      SND.step++;
    }
  }
  function setMusic(on) {
    SND.music = on;

    clearInterval(SND.musicTimer);
    if (!on) return;
    const ac = audio();
    if (!ac) return;
    if (ac.state === "suspended") ac.resume();
    SND.nextNote = ac.currentTime + 0.05;
    SND.musicTimer = setInterval(scheduleMusic, 100);
  }
  // Browsers only allow audio after the first interaction.
  document.addEventListener("pointerdown", () => { if ((SND.sfx || SND.music) && audio() && SND.ctx.state === "suspended") SND.ctx.resume(); if (SND.music && !SND.musicTimer) setMusic(true); }, { once: true });
  document.addEventListener("click", (e) => {

  // ---------------- market tab ----------------
  function newsMultipliers() {

  // The free market report: totals only. Applying growth, trends and news is up to you.

    let out = `<div class="card"><h3>Your research from round ${h.round}</h3>`;
    if (r.competitors) out += `<h3 style="font-size:13px">Competitor spending</h3>` + tbl(["Company", "Made", "Qual.", "Marketing", "Campaign", "R&D", "Brand", "Factory", "Stores", "Store price"], r.competitors.map((x) => `<tr>${coCell(x.companyId)}${td(units(x.produced), unitsX(x.produced) + " " + u + " of " + unitsX(x.capacity) + " capacity")}${td(x.quality)}${td(eur(x.marketingBudget), eurX(x.marketingBudget))}<td class="r">${CAMPAIGNS[x.campaign][0]}</td>${td(eur(x.investRnd), eurX(x.investRnd))}${td(eur(x.investBrand), eurX(x.investBrand))}${td(eur(x.investCapacity), eurX(x.investCapacity))}${td(String(x.stores ?? 0))}${td(x.stores ? eur(x.retailPrice) : "—", x.stores ? eurX(x.retailPrice) : "")}</tr>`).join(""));
    if (r.survey) out += `<h3 style="font-size:13px">Customer survey</h3>` + tbl(["Company", "Brand", "Hype"], r.survey.map((x) => `<tr>${coCell(x.companyId)}${td(x.brand.toFixed(1), "Brand " + x.brand.toFixed(2) + " / 100")}${td(x.hype.toFixed(1), "Hype " + x.hype.toFixed(2) + " / 100")}</tr>`).join(""));
    if (r.marketStudy || r.buyerPanel) out += `<div class="hint">${[r.marketStudy && "Market study", r.buyerPanel && "Buyer panel"].filter(Boolean).join(" and ")}: see the cards below.</div>`;
    if (r.forecast) out += `<h3 style="font-size:13px">Insider tip for round ${r.forecast.round}</h3>` + (r.forecast.round > S.game.config.rounds ? `<div class="hint">The game ends before then.</div>` : (r.forecast.news || []).map((n) => `<div class="sumline" style="align-items:center"><span${n.kind === "story" ? ' class="note" style="color:var(--ink)"' : ""}>${esc(n.headline)}</span><span class="fxrow" style="justify-content:flex-end">${effectChips(n.effect).map((x) => `<span class="fx ${x.good ? "up" : "down"}">${x.good ? "▲" : "▼"} ${esc(x.label)}</span>`).join("")}${n.duration > 1 ? `<span class="fx dur">${n.duration} rounds</span>` : ""}</span></div>`).join("") + ((r.forecast.news || []).some((n) => n.kind === "story") ? "" : `<div class="hint">No big story coming, just the market report.</div>`));
    return out + `</div>`;
  }

  // ---------------- reports tab ----------------
  const REPORT_TABS = [["income", "Income statement"], ["cash", "Cash flow"], ["balance", "Balance"], ["production", "Production"], ["groups", "Sales by group"], ["costs", "Cost sheet"]];
  function roundTable(rows, hideZero) {
    const H = me().history;
    if (!H.length) return `<div class="hint">Fills in after round 1.</div>`;
    // Lines you never used (all zero) just add noise.
    if (hideZero) rows = rows.filter(([, f, , bold, keep]) => bold || keep || H.some((h) => Math.abs(f(h)) > 0.004));
    // Last column: change from the round before to the latest round, for spotting trends.
    const delta = H.length >= 2;
    const fmtS = (x, kind) => kind === "units" ? units(x) : kind === "pct" ? Math.round(x * 100) + "%" : kind === "plain" ? String(x) : kind === "idx" ? x.toFixed(2) : kind === "eur3" ? "€" + x.toFixed(3) : eur(x);
    const fmtX = (x, kind) => kind === "units" ? unitsX(x) : kind === "pct" ? (x * 100).toFixed(2) + "%" : kind === "plain" ? String(x) : kind === "idx" ? x.toFixed(3) : kind === "eur3" ? "€" + x.toFixed(4) : eurX(x);
    return `<div class="tbl"><table><thead><tr><th></th>${H.map((h) => `<th class="r">${h.round ? "R" + h.round : "Y0"}</th>`).join("")}${delta ? `<th class="r"${tipAttr("Change from the round before to the latest round")}>Δ</th>` : ""}</tr></thead><tbody>${rows.map(([label, f, kind, bold]) => {
      const a = delta ? f(H.at(-2)) : 0, b = delta ? f(H.at(-1)) : 0;
      const dCell = !delta ? "" : kind === "pct" ? td(Math.abs(b - a) < 0.0005 ? "—" : (b > a ? "+" : "−") + Math.abs(Math.round((b - a) * 1000) / 10) + " pt", "", "muted") : Math.abs(a) < 1e-9 ? td("—", "", "muted") : td(signed((b - a) / Math.abs(a)), label + ": " + fmtX(a, kind) + " → " + fmtX(b, kind), "muted");
      return `<tr${bold ? ' class="total"' : ""}><td>${label}</td>${H.map((h) => {
        const x = f(h);
        return `<td class="r num ${bold && kind !== "units" ? (x >= 0 ? "pos" : "neg") : x < 0 ? "neg" : ""}"${tipAttr(label + ", " + (h.round ? "round " + h.round : "year 0") + ": " + fmtX(x, kind))}>${fmtS(x, kind)}</td>`;
      }).join("")}${dCell}</tr>`;
    }).join("")}</tbody></table></div>`;
  }

  function tabReports() {
    const c = me(), i = ind(), B = FT.BALANCE, rt = S.reportTab || "income";
    const tabs = `<div class="subtabs" role="group" aria-label="Report">${REPORT_TABS.map(([k, n]) => `<button type="button" data-report="${k}" aria-pressed="${rt === k}">${n}</button>`).join("")}</div>`;
    let body = "";
    if (rt === "income") body = `<div class="card"><h3>Income statement</h3>${roundTable([
      ["Sold to shops", (h) => h.wholesaleSold, "units"], ["Shop price", (h) => h.price], ["Sold in own stores", (h) => h.retailSold, "units"], ["Store price", (h) => (h.retailSold ? h.retailPrice : 0)],
      ["Sold to the bulk buyer", (h) => h.bulkSold || 0, "units"], ["Revenue from shops", (h) => h.revenue - h.retailRevenue - (h.bulkRevenue || 0)], ["Revenue from own stores", (h) => h.retailRevenue], ["Revenue from the bulk buyer", (h) => h.bulkRevenue || 0], ["Total revenue", (h) => h.revenue],
      ["Cost of goods sold", (h) => -(h.revenue - h.profit - h.holdingCost - h.fixedCost - (h.idleCost || 0) - h.marketingCost - h.rndCost - h.brandCost - h.researchCost - h.storeUpkeep - h.interest - (h.wildcardCost || 0) - (h.legalCost || 0) - (h.staffCost || 0) - (h.auctionPaid || 0))],
      ["Stock holding", (h) => -h.holdingCost], ["Factory upkeep", (h) => -h.fixedCost], ["Idle machines", (h) => -(h.idleCost || 0)], ...(S.game.config.difficulty === "tycoon" ? [["Wages, hiring, layoffs", (h) => -(h.staffCost || 0)]] : []), ["Marketing", (h) => -h.marketingCost], ["R&D", (h) => -h.rndCost],
      ["Brand building", (h) => -h.brandCost], ["Market research", (h) => -h.researchCost], ["Store rent and staff", (h) => -h.storeUpkeep], ["Wildcards", (h) => -(h.wildcardCost || 0)], ["Lawsuits", (h) => -(h.legalCost || 0)], ["Auctions won", (h) => -(h.auctionPaid || 0)], ["Interest", (h) => -h.interest], ["Profit", (h) => h.profit, "eur", true],
    ], true)}<div class="hint">Cost of goods sold = production cost of the ${esc(i.labels.unit)} you actually sold.</div></div>`;
    if (rt === "cash") body = `<div class="card"><h3>Cash flow</h3>${roundTable([
      ["Cash at start", (h) => h.cashStart, "eur", false, true], ["Loans (net)", (h) => h.loanChange], ["Sales revenue", (h) => h.revenue], ["Production", (h) => -h.productionCost], ["Materials for next round", (h) => -(h.materialOrderCost || 0)], ["Stock exchange (live)", (h) => h.exchangeCash || 0], ["Deals with players", (h) => h.dealCash || 0],
      ["Stock holding", (h) => -h.holdingCost], ["Factory upkeep", (h) => -h.fixedCost], ["Idle machines", (h) => -(h.idleCost || 0)], ["Marketing", (h) => -h.marketingCost], ["R&D", (h) => -h.rndCost],
      ["Brand building", (h) => -h.brandCost], ["Market research", (h) => -h.researchCost], ["Store rent and staff", (h) => -h.storeUpkeep], ...(S.game.config.difficulty === "tycoon" ? [["Wages, hiring, layoffs", (h) => -(h.staffCost || 0)]] : []), ["Wildcards", (h) => -(h.wildcardCost || 0)], ["Lawsuits", (h) => -(h.legalCost || 0)], ["Auctions won", (h) => -(h.auctionPaid || 0)], ["Interest", (h) => -h.interest], ["Factory expansion", (h) => -h.capacityInvest], ["Store openings", (h) => -h.storeOpenCost],
      ["Shares in rivals", (h) => -h.sharePurchases], ["Shares sold", (h) => h.shareSales || 0], ["Showdown stakes", (h) => -(h.showdownPaid || 0)], ["Share buyback", (h) => -h.buybackCost], ["Dividends received", (h) => h.dividendsReceived], ["Dividends paid", (h) => -h.dividendsPaid],
      ["Emergency loan", (h) => h.emergencyLoan], ["Emergency loan fee", (h) => -h.emergencyFee], ["Cash at end", (h) => h.cashEnd, "eur", true],
    ], true)}<div class="hint">Production is paid when you make it, not when you sell it; that's why cash and profit differ.</div></div>`;
    if (rt === "production") body = `<div class="card"><h3>Production report</h3>${roundTable([
      ["Capacity", (h) => h.capacity, "units"], ["Produced", (h) => h.produced, "units"], ["Utilisation", (h) => (h.utilization ?? (h.capacity ? h.produced / h.capacity : 0)), "pct"],
      ["Made in overtime", (h) => h.overtimeUnits || 0, "units"], ["Idle capacity", (h) => h.idleUnits || 0, "units"],
      ["Stock at start", (h) => h.inventoryStart, "units"], ["Sold to shops", (h) => h.wholesaleSold, "units"], ["Sold in own stores", (h) => h.retailSold, "units"], ["Missed sales", (h) => h.unmetDemand, "units"], ["Stock at end", (h) => h.inventoryEnd, "units"],
      ["Production cost (paid now)", (h) => h.productionCost], ["of which overtime", (h) => h.overtimeCost || 0], ["of which spot materials", (h) => h.materialSpotCost || 0], ["Idle machines", (h) => h.idleCost || 0],
      ["Materials used from stock (list €)", (h) => h.materialFromStock || 0], ["Materials bought on the spot (list €)", (h) => h.materialSpot || 0], ["Materials ordered for next round", (h) => h.materialOrderUnits || 0, "units"], ["Paid for them", (h) => h.materialOrderCost || 0], ["Materials in stock after (list €)", (h) => h.materialStockEnd || 0], ["Sold to the bulk buyer", (h) => h.bulkSold || 0, "units"], ["Bulk price", (h) => h.bulkPrice || 0],
      ["Cost per " + i.labels.product + " (before overtime)", (h) => h.unitCostBase || (h.produced ? h.productionCost / h.produced : 0), "eur3"], ["Quality made", (h) => h.quality, "plain"], ["Material index", (h) => h.materialIndex ?? 1, "idx"],
    ])}<div class="hint">Cost per ${esc(i.labels.product)} = standard cost for that quality × materials × news × your experience. Work out how much cheaper experience has made you.</div></div>`;
    if (rt === "balance") {
      const v = CV(S.game).you, H = c.history;
      const last2 = H.slice(-2).map((h) => h.profit), avg = last2.length ? last2.reduce((a, b) => a + b, 0) / last2.length : 0;
      const inv = c.inventory * c.inventoryUnitCost * B.inventoryValueRate, factory = c.capacity * B.capacityBookValue * i.baseUnitCost;
      const stores = (c.stores || 0) * FT.RETAIL.bookValue;
      const brand = c.brand * B.brandValuePerPoint, earn = Math.max(0, avg) * B.earningsMultiple, stakes = v - (c.cash - c.debt + inv + factory + stores + brand + earn);
      const lines = [
        ["Cash", c.cash, "Money in the bank"], ["Stock", inv, unitsX(c.inventory) + " " + i.labels.unit + " at " + Math.round(B.inventoryValueRate * 100) + "% of cost"],
        ["Factory", factory, unitsX(c.capacity) + " capacity at " + eurX(B.capacityBookValue * i.baseUnitCost) + " each"], ["Own stores", stores, (c.stores || 0) + " stores at " + eurX(FT.RETAIL.bookValue) + " each"], ["Brand", brand, "Brand " + c.brand.toFixed(1) + " × " + eurX(B.brandValuePerPoint)],
        ["Earnings power", earn, "Average profit of the last two rounds × " + B.earningsMultiple], ["Shares in rivals", stakes, "Your stakes at their current value"], ["Debt", -c.debt, "Loans outstanding"],
      ].map(([k, x, why]) => `<div class="sumline"${tipAttr(k + ": " + eurX(x) + "\n" + why)}><span class="muted">${k}</span><span class="num ${x < 0 ? "neg" : ""}">${eur(x)}</span></div>`).join("");
      body = `<div class="card"><h3>What your company is worth now</h3>${lines}<div class="sumline total"${tipAttr("Company value: " + eurX(v))}><span>Company value (your score)</span><span class="num">${eur(v)}</span></div><div class="hint">Owned companies count at 75% at the end.</div></div>`;
    }
    if (rt === "groups") body = `<div class="card"><h3>Sales by customer group</h3>${roundTable(Object.keys(SEG).flatMap((k) => [
      [SEG[k] + ": sold", (h) => h.segments[k].sold, "units"], [SEG[k] + ": your share", (h) => h.segments[k].share, "pct"],
    ]))}<div class="hint">Share = your part of everything sold to that group in that round.</div></div>`;
    if (rt === "costs") {
      const fx = fxNow();
      const idx = (S.game.market && S.game.market.materialIndex) || 1;
      const rows = [1, 2, 3, 4, 5].map((q) => { const cost = FT.unitCost(i, q, 1, c.trait, S.game.config.difficulty === "tycoon"); return `<tr class="${q === S.draft.quality ? "me" : ""}${q > c.qualityCap ? " locked-row" : ""}"><td>Quality ${q}${q > c.qualityCap ? " (locked)" : ""}</td>${td("€" + cost.toFixed(3), "€" + cost.toFixed(4) + " per " + i.labels.product + " (standard)")}</tr>`; }).join("");
      const factors = `<div class="kv" style="margin-top:8px"><div${tipAttr("Raw material price index this round: " + idx.toFixed(3))}><span>Material index now</span><b>${idx.toFixed(2)}</b></div><div${tipAttr("Material share of the standard cost")}><span>Material share</span><b>${Math.round(FT.COSTS.materialShare * 100)}%</b></div><div${tipAttr("Production cost change from this round's news")}><span>News on costs</span><b>${Math.abs(fx.cost - 1) < 0.0005 ? "none" : signed(fx.cost - 1)}</b></div></div>`;
      body = `<div class="grid2"><div class="card"><h3>Standard cost per ${esc(i.labels.product)}</h3>${tbl(["", "Standard"], rows)}${factors}<div class="hint">Standard = material index 1.00, no news, no experience${c.trait === "pennyPincher" ? ", your Penny-Pincher discount included" : ""}. Your real cost this round is yours to work out.</div></div>${costRules()}</div>`;
    }
    return `<div style="display:grid;gap:14px;min-width:0">${tabs}${body}</div>`;
  }

  // ---------------- news tab ----------------
  function tabNews() {
    S.newsSeen = S.chat.length;
    const items = S.game.finished ? [] : S.game.news.filter((n) => n.event.kind !== "economy").map(newsItem);
    const idx = Math.min(S.newsIdx || 0, Math.max(0, items.length - 1));
    const tv = items.length ? tvHtml(items[idx], "n" + idx, idx, items.length, true) + (items.length > 1 ? `<div style="display:flex;gap:8px;justify-content:center"><button class="btn" type="button" data-news-step="-1" ${idx === 0 ? "disabled" : ""}>Previous</button><button class="btn" type="button" data-news-step="1" ${idx === items.length - 1 ? "disabled" : ""}>Next</button></div>` : "")
      : `<div class="hint">No news is moving the market right now. Enjoy the quiet.</div>`;
    const feedItems = feedHtml(S.chat.slice().reverse());
    return `<div class="grid2">
      <div style="display:grid;gap:10px;min-width:0">${marketReport()}<div class="card"><h3>On air this round</h3>${tv}</div>${reviewsCard()}</div>
      <div class="card"><h3>Live feed</h3><div class="feed" style="max-height:520px">${feedItems}</div></div></div>`;
  }

  // ----- Product reviews: what critics and customers said about every product last round (public).
  const starText = (n) => "★★★★★".slice(0, n) + "☆☆☆☆☆".slice(0, 5 - n);
  function reviewsCard() {
    const rows = S.game.companies.filter((o) => live(o) || o.history.at(-1)?.reviews).map((o) => ({ o, r: o.history.at(-1)?.reviews })).filter((x) => x.r && x.o.history.at(-1).round >= 1).sort((a, b) => b.r.stars - a.r.stars);
    if (!rows.length) return "";
    return `<div class="card"><h3>What people say</h3><div class="reviews">${rows.map(({ o, r }) => `<div class="review ${o.id === "you" ? "me" : ""}"><div class="rv-head"><span class="dot" style="background:${colVar(o.id)}"></span><b>${esc(o.productName || o.companyName)}</b>${o.productName ? `<span class="muted">${esc(o.companyName)}</span>` : ""}<span class="rv-stars" aria-label="${r.stars} stars">${starText(r.stars)}</span></div>${r.quotes.map((q) => `<div class="rv-q">${esc(q)}</div>`).join("")}</div>`).join("")}</div>
      <div class="hint">Stars follow value for money (quality and brand against price, compared with the rest of the market). Just for fun: reviews don't change your sales.</div></div>`;
  }

  // TOPSIM-style market report: a few small indicators every round.
  function marketReport() {
    if (S.game.finished) return "";
    const eco = S.game.news.filter((n) => n.event.kind === "economy");
    const chips = (e) => effectChips(e).map((x) => `<span class="fx ${x.good ? "up" : "down"}">${x.good ? "▲" : "▼"} ${esc(x.label)}</span>`).join("");
    return `<div class="card"><h3>Market report for round ${S.game.round}</h3>${eco.length ? eco.map((n) => `<div class="sumline" style="align-items:center"><span>${esc(n.event.headline)}</span><span class="fxrow" style="justify-content:flex-end">${chips(n.event.effect)}</span></div>`).join("") : `<div class="hint">No market report this round.</div>`}
      <div class="hint">Small shifts that last one round. Work them into your own forecast; the Market study includes them for you.</div></div>`;
  }

  // Feed items newest first, grouped under a small "Round N" divider.
  function feedHtml(list) {
    let last = null, out = "";
    for (const m of list) {
      if (m.round !== last) { out += `<div class="feed-round"><span>${m.round === 0 ? "Before the game" : "Round " + m.round}</span></div>`; last = m.round; }
      if (m.kind === "chat") {
        const c = byId(m.who);
        out += `<div class="msg"><canvas data-avatar="${m.who}" width="12" height="12" aria-hidden="true"></canvas><div><b class="who" style="color:${colVar(m.who)}">${esc(c ? c.playerName : "")}:</b> ${esc(m.text)}</div></div>`;
      } else out += `<div class="msg"><span class="icon ${m.kind === "news" ? "news" : ""}">${m.kind === "news" ? "NEWS" : "FT"}</span><div>${esc(m.text)}</div></div>`;
    }
    return out;
  }
  function feed() {
    const items = feedHtml(S.chat.slice(-40).reverse());
    const active = S.game.news.map((n) => `<b>${esc(n.event.headline)}</b> <span class="muted">(${esc(effectText(n.event.effect))})</span>`).join("<br>");
    return `<section class="win" aria-label="Live feed"><div class="win-title">Live feed<span class="x" aria-hidden="true">×</span></div><div class="win-body">
      ${active && !S.game.finished ? `<div class="note" style="color:var(--ink)">This round: ${active}</div>` : ""}
      <div class="feed" aria-live="polite">${items}</div></div></section>`;
  }

  // ---------------- modals ----------------
  function modalSound() {
    if (!S.game) return;
    const key = S.modal + ":" + S.game.round + ":" + (S.tvIndex || 0);
    if (S.lastSound === key) return;
    S.lastSound = key;
    if (S.modal === "results") setTimeout(() => sfx(me().history.at(-1).profit >= 0 ? "profit" : "loss"), 350);
    if (S.modal === "tv") sfx(S.tvQueue[S.tvIndex] && ["deal", "showdown"].includes(S.tvQueue[S.tvIndex].scene) ? "takeover" : S.tvQueue[S.tvIndex] && S.tvQueue[S.tvIndex].scene === "auction" ? "profit" : "news");
    if (S.modal === "final") setTimeout(() => sfx(FT.standings(S.game)[0].companyId === "you" ? "win" : "lose"), 350);
  }
  function renderModal() {
    if (!S.modal) { modal.innerHTML = ""; return; }
    modalSound();
    let inner = "";
    if (S.modal === "results") inner = resultsModal();
    if (S.modal === "final") inner = finalModal();
    if (S.modal === "setup") inner = setupModal();
    if (S.modal === "tv") inner = tvModal();
    if (S.modal === "vote") inner = voteModal();
    if (S.modal === "sheet") inner = sheetModal();
    if (S.modal === "help") inner = helpModal();
    if (S.modal === "show") inner = showModal();
    if (S.modal === "online") inner = onlineModal();
    if (S.modal === "mission") inner = briefingModal();
    if (S.modal === "profile") inner = profileModal();
    if (S.modal === "friends") inner = friendsModal();
    if (S.modal === "achievements") inner = achievementsModal();
    if (S.modal === "daily") inner = dailyModal();
    if (S.modal === "leaderboard") inner = leaderboardModal();
    if (S.modal === "wait") inner = waitModal();
    if (S.modal === "board") inner = boardModal();
    if (S.modal === "soon") inner = soonModal();
    if (S.modal === "options") inner = optionsModal();
    if (S.modal === "privacy") inner = privacyModal();
    if (S.modal === "terms") inner = termsModal();
    if (S.modal === "credits") inner = creditsModal();
    if (S.modal === "age") inner = ageModal();
    modal.innerHTML = `<div class="overlay" role="dialog" aria-modal="true">${inner}</div>`;
    modal.querySelectorAll("canvas[data-avatar]").forEach((cv) => drawAvatar(cv, cv.dataset.avatar, colRaw(cv.dataset.avatar)));
    modal.querySelectorAll("canvas[data-trait]").forEach((cv) => drawTrait(cv, cv.dataset.trait));
    countUp(modal);
    if (S.modal === "show") runShow();
    if (S.modal === "board") runBoard();
    if (S.modal === "wait") mpTick();
    const focus = modal.querySelector("[data-autofocus]");
    if (focus) focus.focus();
    runTv();
  }

  function voteModal() {
    const g = S.game, opts = g.summit.options.map((r, k) => {
      const reg = FT.SUMMIT.regulations[r], v = k ? "b" : "a";
      const chips = effectChips(reg.effect).map((c) => `<span class="fx ${c.good ? "up" : "down"}">${c.good ? "▲" : "▼"} ${esc(c.label)}</span>`).join("");
      return `<div class="vote-opt ${S.draft.vote === v ? "picked" : ""}"><h3>${esc(reg.name)}</h3><div class="hint" style="font-weight:700">${esc(reg.description)}</div><div class="fxrow">${chips}</div><button class="btn go" type="button" data-vote="${v}" ${k === 0 ? "data-autofocus" : ""}>Vote for this</button></div>`;
    }).join("");
    return `<div class="win"><div class="win-title">Industry summit: your vote is required<span class="x" aria-hidden="true">×</span></div><div class="win-body">
      <div class="intro">Every company votes on one of two new rules. <b>Majority wins</b>; a tie is a coin flip. The winning rule applies for ${FT.SUMMIT.duration} rounds, starting next round, to everyone. Think about which one hurts your rivals more than you. Votes are secret.</div>
      <div class="vote-opts">${opts}</div>
      <div style="display:flex;gap:10px;justify-content:space-between;align-items:center;flex-wrap:wrap"><span class="hint">You can change your vote in the Boardroom until you submit.</span><button class="btn" type="button" id="btn-close">Look at the numbers first</button></div>
    </div></div>`;
  }

  // Like TOPSIM's decision form: everything you're about to submit, in one place.
  function sheetModal() {
    const c = me(), d = S.draft, g = S.game, i = ind(), D = diff();

  // Celebration layers: coins for a profit, a little rain for a loss, confetti for a win.
  function fxLayer(kind) {
    if (reduceMotion()) return "";
    const r = seeded(kind + (S.game ? S.game.round : 0)), n = kind === "confetti" ? 60 : kind === "coins" ? 26 : 34;
    const cols = ["#ffd166", "#ff5c9a", "#4fd987", "#3d8bff", "#b15cff", "#ff6b3d"];
    let out = "";
    for (let k = 0; k < n; k++) {
      const left = (r() * 100).toFixed(1), delay = (r() * (kind === "rain" ? 1.2 : 0.9)).toFixed(2), dur = (kind === "rain" ? 0.7 + r() * 0.5 : 1.4 + r() * 1.1).toFixed(2);
      const style = `left:${left}%;animation-delay:${delay}s;animation-duration:${dur}s;` + (kind === "confetti" ? `background:${cols[k % cols.length]}` : "");
      out += `<i class="fx-${kind}" style="${style}"></i>`;
    }
    return `<div class="fx-layer" aria-hidden="true">${out}</div>`;
  }
  function countUp(root) {
    if (reduceMotion()) return;
    const els = [...root.querySelectorAll("[data-count]")];
    if (!els.length) return;
    const start = performance.now(), D = 900;
    const fmt = (el, x) => el.dataset.fmt === "units" ? units(Math.max(0, x)) : el.dataset.fmt === "eursigned" ? (x >= 0 ? "+" : "") + eur(x) : eur(x);
    const tick = (now) => {
      const t = Math.min(1, (now - start) / D), e = 1 - Math.pow(1 - t, 3);
      for (const el of els) { if (!document.body.contains(el)) return; el.textContent = fmt(el, Number(el.dataset.count) * e); }
      if (t < 1) requestAnimationFrame(tick);
    };
    requestAnimationFrame(tick);
  }

  function investorResultCard(r) {
    const calls = S.game.companies.filter((o) => live(o)).map((o) => ({ o, h: o.history.find((x) => x.round === r.round) })).filter((x) => x.h && x.h.guidance);
    if (!r.guidance && !calls.length) return "";
    const mine = r.guidance;
    const errTxt = (e) => (e * 100 < 10 ? (e * 100).toFixed(1) : Math.round(e * 100)) + "% off";
    const unit = esc(ind().labels.unit[0].toUpperCase() + ind().labels.unit.slice(1));
    return `<div class="card"><h3>Investor call</h3>
      ${mine ? tbl(["", "You said", "Actual", "Off by"], `<tr><td>${unit}</td>${td(units(mine.units), unitsX(mine.units))}${td(units(r.sold), unitsX(r.sold))}${td(errTxt(mine.unitsErr).replace(" off", ""), "", mine.unitsErr <= FT.GUIDANCE.hit[0] ? "pos" : mine.unitsErr > FT.GUIDANCE.miss[0] ? "neg" : "")}</tr><tr><td>Profit</td>${td(eur(mine.profit), eurX(mine.profit))}${td(eur(r.profit), eurX(r.profit))}${td(errTxt(mine.profitErr).replace(" off", ""), "", mine.profitErr <= FT.GUIDANCE.hit[1] ? "pos" : mine.profitErr > FT.GUIDANCE.miss[1] ? "neg" : "")}</tr>`)

      ${calls.length ? `<div class="hint" style="margin-top:4px">Everyone's calls this round:</div><div class="fxrow">${calls.map(({ o, h }) => `<span class="gchip ${h.guidance.result}"><span class="dot" style="background:${colVar(o.id)}"></span>${esc(o.id === "you" ? "You" : o.companyName)}: ${RESULT_LABEL[h.guidance.result]}</span>`).join("")}</div>` : ""}

  function afterResults() {
    if (S.boardQueue && S.boardQueue.length) { S.boardIndex = 0; return "board"; }

  function funnyNames(buyer, target) {
    const b = buyer.replace(/ (Inc\.|Co|& Co|Labs|AI)$/, "");
    return [`${b}'s Little Helper`, `${target} (Owned)`, `Formerly ${target}`, `${b} Junior`, `${b} Mini`, `Property of ${b}`].filter((n) => n.length <= 28);

  // Ten board seats, one per 10 shares: who sits where after the deal.
  function seatsOf(c) {
    const out = [];
    const add = (id, n) => { for (let k = 0; k < Math.round(n / 10); k++) out.push(id); };
    const holders = Object.entries(c.shares.holders).sort((a, b) => b[1] - a[1]);
    for (const [h, n] of holders) add(h, n);
    add(c.id, c.shares.founder);
    add("treasury", c.shares.treasury);
    while (out.length < 10) out.push("public");
    return out.slice(0, 10);
  }

  let boardRaf = 0;

    cancelAnimationFrame(boardRaf);

    R(g, 0, 50, 192, 58, "#5b1f2b"); for (let y = 52; y < 108; y += 6) R(g, 0, y, 192, 1, "#4a1823");

  function drawTakeover(g, f, item, once) {

    try { g.imageSmoothingEnabled = false; g.drawImage(face(b), 16, 58, 16, 16); } catch (e) {}
    R(g, 14, 74, 20, 4, colRaw(b));
    const tx = signed ? 170 + Math.min(10, f - 26) : 160, ty = signed ? 80 + Math.min(10, f - 26) : 58, ts = signed ? 10 : 16;
    try { g.drawImage(face(t), tx, ty, ts, ts); } catch (e) {}

    if (f >= 20) { const cx = Math.min(86, 40 + (f - 20) * 12); R(g, cx, 64, 20, 14, "#f6efe0"); for (let k = 0; k < 4; k++) R(g, cx + 3, 67 + k * 2, 14, 1, "#b8b0a0"); }

  function money(n) { return n >= 1e6 ? (n / 1e6).toFixed(1) + "M" : Math.round(n / 1000) + "K"; }

  // ----- End-of-game titles: one per category, for fun.
  function gameTitles() {
    const cs = S.game.companies, H = (c) => c.history.filter((h) => h.round >= 1);
    const avg = (c, f) => { const h = H(c); return h.length ? h.reduce((a, x) => a + f(x), 0) / h.length : 0; };
    const sum = (c, f) => H(c).reduce((a, x) => a + f(x), 0);
    const pick = (f, best = "max", ok = () => true) => { const list = cs.filter((c) => live(c) && ok(c)); if (!list.length) return null; return list.sort((a, b) => (best === "max" ? f(b) - f(a) : f(a) - f(b)))[0].id; };
    const out = [];
    const add = (id, label, why) => { if (id) out.push({ id, label, why }); };
    add(pick((c) => avg(c, (h) => h.price), "min"), "Price-war criminal", "Lowest average price");
    add(pick((c) => avg(c, (h) => h.price * h.quality)), "Luxury lord", "Highest price × quality");
    add(pick((c) => cs.filter((o) => o.controlledBy === c.id).length, "max", (c) => cs.some((o) => o.controlledBy === c.id)), "Hostile hugger", "Most companies taken over");
    add(pick((c) => Math.max(...H(c).map((h) => h.sold), 0)), "Volume machine", "Most units sold in one round");
    add(pick((c) => sum(c, (h) => h.marketingCost), "min"), "Penny pincher", "Least spent on marketing");
    add(pick((c) => sum(c, (h) => h.marketingCost)), "Mad Men", "Most spent on marketing");

  }

  let rafId = 0;

  function animateSkyline() {

    drawCity(S.anim ? 0 : 1);
    const tick = (now) => {

    rafId = requestAnimationFrame(tick);

  function shade(hex, amt) {
    const m = hex.replace("#", "").match(/.{2}/g);
    if (!m) return hex;
    const [r, g, b] = m.map((x) => parseInt(x, 16));
    const f = (v) => Math.max(0, Math.min(255, Math.round(amt >= 0 ? v + (255 - v) * amt : v * (1 + amt))));
    return "#" + [f(r), f(g), f(b)].map((v) => v.toString(16).padStart(2, "0")).join("");
  }

  function drawCity(t) {
    const cv = $("#city");
    const g = cv && cv.getContext && cv.getContext("2d");
    if (!g) return;
    const W = cv.width, H = cv.height, gy = H - 14, day = isDay();
    const LIT = day ? "#d8ecff" : "#ffd166", DOOR = day ? "#e8d3a8" : "#ffcf6a", DOOR2 = day ? "#f6ead0" : "#ffe8a8";
    // Sky, stars, moon with a soft glow.
    const sky = g.createLinearGradient(0, 0, 0, gy);
    if (day) { sky.addColorStop(0, "#5fb4ff"); sky.addColorStop(0.65, "#a9dcff"); sky.addColorStop(1, "#e3f4ff"); }
    else { sky.addColorStop(0, "#070c24"); sky.addColorStop(0.6, "#121c48"); sky.addColorStop(1, "#24336e"); }
    g.fillStyle = sky; g.fillRect(0, 0, W, H);
    const sr = seeded("stars");
    for (let k = 0; k < (day ? 0 : 70); k++) { g.fillStyle = sr() > 0.8 ? "#ffffff" : "rgba(255,255,255,0.45)"; g.fillRect(Math.floor(sr() * W), Math.floor(sr() * (gy - 50)), 1, 1); }
    const mx = W - 34, my = 22;
    if (day) { sun(g, W - 14, 14, 0); clouds(g, W, 40, Math.floor(performance.now() / 120), "cclouds"); }
    else for (let rad = 16; rad > 9; rad -= 2) { g.fillStyle = `rgba(255,250,220,${0.035 * (17 - rad) / 2})`; g.beginPath(); g.arc(mx, my, rad, 0, Math.PI * 2); g.fill(); }
    if (!day) {
      g.fillStyle = "#f6f0d2"; g.beginPath(); g.arc(mx, my, 8, 0, Math.PI * 2); g.fill();
      g.fillStyle = "#ddd5ae"; g.fillRect(mx - 3, my - 2, 2, 2); g.fillRect(mx + 2, my + 2, 3, 2);
    }
    // Two layers of background city with scattered lit windows.
    const winColors = day ? ["#e8f4ff", "#cfe6ff", "#f2f8ff", "#dbeaff"] : ["#ffd166", "#7ad7ff", "#ff7ab8", "#b9a2ff"];
    const layer = (seed, color, minH, maxH, density, yOff) => {
      const r = seeded(seed);
      for (let x = -4; x < W; ) {
        const w = 8 + Math.floor(r() * 14), h = minH + Math.floor(r() * (maxH - minH));
        g.fillStyle = color; g.fillRect(x, gy - h - yOff, w, h + yOff);
        if (r() > 0.75) { g.fillRect(x + Math.floor(w / 2), gy - h - yOff - 6, 1, 6); }
        for (let wy = gy - h - yOff + 3; wy < gy - 3; wy += 4) for (let wx = x + 2; wx < x + w - 2; wx += 3) if (r() < density) { g.fillStyle = winColors[Math.floor(r() * winColors.length)]; g.globalAlpha = 0.55; g.fillRect(wx, wy, 1, 2); g.globalAlpha = 1; }
        x += w + 1 + Math.floor(r() * 3);
      }
    };
    layer("far", day ? "#9cb3d8" : "#16214f", 28, 74, 0.08, 6);
    layer("near", day ? "#7d96c2" : "#0d1538", 16, 46, 0.14, 0);
    // Street: sidewalk, road with dashed line, lamps.
    g.fillStyle = day ? "#c9c1b0" : "#2b335c"; g.fillRect(0, gy, W, 3);
    g.fillStyle = day ? "#4a5063" : "#0a0e22"; g.fillRect(0, gy + 3, W, H - gy - 3);
    g.fillStyle = "#ffc531"; for (let x = 4; x < W; x += 14) g.fillRect(x, gy + 8, 7, 1);
    // Traffic.
    const carCols = ["#e8e8e8", "#d94a4a", "#f0b429", "#3d8bff", "#4fd987"];
    for (let k = 0; k < 4; k++) {
      const dir = k % 2 ? 1 : -1, sp = 0.9 + (k % 3) * 0.5, span = W + 30;
      const pos = (((k * 131 + cityFrame * sp) % span) + span) % span;
      const x = Math.round(dir > 0 ? pos - 15 : W + 15 - pos - 10), y = gy + (dir > 0 ? 10 : 4);
      g.fillStyle = carCols[k % carCols.length]; g.fillRect(x, y, 10, 3); g.fillRect(x + 2, y - 2, 5, 2);
      g.fillStyle = "#9fd3ff"; g.fillRect(x + 3, y - 1, 3, 1);
      g.fillStyle = "#fff3b0"; g.fillRect(dir > 0 ? x + 9 : x, y + 1, 1, 1);
    }

    const comps = S.game.companies, n = comps.length;
    const vNow = CV(S.game);
    const from = S.anim ? S.anim.from : vNow, to = S.anim ? S.anim.to : vNow;
    const val = (id) => from[id] + (to[id] - from[id]) * t;
    const maxV = Math.max(...comps.map((c) => Math.max(0, from[c.id], to[c.id])), 1);
    const slot = W / n;
    cityRects = [];
    comps.forEach((c, i) => {
      const color = colRaw(c.id), light = shade(color, 0.45), dark = shade(color, -0.45), darker = shade(color, -0.7);
      const cx = Math.round(slot * (i + 0.5)), bw = Math.min(62, Math.floor(slot) - 18), x0 = cx - Math.floor(bw / 2);
      const h = c.bankrupt ? 22 : Math.max(26, Math.round(28 + 100 * Math.max(0, val(c.id)) / maxV));
      let top = gy - h;
      const zone = positionOf(c);
      const r = seeded("win" + c.id);
      cityRects.push({ id: c.id, x0, bw, top, zone });
      if (c.merged) {
        // A holding company: a slim grey office flying the flag of the company it merged into.
        g.fillStyle = "#5b6178"; g.fillRect(x0 + 8, top, bw - 16, h);
        g.fillStyle = "#7d849d"; for (let y = top + 4; y < gy - 3; y += 6) g.fillRect(x0 + 11, y, bw - 22, 3);
        const into = c.merged.into; g.fillStyle = "#e9e9e9"; g.fillRect(cx, top - 14, 1, 14); g.fillStyle = colRaw(into); g.fillRect(cx + 1, top - 14, 9, 6);

      // Move this company's name sign above its roof.
