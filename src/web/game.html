    ];
    return `<div class="card"><h3>Cost rules</h3>${rules.map(([k, v]) => `<div class="sumline"><span class="muted">${k}</span><span style="text-align:right">${v}</span></div>`).join("")}
      <div class="hint">Plan your own budget: production, marketing, investments and share purchases all come out of your cash this round.</div></div>`;
  }
  function valueChart(W, H) {
    const L = 50, R = 10, T = 10, B = 24, ids = S.game.companies.map((c) => c.id), n = S.hist.you.length;
    const max = Math.max(...ids.flatMap((id) => S.hist[id]), 1) * 1.08;
    const step = niceStep(max / 4), top = Math.ceil(max / step) * step;
    const x = (i) => L + (n > 1 ? (i / (n - 1)) * (W - L - R) : (W - L - R) / 2);
    const y = (v) => T + (1 - Math.max(0, v) / top) * (H - T - B);
    let s = "";
    for (let t = 0; t <= top + 1e-9; t += step) s += `<line x1="${L}" x2="${W - R}" y1="${y(t)}" y2="${y(t)}" stroke="rgba(255,255,255,0.08)"/><text x="${L - 6}" y="${y(t) + 4}" text-anchor="end">${eur(t, 0)}</text>`;
    for (let i = 0; i < n; i++) s += `<text x="${x(i)}" y="${H - 7}" text-anchor="middle">${i === 0 ? "Y0" : "R" + i}</text>`;
    for (const id of ids) {
      const pts = S.hist[id].map((v, i) => `${x(i)},${y(v)}`).join(" ");
      s += `<polyline points="${pts}" fill="none" stroke="${colRaw(id)}" stroke-width="${id === "you" ? 3.5 : 2}" stroke-linejoin="round" stroke-linecap="round"/><circle cx="${x(n - 1)}" cy="${y(S.hist[id].at(-1))}" r="${id === "you" ? 5 : 3.5}" fill="${colRaw(id)}"/>`;
    }
    for (const id of ids) S.hist[id].forEach((v, i) => { s += `<circle cx="${x(i)}" cy="${y(v)}" r="7" fill="transparent"${tipAttr(byId(id).companyName + " · " + (i === 0 ? "year 0" : "round " + i) + ": " + eurX(v))}/>`; });
    return `<div class="chart"><svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Company value per round">${s}</svg></div>`;
  }

  function ownBar(c) {
    const parts = [[c.shares.founder, colRaw(c.id), "founder"], [c.shares.treasury, "#5b6690", "bought back"]];
    for (const [h, v] of Object.entries(c.shares.holders)) if (v) parts.push([v, colRaw(h), byId(h).companyName]);
    parts.push([c.shares.float, "#2c3970", "public"]);
    return `<div class="own-bar" title="${parts.filter((p) => p[0]).map((p) => p[2] + " " + p[0] + "%").join(", ")}">${parts.filter((p) => p[0] > 0).map((p) => `<div style="width:${p[0]}%;background:${p[1]}"></div>`).join("")}</div>`;
  }

  function ownBarWide(c) {
    return `<div class="own-wrap">${ownBar(c)}<div class="half" aria-hidden="true"><span>50% = control</span></div></div>`;
  }
  function premiumFor(target) {
    const held = target.shares.holders.you || 0, ruthless = me().trait === "ruthless" ? 0.85 : 1;
    const investorDay = (S.game.specialEvents || []).some((e) => e.round === S.game.round && e.id === "investorDay") ? FT.EVENTS.investorDay.premiumFactor : 1;
    return (FT.BALANCE.takeoverPremium + FT.BALANCE.premiumPerHeldShare * held) * ruthless * investorDay;
  }
  function planShareCost() {
    const p = SP(S.game);
    return Object.entries(S.draft.buyShares || {}).reduce((a, [id, n]) => a + n * p[id] * (1 + premiumFor(byId(id))), 0);
  }
  function tabTakeovers() {
    const c = me(), d = S.draft, p = SP(S.game), B = FT.BALANCE, D = diff();
    const unlocked = S.game.round >= D.takeoverUnlockRound;
    let seenHow = false;
    try { seenHow = !!localStorage.getItem("ft-seen-how-takeovers"); localStorage.setItem("ft-seen-how-takeovers", "1"); } catch (e) {}
    const how = `<details class="card howto" ${seenHow ? "" : "open"}><summary><h3>How takeovers work</h3></summary><ol class="steps">
      <li><span><b>Buy shares.</b> Every company has 100 shares. The founder keeps ${B.startShares.founder}; the rest are for sale to anyone. One share costs 1% of the company's value (its share price) plus a takeover premium of ${Math.round(B.takeoverPremium * 100)}%, which rises the more shares you already own.</span></li>
      <li><span><b>Own more than 50 shares and you control the company.</b> Your shares add up over the rounds. You can buy at most ${D.maxSharesPerRound} per company per round, so it takes at least ${Math.ceil(51 / D.maxSharesPerRound)} rounds.</span></li>
      <li><span><b>Control everyone, win the game.</b> If you control every other company still in business, it's a monopoly: the game ends right away and you win.</span></li>
      <li><span><b>Control pays off.</b> Every round the company you control pays half its profit to its shareholders (you get your %). At the end you get a bonus of ${Math.round(B.controllerBonusRate * 100)}% of its value, and its owner only scores ${Math.round(B.controlledScoreMultiplier * 100)}%. Your shares also count in your own company value.</span></li>
      <li><span><b>Sell or dump shares.</b> You can sell shares you own at any time, for the share price minus ${Math.round(FT.BALANCE.sellDiscount * 100)}%. Dumping scares investors: every share you sell knocks ${(FT.BALANCE.dumpImpactPerShare * 100).toFixed(1)}% off that company's value (at most ${Math.round(FT.BALANCE.dumpImpactCapPerRound * 100)}% a round), and your own sale goes through at the lower price. The panic halves every round. Use it to cash out a stake you can't use, or to hit a rival where it hurts.</span></li>
      <li><span><b>Defend yourself.</b> Buy back your own shares so nobody can buy them, or keep a defense fund. When someone tries to pass 50%, a boardroom showdown decides: the higher sealed stake wins, a tie goes to the defender, and both pay what they staked.</span></li>
    </ol><div class="hint">After a takeover the buyer's board needs ${D.takeoverCooldown} round${D.takeoverCooldown === 1 ? "" : "s"} of rest before buying again.</div></details>`;
    const legend = `<div class="legend"><span><i style="background:linear-gradient(90deg,var(--c0),var(--c1),var(--c2))"></i>Company's own colour: its founder's shares</span><span><i style="background:#5b6690"></i>Bought back</span><span><i style="background:#2c3970"></i>For sale</span><span>Other colours: shares held by that company</span></div>`;
    let status = "";
    if (!unlocked) status = `<div class="locked">Share trading opens in round ${D.takeoverUnlockRound}. Build a war chest until then, or save for your defense.</div>`;
    else if (c.takeoverCooldown > 0) status = `<div class="locked">Your board wants a breather after that takeover: ${c.takeoverCooldown} more round${c.takeoverCooldown > 1 ? "s" : ""} before you can buy again.</div>`;
    const canBuy = unlocked && c.takeoverCooldown <= 0;
    const list = S.game.companies.filter((o) => o.id !== "you" && !o.bankrupt).map((o) => {
      const held = o.shares.holders.you || 0, blocked = o.controlledBy && o.controlledBy !== "you", mine = o.controlledBy === "you";
      const max = !canBuy || blocked ? 0 : Math.min(o.shares.float, D.maxSharesPerRound);
      const pay = p[o.id] * (1 + premiumFor(o)), need = Math.max(0, 51 - held);
      const line = mine ? `<span class="pos">You control this company.</span>` : blocked ? `Controlled by ${esc(byId(o.controlledBy).companyName)}: you can't buy in.${held ? ` Your ${held}% still counts in your value and earns dividends, or you can dump it.` : ""}` : `You own <b>${held}%</b> · ${o.shares.float}% for sale · you need <b>${need}</b> more for control${need > o.shares.float ? ` <span class="neg">(only ${o.shares.float}% is left for sale, so you can't get control right now)</span>` : ""}`;
      return `<div class="rival" style="--pc:${colVar(o.id)}"><div style="min-width:0"><b>${esc(o.companyName)}</b> <span class="muted" style="font-size:12.5px">· ${esc(o.playerName)}</span>
          <div class="muted" style="font-size:12.5px"${tipAttr("Share price " + eurX(p[o.id]) + "\nPremium " + (premiumFor(o) * 100).toFixed(1) + "%\nYou pay " + eurX(pay) + " per share")}>Share price ${eur(p[o.id])} · you pay ${eur(pay)} per share</div>
          <div style="font-size:12.5px">${line}</div>${ownBarWide(o)}</div>
        <div class="trade"><span class="tl">Buy</span><div class="stepper"><button type="button" data-buy-step="${o.id}" data-dir="-1" aria-label="Buy fewer shares of ${esc(o.companyName)}" ${max ? "" : "disabled"}>−</button><output class="num" id="buy-${o.id}">${d.buyShares[o.id] || 0}</output><button type="button" data-buy-step="${o.id}" data-dir="1" data-max="${max}" aria-label="Buy more shares of ${esc(o.companyName)}" ${max ? "" : "disabled"}>+</button></div>
          ${held ? `<span class="tl sell">Sell / dump</span><div class="stepper"><button type="button" data-sell-step="${o.id}" data-dir="-1" aria-label="Sell fewer shares of ${esc(o.companyName)}">−</button><output class="num" id="sell-${o.id}">${(d.sellShares || {})[o.id] || 0}</output><button type="button" data-sell-step="${o.id}" data-dir="1" aria-label="Sell more shares of ${esc(o.companyName)}">+</button></div>` : ""}</div></div>`;
    }).join("");
    const holders = Object.entries(c.shares.holders).filter(([, v]) => v);
    const biggest = holders.length ? Math.max(...holders.map(([, v]) => v)) : 0;
    return `<div class="grid2">
      <div style="display:grid;gap:10px;min-width:0">${how}${status}<div class="card"><h3>Rivals' shares</h3>${legend}<div class="hint">Use + and − to buy shares in steps of 5.${canBuy ? "" : " Buying is locked right now."}</div>
        <div class="note" style="color:var(--ink)">Shares are paid from the cash you have left <b>after</b> all your other costs this round (production, marketing, investments, stores). If that runs out, you get fewer shares; your round report says why. Plan it in Finance: borrow if you need to.</div>
        <div class="sumline"${tipAttr("Exact: " + eurX(planShareCost()))}><span class="muted">Your planned share purchases cost about</span><b class="num" id="share-cost">${eur(planShareCost())}</b></div></div>${list}</div>
      <div style="display:grid;gap:12px;min-width:0">
        <div class="card"><h3>Who owns you</h3>${ownBarWide(c)}<div class="hint">${holders.length ? holders.map(([h, v]) => esc(byId(h).companyName) + " owns " + v + "%").join(" · ") : "No rival owns your shares. Yet."} · for sale ${c.shares.float}% · bought back ${c.shares.treasury}%</div>
          ${c.controlledBy ? `<div class="note">${esc(byId(c.controlledBy).companyName)} controls you. You keep playing, but half your profit goes out as dividends and you score at ${Math.round(B.controlledScoreMultiplier * 100)}%.</div>` : biggest >= 25 ? `<div class="note">Watch out: a rival owns ${biggest}% of you. Consider a buyback or a defense fund.</div>` : ""}</div>
        ${stepper("f-buyback", "Buy back own shares", d.buyback, 0, c.shares.float, 1, (x) => x + " shares", `<div class="hint muted" style="font-size:12.5px">Bought-back shares can never be bought by rivals. You pay your share price plus ${Math.round(B.buybackPremium * 100)}%.</div>`)}
        <div class="card"><h3>Boardroom showdown</h3><ol class="steps">
          <li><span>A showdown only happens when someone's purchase would take them <b>past 50%</b> of a company that has a <b>defense fund</b> of at least ${eurX(FT.SHOWDOWN.minStake)}. No defense fund: the buyer simply gets control.</span></li>
          <li><span>Then the buyer's <b>attack stake</b> and the target's <b>defense fund</b> are compared. Nobody sees the other's amount beforehand.</span></li>
          <li><span><b>Higher amount wins</b>; a tie goes to the defender. If the defender wins, the buyer stops at exactly 50% (no control). Both sides pay what they put in, win or lose.</span></li>
          <li><span>No showdown, no cost: both amounts are only paid when a showdown actually happens.</span></li>
        </ol><div class="hint">Example: you buy your way to 55% of a rival with a €300k attack stake. They have a €200k defense fund. You win: you pay €300k, they pay €200k, and you control them.</div></div>
        ${stepper("f-tstake", "Attack stake: what you'll fight with", d.takeoverStake, 0, 2000000, 25000, eur, `<div class="hint muted" style="font-size:12.5px">Used only if one of your purchases this round takes you past 50% of a company with a defense fund. It comes out of the cash left after your share purchases.</div>`)}
        ${stepper("f-dstake", "Defense fund: what you'll defend with", d.defenseStake, 0, 2000000, 25000, eur, `<div class="hint muted" style="font-size:12.5px">Stays set every round until you change it. Used only if someone tries to take you past 50%. Rivals can't see it.</div>`)}
      </div></div>`;
  }

  // ---------------- boardroom tab ----------------
  // How far along your secret mission is: a 0–1 bar, a short chip label, a full line and a state.
  function missionStatus(c) {
    const g = S.game, B = FT.BALANCE, alive = g.companies.filter((o) => !o.bankrupt);
    const rankBy = (f) => {
      const mine = f(c), better = alive.filter((o) => o.id !== c.id && f(o) > mine).length, tied = alive.some((o) => o.id !== c.id && f(o) === mine);
      return { rank: better + 1, n: alive.length, mine, top: Math.max(...alive.map(f), 1), tied, label: "#" + (better + 1) + (tied ? " (tied)" : "") + " of " + alive.length };
    };
    const segSold = (seg) => (o) => (o.history.at(-1)?.segments?.[seg]?.sold) || 0;
    const total = (o) => o.history.filter((h) => h.round >= 1).reduce((a, h) => a + h.sold, 0);
    // Online, rivals' brands are secret, so "strongest brand" can't be judged until the end.
    const done = S.mp && c.mission.id === "brand" ? false : FT.missionDone(g, c);
    const out = (pct, chip, line, extra) => ({ pct: pct == null ? null : Math.max(0, Math.min(1, pct)), chip, line, done, ...(extra || {}) });
    if (c.bankrupt) return out(0, "failed", "Bankrupt companies can't complete missions.", { lost: true });
    switch (c.mission.id) {
      case "stake": {
        const t = byId(c.mission.targetId), own = t ? t.shares.holders.you || 0 : 0;
        if (!t || t.bankrupt) return out(0, "target gone", "Your target went bankrupt, so this one can't be completed any more.", { lost: true });
        return out(own / 30, own + "/30%", `You own ${own}% of ${t.companyName}. You need 30%.`);
      }
      case "stores": return out((c.stores || 0) / 8, (c.stores || 0) + "/8 stores", `You have ${c.stores || 0} stores. You need 8.`);
      case "debtFree": return out(c.debt > 0 ? Math.min(0.9, (c.cash - c.debt) / 2_000_000) : c.cash / 2_000_000, c.debt > 0 ? "debt " + eur(c.debt) : eur(c.cash) + "/€2M", `Cash ${eurX(c.cash)}, debt ${eurX(c.debt)}. You need zero debt and at least €2M cash at the end.`);
      case "quality5": { const need = B.rndThresholds[5]; return out(c.qualityCap >= 5 ? 1 : c.rndProgress / need, "Q" + c.qualityCap + "/5", c.qualityCap >= 5 ? "Quality 5 is unlocked." : `R&D so far ${eurX(c.rndProgress)} of the ${eurX(need)} that unlocks quality 5.`); }
      case "volume": { const r = rankBy(total); return out(r.mine / r.top, r.label, `You're ${r.label} in units sold so far (${unitsX(r.mine)}). You need to be #1 at the end.`); }
      case "premiumLead":
      case "budgetLead": {
        const seg = c.mission.id === "premiumLead" ? "premium" : "budget", r = rankBy(segSold(seg));
        if (g.round <= 1) return out(null, "final round", `Checked on ${seg} sales in the final round (round ${g.config.rounds}).`);
        return out(r.mine / r.top, r.label, `Last round you were ${r.label} in ${seg} sales (${unitsX(r.mine)}). Only the final round counts.`);
      }
      case "brand": {
        if (!S.mp) { const r = rankBy((o) => o.brand); return out(r.mine / r.top, r.label, `Your brand is ${c.brand.toFixed(1)}, ${r.label}. You need the strongest brand at the end.`); }
        return out(null, "brand " + c.brand.toFixed(1), `Your brand is ${c.brand.toFixed(1)}. Rivals' brand strength is secret; Competitor spending research shows how much they put into it.`);
      }
    }
    return out(null, "", "");
  }
  const MISSION_TIPS = {
    stake: () => `Share trading opens in round ${diff().takeoverUnlockRound}. 30% is below control, so no boardroom showdown can stop you.`,
    stores: () => `Stores open in round ${diff().retailUnlockRound} (Retail tab). Eight by the end means opening about two a round.`,
    debtFree: () => "Pay loans back in Finance and keep the cash. Watch emergency loans: one bad round undoes it.",
    quality5: () => "Put money into R&D every round. Quality 4 unlocks first, then 5.",
    volume: () => "Big factory, sharp prices, no missed sales. Every unit counts, from round 1.",
    premiumLead: () => "High quality, strong brand, Luxury sponsor campaign. Only the final round's premium sales count.",
    budgetLead: () => "Lowest price in the market and the Discount promo campaign. Only the final round's budget sales count.",
    brand: () => "Brand building money, Luxury sponsor and TV campaigns. Scandals and exposés hurt it.",
  };
  function missionBar(st) {
    return st.pct == null ? "" : `<div class="mbar ${st.done ? "done" : st.lost ? "lost" : ""}" role="progressbar" aria-valuemin="0" aria-valuemax="100" aria-valuenow="${Math.round(st.pct * 100)}"><i style="width:${Math.round(st.pct * 100)}%"></i></div>`;
  }
  const roundsLeft = () => S.game.config.rounds - S.game.round;
  function missionDeadline() {
    const left = roundsLeft();
    return left <= 0 ? "Final round: it's checked after this one" : left === 1 ? "Checked after next round" : `Checked at the end of round ${S.game.config.rounds} · ${left + 1} rounds to go`;
  }
  const missionPending = () => !!(S.game && !S.game.finished && S.game.round <= 1 && !S.missionSeen && me().mission && !me().bankrupt);
  function briefingModal() {
    const c = me(), mt = missionText(c);
    return `<div class="win briefing"><div class="win-title">Classified<span class="x" aria-hidden="true">×</span></div><div class="win-body">
      <div class="folder"><span class="ds-stamp big">Top secret</span>
        <div class="ds-k">For ${esc(c.id === "you" ? (S.opts && S.opts.name && S.opts.name !== "You" ? S.opts.name : "the CEO") : c.playerName)}'s eyes only · ${esc(c.companyName)}</div>
        <div class="ds-k" style="margin-top:14px">Your secret mission</div>
        <div class="ds-name">${esc(mt.name)}</div>
        <div class="ds-goal">${esc(mt.text)}</div>
        <div class="brief-facts">
          <div><span>Reward</span><b>+${eurX(FT.MISSION_BONUS)}</b><small>on your final score</small></div>
          <div><span>Deadline</span><b>Round ${S.game.config.rounds}</b><small>checked at the very end</small></div>
          <div><span>Rivals</span><b>Have one too</b><small>revealed on the final screen</small></div>
        </div>
        <div class="ds-meta"><b>How:</b> ${esc(MISSION_TIPS[c.mission.id]())}</div>
      </div>
      <div class="hint">It stays pinned in the round strip above your decisions, and the Boardroom tab tracks your progress every round.</div>
      <div style="display:flex;justify-content:flex-end"><button class="btn go" type="button" id="btn-mission-ok" data-autofocus>Understood. Burn after reading</button></div>
    </div></div>`;
  }
  function missionCard(big) {
    const c = me(), mt = missionText(c), st = missionStatus(c), urgent = roundsLeft() <= 1 && !st.done && !st.lost;
    return `<div class="dossier ${big ? "big" : ""} ${urgent ? "urgent" : ""}"><span class="ds-stamp">${st.done ? "On track" : st.lost ? "Failed" : "Top secret"}</span>
      <div class="ds-k">Secret mission · +${eurX(FT.MISSION_BONUS)}</div>
      <div class="ds-name">${esc(mt.name)}</div>
      <div class="ds-goal">${esc(mt.text)}</div>
      ${missionBar(st)}
      <div class="ds-line">${st.done ? "✓ " : ""}${esc(st.line)}</div>
      <div class="ds-meta">${esc(missionDeadline())}${big ? " · " + esc(MISSION_TIPS[c.mission.id]()) : ""}</div></div>`;
  }
  function missionText(c) {
    const m = FT.MISSIONS[c.mission.id], t = c.mission.targetId ? byId(c.mission.targetId) : null;
    return { name: m.name, text: m.description.replace("{target}", t ? t.companyName : "a rival") };
  }
  function tabBoardroom() {
    const c = me(), d = S.draft, g = S.game, W = FT.WILDCARDS, mt = missionText(c);
    const rivals = g.companies.filter((o) => o.id !== "you" && !o.bankrupt);
    const mission = missionCard(true);
    if (c.bankrupt) {
      const opts = rivals.map((o) => `<label class="choice"><input type="radio" name="jtarget" value="${o.id}" ${d.journalistTarget === o.id ? "checked" : ""}><span><b>${esc(o.companyName)}</b><small>${esc(o.playerName)}</small></span></label>`).join("");
      return `<div class="grid2"><div class="card"><h3>You're a journalist now</h3><div class="hint">Your company went bust, but you have a press badge. Each round, pick a company to investigate: it loses ${FT.JOURNALIST.brand} brand and ${FT.JOURNALIST.hype} hype. You score a point every time the company you exposed loses value that round.</div>
        <div class="kv"><div><span>Exposé points</span><b>${c.journalistPoints || 0}</b></div></div></div>
        <div class="ctl"><span class="lbl">Investigate</span><div class="choices">${opts}</div></div></div>`;
    }
    const cards = Object.entries(W).map(([k, w]) => {
      const left = w.maxUses - (c.wildcardsUsed[k] || 0);
      return `<label class="choice"><input type="radio" name="wildcard" value="${k}" ${d.wildcard && d.wildcard.card === k ? "checked" : ""} ${left <= 0 ? "disabled" : ""}><span><b>${w.name}<span class="num">${eur(w.cost)}</span></b><small>${w.description}. ${left} of ${w.maxUses} left.</small></span></label>`;
    }).join("");
    const needsTarget = d.wildcard && W[d.wildcard.card].needsTarget;
    const target = `<div class="ctl" ${needsTarget ? "" : "hidden"} id="wc-target-wrap"><label for="wc-target">Target</label><select id="wc-target">${rivals.map((o) => `<option value="${o.id}" ${d.wildcard && d.wildcard.target === o.id ? "selected" : ""}>${esc(o.companyName)} (${esc(o.playerName)})</option>`).join("")}</select></div>`;
    const sales = salesOpen().map((l) => {
      const dead = byId(l.companyId), cap = Math.round(dead.capacity * FT.BANKRUPTCY_SALE.capacityShare), id = "f-bk-" + dead.id;
      return `<div class="card reqbox" style="box-shadow: inset 0 0 0 2px var(--gold)"><h3>Bankruptcy sale: ${esc(dead.companyName)}</h3>
        <div class="kv"><div${tipAttr(unitsX(cap) + " " + ind().labels.unit + " of capacity, added to yours")}><span>Factory</span><b>+${units(cap)}</b></div><div><span>Stores</span><b>${dead.stores}</b></div><div${tipAttr("You get " + Math.round(FT.BANKRUPTCY_SALE.brandShare * 100) + "% of their brand")}><span>Brand</span><b>+${(dead.brand * FT.BANKRUPTCY_SALE.brandShare).toFixed(1)}</b></div></div>
        <div class="hint">Sealed bids. Highest bid wins and pays its bid; minimum ${eurX(FT.BANKRUPTCY_SALE.minBid)}. If nobody bids, it's scrapped.</div></div>
        ${stepper(id, "Your bid for " + esc(dead.companyName), (d.bankruptBids || {})[dead.id] || 0, 0, Math.max(0, Math.round((c.cash + Math.max(0, creditLimitUI(c) - c.debt)) / 10000) * 10000), 10000, eur)}`;
    }).join("");
    const playable = (list) => list.filter((r) => r <= g.config.rounds);
    const auction = g.auction && g.auction.round === g.round
      ? `<div class="card"><h3>Sealed-bid auction: ${esc(FT.AUCTION.items[g.auction.item].name)}</h3><div class="hint">${esc(FT.AUCTION.items[g.auction.item].description)}. Highest bid wins and pays its bid; everyone else pays nothing. Minimum bid ${eurX(FT.AUCTION.minBid)}.</div></div>${stepper("f-bid", "Your bid", d.auctionBid, 0, Math.max(0, Math.round(c.cash / 10000) * 10000), 10000, eur)}`
      : `<div class="card"><h3>Auctions</h3><div class="hint">Sealed-bid auctions happen in rounds ${playable(FT.AUCTION.rounds).join(", ")}: a celebrity endorsement, a patent, a bankrupt rival's factory or a prime high-street location.${playable(FT.AUCTION.rounds).some((r) => r > g.round) ? " Next one: round " + playable(FT.AUCTION.rounds).find((r) => r > g.round) + "." : ""}</div></div>`;
    const summit = g.summit && g.summit.round === g.round
      ? `<div class="ctl ${d.vote ? "" : "reqbox"}"><span class="lbl">Industry summit: vote on a new rule ${d.vote ? "" : '<span class="neg">(required before you can submit)</span>'}</span><div class="choices">${g.summit.options.map((r, k) => { const reg = FT.SUMMIT.regulations[r], v = k ? "b" : "a"; return `<label class="choice"><input type="radio" name="vote" value="${v}" ${d.vote === v ? "checked" : ""}><span><b>${reg.name}</b><small>${reg.description}</small></span></label>`; }).join("")}</div><div class="hint muted" style="font-size:12.5px">Majority wins, a tie is a coin flip. The rule starts next round.</div></div>`
      : `<div class="card"><h3>Industry summits</h3><div class="hint">In rounds ${playable(FT.SUMMIT.rounds).join(", ")} every company votes between two new rules (taxes, cheap credit, green rules…). The winner applies for ${FT.SUMMIT.duration} rounds. Talk to your rivals before you vote.</div></div>`;
    return `<div class="grid2">
      <div style="display:grid;gap:12px;min-width:0">${sales}${g.summit && g.summit.round === g.round ? summit + mission + auction : mission + auction + summit}<div class="hint">Everyone has a secret mission. They're revealed on the final screen.</div></div>
      <div style="display:grid;gap:12px;min-width:0">
        <div class="ctl"><span class="lbl">Wildcard (one per round)</span><div class="choices"><label class="choice"><input type="radio" name="wildcard" value="" ${d.wildcard ? "" : "checked"}><span><b>No wildcard</b><small>Keep your cards for later.</small></span></label>${cards}</div></div>
        ${target}
      </div></div>`;
  }

  // ---------------- exact numbers on hover ----------------
  const eurX = (n) => (n < 0 ? "−€" : "€") + Math.abs(n).toLocaleString("en", { minimumFractionDigits: Math.abs(n) < 100 ? 2 : 0, maximumFractionDigits: Math.abs(n) < 100 ? 2 : 0 });
  const unitsX = (n) => Math.round(n).toLocaleString("en");
  const tipAttr = (text) => ` data-tip="${esc(text)}"`;
  const tipEl = document.createElement("div");
  tipEl.id = "tip"; tipEl.setAttribute("role", "tooltip"); tipEl.hidden = true;
  document.body.appendChild(tipEl);
  function showTip(text, x, y) {
    tipEl.textContent = text;
    tipEl.hidden = false;
    const r = tipEl.getBoundingClientRect();
    let left = x + 14, top = y + 16;
    if (left + r.width > innerWidth - 8) left = x - r.width - 14;
    if (top + r.height > innerHeight - 8) top = y - r.height - 12;
    tipEl.style.left = Math.max(8, left) + "px";
    tipEl.style.top = Math.max(8, top) + "px";
  }
  function hideTip() { tipEl.hidden = true; }
  document.addEventListener("pointermove", (e) => {
    if (e.target && e.target.id === "city") return;
    const el = e.target.closest && e.target.closest("[data-tip]");
    if (el) showTip(el.dataset.tip, e.clientX, e.clientY); else hideTip();
  });
  document.addEventListener("pointerdown", (e) => {
    const el = e.target.closest && e.target.closest("[data-tip]");
    if (el && e.pointerType !== "mouse") showTip(el.dataset.tip, e.clientX, e.clientY);
  });
  document.addEventListener("focusin", (e) => {
    const el = e.target.closest && e.target.closest("[data-tip]");
    if (el) { const r = el.getBoundingClientRect(); showTip(el.dataset.tip, r.left, r.bottom); } else hideTip();
  });
  document.addEventListener("scroll", hideTip, true);
  let cityRects = [];
  function cityTip(e) {
    const cv = e.currentTarget, rect = cv.getBoundingClientRect();
    const px = (e.clientX - rect.left) * cv.width / rect.width, py = (e.clientY - rect.top) * cv.height / rect.height;
    const hit = cityRects.find((b) => px >= b.x0 - 3 && px <= b.x0 + b.bw + 3 && py >= b.top - 14);
    if (!hit) { hideTip(); return; }
    const c = byId(hit.id), v = CV(S.game), p = SP(S.game), last = c.history.at(-1);
    const lines = [c.companyName + " (" + (c.id === "you" ? "you" : c.playerName) + ")", "Company value: " + eurX(v[c.id]), "Share price: " + eurX(p[c.id])];
    if (last) lines.push("Price last round: " + eurX(last.price), "Sold last round: " + unitsX(last.sold) + " " + ind().labels.unit, "Quality: " + last.quality);
    lines.push("Looks like: " + SEG[hit.zone] + " (compared with the rest of the market)");
    if (c.stores) lines.push("Own stores: " + c.stores);
    if (c.controlledBy) lines.push("Owned by " + byId(c.controlledBy).companyName);
    showTip(lines.join("\n"), e.clientX, e.clientY);
  }

  // ---------------- TV news: pixel scenes ----------------
  const GLYPHS = {
    A: ["010", "101", "111", "101", "101"], B: ["110", "101", "110", "101", "110"], C: ["011", "100", "100", "100", "011"], D: ["110", "101", "101", "101", "110"],

        <div class="card"><h3>Competitors ${S.game.round === 1 ? "in year 0" : "last round"}</h3>${tbl(["Company", "Price", "Qual.", "Sold", "Share", "Stores", "Share price"], rivals)}<div class="hint">Their costs and plans stay secret unless you buy research.</div></div>
        <div class="card"><h3>Buy market research</h3><div class="research">${research}</div><div class="hint">Reports arrive with this round's results and show up below and in your round report.</div></div>
        ${researchResults()}
      </div></div>`;
  }

  function marketHistoryCard() {
    const H = MH(), u = ind().labels.unit;
    if (!H.length) return "";
    const head = ["", ...H.map((m) => (m.round ? "R" + m.round : "Y0"))];
    const rows = Object.keys(SEG).map((k) => `<tr><td><b>${SEG[k]}</b> market</td>${H.map((m) => td(units(m.potential[k]), unitsX(m.potential[k]) + " " + u)).join("")}</tr><tr><td class="muted">${SEG[k]} sold</td>${H.map((m) => td(units(m.sold[k]), unitsX(m.sold[k]) + " " + u + " actually sold")).join("")}</tr>`).join("");
    const rivals = S.game.companies.map((c) => `<tr class="${c.id === "you" ? "me" : ""}">${coCell(c.id)}${H.map((m) => { const h = c.history.find((x) => x.round === m.round); return td(h ? eur(h.price) + " · " + units(h.sold) : "—", h ? (m.round ? "Round " + m.round : "Year 0") + ": price " + eurX(h.price) + ", quality " + h.quality + ", sold " + unitsX(h.sold) + " " + u : ""); }).join("")}</tr>`).join("");
    return `<div class="card"><h3>Market history</h3>${tbl(head, rows)}<div class="hint">Market = potential at average offers. Sold = what all companies together actually sold.</div></div>
      <div class="card"><h3>Rivals per round: price · sold</h3>${tbl(["Company", ...head.slice(1)], rivals)}</div>`;
  }
  function researchResults() {
    const h = me().history.at(-1), r = h && h.research, u = ind().labels.unit;
    if (r && r.boardSeats && !r.competitors && !r.survey && !r.forecast && !r.spy) return boardSeatCard(r.boardSeats, h.round);
    if (!r) return `<div class="card"><h3>Your research</h3><div class="hint">${h ? "You didn't buy research last round." : "Buy research above; the reports arrive after this round."}</div></div>`;
    let out = `<div class="card"><h3>Your research from round ${h.round}</h3>`;
    if (r.competitors) out += `<h3 style="font-size:13px">Competitor spending</h3>` + tbl(["Company", "Made", "Qual.", "Marketing", "Campaign", "R&D", "Brand", "Factory", "Stores", "Store price"], r.competitors.map((x) => `<tr>${coCell(x.companyId)}${td(units(x.produced), unitsX(x.produced) + " " + u + " of " + unitsX(x.capacity) + " capacity")}${td(x.quality)}${td(eur(x.marketingBudget), eurX(x.marketingBudget))}<td class="r">${CAMPAIGNS[x.campaign][0]}</td>${td(eur(x.investRnd), eurX(x.investRnd))}${td(eur(x.investBrand), eurX(x.investBrand))}${td(eur(x.investCapacity), eurX(x.investCapacity))}${td(String(x.stores ?? 0))}${td(x.stores ? eur(x.retailPrice) : "—", x.stores ? eurX(x.retailPrice) : "")}</tr>`).join(""));
    if (r.survey) out += `<h3 style="font-size:13px">Customer survey</h3>` + tbl(["Company", "Brand", "Hype"], r.survey.map((x) => `<tr>${coCell(x.companyId)}${td(x.brand.toFixed(1), "Brand " + x.brand.toFixed(2) + " / 100")}${td(x.hype.toFixed(1), "Hype " + x.hype.toFixed(2) + " / 100")}</tr>`).join(""));
    if (r.forecast) out += `<h3 style="font-size:13px">Insider tip for round ${r.forecast.round}</h3>` + (r.forecast.round > S.game.config.rounds ? `<div class="hint">The game ends before then.</div>` : (r.forecast.news || []).map((n) => `<div class="sumline" style="align-items:center"><span${n.kind === "story" ? ' class="note" style="color:var(--ink)"' : ""}>${esc(n.headline)}</span><span class="fxrow" style="justify-content:flex-end">${effectChips(n.effect).map((x) => `<span class="fx ${x.good ? "up" : "down"}">${x.good ? "▲" : "▼"} ${esc(x.label)}</span>`).join("")}${n.duration > 1 ? `<span class="fx dur">${n.duration} rounds</span>` : ""}</span></div>`).join("") + ((r.forecast.news || []).some((n) => n.kind === "story") ? "" : `<div class="hint">No big story coming, just the market report.</div>`));
    return out + `</div>`;
  }

  // ---------------- reports tab ----------------
  const REPORT_TABS = [["income", "Income statement"], ["cash", "Cash flow"], ["balance", "Balance"], ["production", "Production"], ["groups", "Sales by group"], ["costs", "Cost sheet"]];
  function roundTable(rows, hideZero) {
    const H = me().history;
    if (!H.length) return `<div class="hint">Fills in after round 1.</div>`;
    // Lines you never used (all zero) just add noise.
    if (hideZero) rows = rows.filter(([, f, , bold, keep]) => bold || keep || H.some((h) => Math.abs(f(h)) > 0.004));
    return `<div class="tbl"><table><thead><tr><th></th>${H.map((h) => `<th class="r">${h.round ? "R" + h.round : "Y0"}</th>`).join("")}</tr></thead><tbody>${rows.map(([label, f, kind, bold]) => `<tr${bold ? ' class="total"' : ""}><td>${label}</td>${H.map((h) => {
      const x = f(h);
      const short = kind === "units" ? units(x) : kind === "pct" ? Math.round(x * 100) + "%" : kind === "plain" ? String(x) : eur(x);
      const exact = kind === "units" ? unitsX(x) : kind === "pct" ? (x * 100).toFixed(2) + "%" : kind === "plain" ? String(x) : eurX(x);
      return `<td class="r num ${bold && kind !== "units" ? (x >= 0 ? "pos" : "neg") : x < 0 ? "neg" : ""}"${tipAttr(label + ", " + (h.round ? "round " + h.round : "year 0") + ": " + exact)}>${short}</td>`;
    }).join("")}</tr>`).join("")}</tbody></table></div>`;
  }

  function tabReports() {
    const c = me(), i = ind(), B = FT.BALANCE, rt = S.reportTab || "income";
    const tabs = `<div class="subtabs" role="group" aria-label="Report">${REPORT_TABS.map(([k, n]) => `<button type="button" data-report="${k}" aria-pressed="${rt === k}">${n}</button>`).join("")}</div>`;
    let body = "";
    if (rt === "income") body = `<div class="card"><h3>Income statement</h3>${roundTable([
      ["Sold to shops", (h) => h.wholesaleSold, "units"], ["Shop price", (h) => h.price], ["Sold in own stores", (h) => h.retailSold, "units"], ["Store price", (h) => (h.retailSold ? h.retailPrice : 0)],
      ["Revenue from shops", (h) => h.revenue - h.retailRevenue], ["Revenue from own stores", (h) => h.retailRevenue], ["Total revenue", (h) => h.revenue],
      ["Cost of goods sold", (h) => -(h.revenue - h.profit - h.holdingCost - h.fixedCost - h.marketingCost - h.rndCost - h.brandCost - h.researchCost - h.storeUpkeep - h.interest - (h.wildcardCost || 0) - (h.legalCost || 0) - (h.staffCost || 0) - (h.auctionPaid || 0))],
      ["Stock holding", (h) => -h.holdingCost], ["Factory upkeep", (h) => -h.fixedCost], ...(S.game.config.difficulty === "tycoon" ? [["Wages, hiring, layoffs", (h) => -(h.staffCost || 0)]] : []), ["Marketing", (h) => -h.marketingCost], ["R&D", (h) => -h.rndCost],
      ["Brand building", (h) => -h.brandCost], ["Market research", (h) => -h.researchCost], ["Store rent and staff", (h) => -h.storeUpkeep], ["Wildcards", (h) => -(h.wildcardCost || 0)], ["Lawsuits", (h) => -(h.legalCost || 0)], ["Auctions won", (h) => -(h.auctionPaid || 0)], ["Interest", (h) => -h.interest], ["Profit", (h) => h.profit, "eur", true],
    ], true)}<div class="hint">Cost of goods sold = production cost of the ${esc(i.labels.unit)} you actually sold.</div></div>`;
    if (rt === "cash") body = `<div class="card"><h3>Cash flow</h3>${roundTable([
      ["Cash at start", (h) => h.cashStart, "eur", false, true], ["Loans (net)", (h) => h.loanChange], ["Sales revenue", (h) => h.revenue], ["Production", (h) => -h.productionCost],
      ["Stock holding", (h) => -h.holdingCost], ["Factory upkeep", (h) => -h.fixedCost], ["Marketing", (h) => -h.marketingCost], ["R&D", (h) => -h.rndCost],
      ["Brand building", (h) => -h.brandCost], ["Market research", (h) => -h.researchCost], ["Store rent and staff", (h) => -h.storeUpkeep], ...(S.game.config.difficulty === "tycoon" ? [["Wages, hiring, layoffs", (h) => -(h.staffCost || 0)]] : []), ["Wildcards", (h) => -(h.wildcardCost || 0)], ["Lawsuits", (h) => -(h.legalCost || 0)], ["Auctions won", (h) => -(h.auctionPaid || 0)], ["Interest", (h) => -h.interest], ["Factory expansion", (h) => -h.capacityInvest], ["Store openings", (h) => -h.storeOpenCost],
      ["Shares in rivals", (h) => -h.sharePurchases], ["Shares sold", (h) => h.shareSales || 0], ["Showdown stakes", (h) => -(h.showdownPaid || 0)], ["Share buyback", (h) => -h.buybackCost], ["Dividends received", (h) => h.dividendsReceived], ["Dividends paid", (h) => -h.dividendsPaid],
      ["Emergency loan", (h) => h.emergencyLoan], ["Emergency loan fee", (h) => -h.emergencyFee], ["Cash at end", (h) => h.cashEnd, "eur", true],
    ], true)}<div class="hint">Production is paid when you make it, not when you sell it; that's why cash and profit differ.</div></div>`;
    if (rt === "production") body = `<div class="card"><h3>Production report</h3>${roundTable([
      ["Capacity", (h) => h.capacity, "units"], ["Produced", (h) => h.produced, "units"], ["Utilisation", (h) => (h.capacity ? h.produced / h.capacity : 0), "pct"],
      ["Stock at start", (h) => h.inventoryStart, "units"], ["Sold to shops", (h) => h.wholesaleSold, "units"], ["Sold in own stores", (h) => h.retailSold, "units"], ["Missed sales", (h) => h.unmetDemand, "units"], ["Stock at end", (h) => h.inventoryEnd, "units"],
      ["Production cost", (h) => h.productionCost],
    ])}</div>`;
    if (rt === "balance") {
      const v = CV(S.game).you, H = c.history;
      const last2 = H.slice(-2).map((h) => h.profit), avg = last2.length ? last2.reduce((a, b) => a + b, 0) / last2.length : 0;
      const inv = c.inventory * c.inventoryUnitCost * B.inventoryValueRate, factory = c.capacity * B.capacityBookValue * i.baseUnitCost;
      const stores = (c.stores || 0) * FT.RETAIL.bookValue;
      const brand = c.brand * B.brandValuePerPoint, earn = Math.max(0, avg) * B.earningsMultiple, stakes = v - (c.cash - c.debt + inv + factory + stores + brand + earn);
      const lines = [
        ["Cash", c.cash, "Money in the bank"], ["Stock", inv, unitsX(c.inventory) + " " + i.labels.unit + " at " + Math.round(B.inventoryValueRate * 100) + "% of cost"],
        ["Factory", factory, unitsX(c.capacity) + " capacity at " + eurX(B.capacityBookValue * i.baseUnitCost) + " each"], ["Own stores", stores, (c.stores || 0) + " stores at " + eurX(FT.RETAIL.bookValue) + " each"], ["Brand", brand, "Brand " + c.brand.toFixed(1) + " × " + eurX(B.brandValuePerPoint)],
        ["Earnings power", earn, "Average profit of the last two rounds × " + B.earningsMultiple], ["Shares in rivals", stakes, "Your stakes at their current value"], ["Debt", -c.debt, "Loans outstanding"],
      ].map(([k, x, why]) => `<div class="sumline"${tipAttr(k + ": " + eurX(x) + "\n" + why)}><span class="muted">${k}</span><span class="num ${x < 0 ? "neg" : ""}">${eur(x)}</span></div>`).join("");
      body = `<div class="card"><h3>What your company is worth now</h3>${lines}<div class="sumline total"${tipAttr("Company value: " + eurX(v))}><span>Company value (your score)</span><span class="num">${eur(v)}</span></div><div class="hint">Owned companies count at 75% at the end.</div></div>`;
    }
    if (rt === "groups") body = `<div class="card"><h3>Sales by customer group</h3>${roundTable(Object.keys(SEG).flatMap((k) => [
      [SEG[k] + ": sold", (h) => h.segments[k].sold, "units"], [SEG[k] + ": your share", (h) => h.segments[k].share, "pct"],
    ]))}<div class="hint">Share = your part of everything sold to that group in that round.</div></div>`;
    if (rt === "costs") {
      const fx = fxNow();
      const rows = [1, 2, 3, 4, 5].map((q) => { const cost = FT.unitCost(i, q, fx.cost, c.trait, S.game.config.difficulty === "tycoon"); return `<tr class="${q === S.draft.quality ? "me" : ""}${q > c.qualityCap ? " locked-row" : ""}"><td>Quality ${q}${q > c.qualityCap ? " (locked)" : ""}</td>${td(eurX(cost), eurX(cost) + " per " + i.labels.product)}</tr>`; }).join("");
      body = `<div class="grid2"><div class="card"><h3>Production cost per ${esc(i.labels.product)}</h3>${tbl(["", "This round"], rows)}<div class="hint">Includes this round's news${c.trait === "pennyPincher" ? " and your Penny-Pincher discount" : ""}.</div></div>${costRules()}</div>`;
    }
    return `<div style="display:grid;gap:14px;min-width:0">${tabs}${body}</div>`;
  }

  // ---------------- news tab ----------------
  function tabNews() {
    S.newsSeen = S.chat.length;
    const items = S.game.finished ? [] : S.game.news.filter((n) => n.event.kind !== "economy").map(newsItem);
    const idx = Math.min(S.newsIdx || 0, Math.max(0, items.length - 1));
    const tv = items.length ? tvHtml(items[idx], "n" + idx, idx, items.length, true) + (items.length > 1 ? `<div style="display:flex;gap:8px;justify-content:center"><button class="btn" type="button" data-news-step="-1" ${idx === 0 ? "disabled" : ""}>Previous</button><button class="btn" type="button" data-news-step="1" ${idx === items.length - 1 ? "disabled" : ""}>Next</button></div>` : "")
      : `<div class="hint">No news is moving the market right now. Enjoy the quiet.</div>`;
    const feedItems = S.chat.slice().reverse().map((m) => {
      if (m.kind === "chat") {
        const c = byId(m.who);
        return `<div class="msg"><canvas data-avatar="${m.who}" width="12" height="12" aria-hidden="true"></canvas><div><span class="rnd">R${m.round}</span><b class="who" style="color:${colVar(m.who)}">${esc(c.playerName)}:</b>${esc(m.text)}</div></div>`;
      }
      return `<div class="msg"><span class="icon ${m.kind === "news" ? "news" : ""}">${m.kind === "news" ? "NEWS" : "FT"}</span><div><span class="rnd">R${m.round}</span>${esc(m.text)}</div></div>`;
    }).join("");
    return `<div class="grid2">
      <div style="display:grid;gap:10px;min-width:0">${marketReport()}<div class="card"><h3>On air this round</h3>${tv}</div></div>
      <div class="card"><h3>Live feed</h3><div class="feed" style="max-height:520px">${feedItems}</div></div></div>`;
  }

  // TOPSIM-style market report: a few small indicators every round.
  function marketReport() {
    if (S.game.finished) return "";
    const eco = S.game.news.filter((n) => n.event.kind === "economy");
    const chips = (e) => effectChips(e).map((x) => `<span class="fx ${x.good ? "up" : "down"}">${x.good ? "▲" : "▼"} ${esc(x.label)}</span>`).join("");
    return `<div class="card"><h3>Market report for round ${S.game.round}</h3>${eco.length ? eco.map((n) => `<div class="sumline" style="align-items:center"><span>${esc(n.event.headline)}</span><span class="fxrow" style="justify-content:flex-end">${chips(n.event.effect)}</span></div>`).join("") : `<div class="hint">No market report this round.</div>`}
      <div class="hint">Small shifts that last one round. They're already counted in the Market outlook and Planning data.</div></div>`;
  }

  function feed() {
    const items = S.chat.slice(-40).reverse().map((m) => {
      if (m.kind === "chat") {
        const c = byId(m.who);
        return `<div class="msg"><canvas data-avatar="${m.who}" width="12" height="12" aria-hidden="true"></canvas><div><span class="rnd">R${m.round}</span><b class="who" style="color:${colVar(m.who)}">${esc(c.playerName)}:</b>${esc(m.text)}</div></div>`;
      }
      return `<div class="msg"><span class="icon ${m.kind === "news" ? "news" : ""}">${m.kind === "news" ? "NEWS" : "FT"}</span><div><span class="rnd">R${m.round}</span>${esc(m.text)}</div></div>`;
    }).join("");
    const active = S.game.news.map((n) => `<b>${esc(n.event.headline)}</b> <span class="muted">(${esc(effectText(n.event.effect))})</span>`).join("<br>");
    return `<section class="win" aria-label="Live feed"><div class="win-title">Live feed<span class="x" aria-hidden="true">×</span></div><div class="win-body">
      ${active && !S.game.finished ? `<div class="note" style="color:var(--ink)">This round: ${active}</div>` : ""}
      <div class="feed" aria-live="polite">${items}</div></div></section>`;
  }

  // ---------------- modals ----------------
  function modalSound() {
    if (!S.game) return;
    const key = S.modal + ":" + S.game.round + ":" + (S.tvIndex || 0);
    if (S.lastSound === key) return;
    S.lastSound = key;
    if (S.modal === "results") setTimeout(() => sfx(me().history.at(-1).profit >= 0 ? "profit" : "loss"), 350);
    if (S.modal === "tv") sfx(S.tvQueue[S.tvIndex] && ["deal", "showdown"].includes(S.tvQueue[S.tvIndex].scene) ? "takeover" : S.tvQueue[S.tvIndex] && S.tvQueue[S.tvIndex].scene === "auction" ? "profit" : "news");
    if (S.modal === "final") setTimeout(() => sfx(FT.standings(S.game)[0].companyId === "you" ? "win" : "lose"), 350);
  }
  function renderModal() {
    if (!S.modal) { modal.innerHTML = ""; return; }
    modalSound();
    let inner = "";
    if (S.modal === "results") inner = resultsModal();
    if (S.modal === "final") inner = finalModal();
    if (S.modal === "setup") inner = setupModal();
    if (S.modal === "tv") inner = tvModal();
    if (S.modal === "vote") inner = voteModal();
    if (S.modal === "sheet") inner = sheetModal();
    if (S.modal === "help") inner = helpModal();
    if (S.modal === "show") inner = showModal();
    if (S.modal === "online") inner = onlineModal();
    if (S.modal === "mission") inner = briefingModal();
    if (S.modal === "wait") inner = waitModal();
    if (S.modal === "board") inner = boardModal();
    if (S.modal === "soon") inner = soonModal();
    if (S.modal === "options") inner = optionsModal();
    modal.innerHTML = `<div class="overlay" role="dialog" aria-modal="true">${inner}</div>`;
    modal.querySelectorAll("canvas[data-avatar]").forEach((cv) => drawAvatar(cv, cv.dataset.avatar, colRaw(cv.dataset.avatar)));
    modal.querySelectorAll("canvas[data-trait]").forEach((cv) => drawTrait(cv, cv.dataset.trait));
    countUp(modal);
    if (S.modal === "show") runShow();
    if (S.modal === "board") runBoard();
    if (S.modal === "wait") mpTick();
    const focus = modal.querySelector("[data-autofocus]");
    if (focus) focus.focus();
    runTv();
  }

  function voteModal() {
    const g = S.game, opts = g.summit.options.map((r, k) => {
      const reg = FT.SUMMIT.regulations[r], v = k ? "b" : "a";
      const chips = effectChips(reg.effect).map((c) => `<span class="fx ${c.good ? "up" : "down"}">${c.good ? "▲" : "▼"} ${esc(c.label)}</span>`).join("");
      return `<div class="vote-opt ${S.draft.vote === v ? "picked" : ""}"><h3>${esc(reg.name)}</h3><div class="hint" style="font-weight:700">${esc(reg.description)}</div><div class="fxrow">${chips}</div><button class="btn go" type="button" data-vote="${v}" ${k === 0 ? "data-autofocus" : ""}>Vote for this</button></div>`;
    }).join("");
    return `<div class="win"><div class="win-title">Industry summit: your vote is required<span class="x" aria-hidden="true">×</span></div><div class="win-body">

      <div class="vote-opts">${opts}</div>
      <div style="display:flex;gap:10px;justify-content:space-between;align-items:center;flex-wrap:wrap"><span class="hint">You can change your vote in the Boardroom until you submit.</span><button class="btn" type="button" id="btn-close">Look at the numbers first</button></div>
    </div></div>`;
  }

  // Like TOPSIM's decision form: everything you're about to submit, in one place.
  function sheetModal() {
    const c = me(), d = S.draft, g = S.game, i = ind(), D = diff();
    const sec = (tab, title, rows) => `<div class="card"><div class="sheet-h"><h3>${title}</h3><button class="btn small" type="button" data-edit="${tab}">Change</button></div>${rows.map(([k, v]) => `<div class="sumline"><span class="muted">${k}</span><span class="num" style="text-align:right">${v}</span></div>`).join("")}</div>`;
    const out = [];
    if (c.bankrupt) {
      out.push(sec("boardroom", "Journalist", [["Investigating", d.journalistTarget ? esc(byId(d.journalistTarget).companyName) : "nobody"]]));
    } else {
      out.push(sec("production", "Production", [["Price per " + i.labels.product, eurX(d.price)], ["Production", unitsX(Math.min(d.production, c.capacity)) + " " + i.labels.unit], ["Quality", d.quality], ["Build more capacity", eurX(d.investCapacity)], ...(g.config.difficulty === "tycoon" ? [["Teams hired / laid off", (d.hire > 0 ? "+" : "") + d.hire]] : [])]));
      out.push(sec("marketing", "Marketing and R&D", [["Campaign", CAMPAIGNS[d.campaign][0]], ["Marketing budget", eurX(d.marketingBudget)], ["Brand building", eurX(d.investBrand)], ["R&D", eurX(d.investRnd)]]));
      if (g.round >= D.retailUnlockRound) out.push(sec("retail", "Own stores", [["Open", d.storesOpen], ["Close", d.storesClose], ["Store price", eurX(d.retailPrice)]]));
      out.push(sec("finance", "Finance and research", [["Loan", (d.loanChange >= 0 ? "Borrow " : "Repay ") + eurX(Math.abs(d.loanChange))], ["Market research", d.research.length ? d.research.map((r) => FT.RESEARCH[r].name).join(", ") : "none"]]));
      if (g.round >= D.takeoverUnlockRound || Object.keys(d.sellShares || {}).length) out.push(sec("takeovers", "Shares", [["Buy", (Object.entries(d.buyShares).filter(([, n]) => n).map(([k, n]) => n + " of " + esc(byId(k).companyName)).join(", ") || "nothing") + (Object.keys(d.buyShares).length ? " (about " + eur(planShareCost()) + ")" : "")], ["Sell", Object.entries(d.sellShares || {}).filter(([, n]) => n).map(([k, n]) => n + " of " + esc(byId(k).companyName)).join(", ") || "nothing"], ["Buy back own", d.buyback], ["Attack stake", eurX(d.takeoverStake)], ["Defense fund", eurX(d.defenseStake)]]));

  // ----- End-of-game titles: one per category, for fun.
  function gameTitles() {
    const cs = S.game.companies, H = (c) => c.history.filter((h) => h.round >= 1);
    const avg = (c, f) => { const h = H(c); return h.length ? h.reduce((a, x) => a + f(x), 0) / h.length : 0; };
    const sum = (c, f) => H(c).reduce((a, x) => a + f(x), 0);
    const pick = (f, best = "max", ok = () => true) => { const list = cs.filter((c) => !c.bankrupt && ok(c)); if (!list.length) return null; return list.sort((a, b) => (best === "max" ? f(b) - f(a) : f(a) - f(b)))[0].id; };
    const out = [];
    const add = (id, label, why) => { if (id) out.push({ id, label, why }); };
    add(pick((c) => avg(c, (h) => h.price), "min"), "Price-war criminal", "Lowest average price");
    add(pick((c) => avg(c, (h) => h.price * h.quality)), "Luxury lord", "Highest price × quality");
    add(pick((c) => cs.filter((o) => o.controlledBy === c.id).length, "max", (c) => cs.some((o) => o.controlledBy === c.id)), "Hostile hugger", "Most companies taken over");
    add(pick((c) => Math.max(...H(c).map((h) => h.sold), 0)), "Volume machine", "Most units sold in one round");
    add(pick((c) => sum(c, (h) => h.marketingCost), "min"), "Penny pincher", "Least spent on marketing");
    add(pick((c) => sum(c, (h) => h.marketingCost)), "Mad Men", "Most spent on marketing");
    add(pick((c) => c.stores || 0, "max", (c) => (c.stores || 0) > 0), "High-street hero", "Most own stores");
    add(pick((c) => { const v = S.hist[c.id]; const lo = Math.min(...v); return v.at(-1) - lo; }), "Comeback kid", "Biggest climb from its lowest point");
    const j = cs.filter((c) => c.bankrupt && (c.journalistPoints || 0) > 0).sort((a, b) => b.journalistPoints - a.journalistPoints)[0];
    if (j) add(j.id, "Pulitzer pending", "Best journalist after going bust");
    return out;
  }

  // ---------------- canvases ----------------
  function paintCanvases() {
    document.querySelectorAll("canvas[data-avatar]").forEach((cv) => drawAvatar(cv, cv.dataset.avatar, colRaw(cv.dataset.avatar)));
    document.querySelectorAll("canvas[data-icon]").forEach((cv) => drawIcon(cv, cv.dataset.icon));
    document.querySelectorAll("canvas[data-trait]").forEach((cv) => drawTrait(cv, cv.dataset.trait));
  }

  let rafId = 0;
  // The skyline is alive: buildings grow after a round, cars drive by, lights blink.
  let cityFrame = 0, lastCityDraw = 0;
  function animateSkyline() {
    cancelAnimationFrame(rafId);
    const reduce = reduceMotion();
    if (reduce) { drawCity(1); S.anim = null; return; }
    drawCity(S.anim ? 0 : 1);
    const tick = (now) => {
      if (!$("#city") || S.screen === "title") return;
      if (S.anim) {
        const t = Math.min(1, (now - S.anim.start) / 1400);
        drawCity(1 - Math.pow(1 - t, 3));
        if (t >= 1) S.anim = null;
      } else if (now - lastCityDraw > 90) { lastCityDraw = now; cityFrame++; drawCity(1); }
      rafId = requestAnimationFrame(tick);
    };
    rafId = requestAnimationFrame(tick);
  }

  function shade(hex, amt) {
    const m = hex.replace("#", "").match(/.{2}/g);
    if (!m) return hex;
    const [r, g, b] = m.map((x) => parseInt(x, 16));
    const f = (v) => Math.max(0, Math.min(255, Math.round(amt >= 0 ? v + (255 - v) * amt : v * (1 + amt))));
    return "#" + [f(r), f(g), f(b)].map((v) => v.toString(16).padStart(2, "0")).join("");
  }

  function drawCity(t) {
    const cv = $("#city");
    const g = cv && cv.getContext && cv.getContext("2d");
    if (!g) return;
    const W = cv.width, H = cv.height, gy = H - 14, day = isDay();
    const LIT = day ? "#d8ecff" : "#ffd166", DOOR = day ? "#e8d3a8" : "#ffcf6a", DOOR2 = day ? "#f6ead0" : "#ffe8a8";
    // Sky, stars, moon with a soft glow.
    const sky = g.createLinearGradient(0, 0, 0, gy);
    if (day) { sky.addColorStop(0, "#5fb4ff"); sky.addColorStop(0.65, "#a9dcff"); sky.addColorStop(1, "#e3f4ff"); }
    else { sky.addColorStop(0, "#070c24"); sky.addColorStop(0.6, "#121c48"); sky.addColorStop(1, "#24336e"); }
    g.fillStyle = sky; g.fillRect(0, 0, W, H);
    const sr = seeded("stars");
    for (let k = 0; k < (day ? 0 : 70); k++) { g.fillStyle = sr() > 0.8 ? "#ffffff" : "rgba(255,255,255,0.45)"; g.fillRect(Math.floor(sr() * W), Math.floor(sr() * (gy - 50)), 1, 1); }
    const mx = W - 34, my = 22;
    if (day) { sun(g, W - 14, 14, 0); clouds(g, W, 40, Math.floor(performance.now() / 120), "cclouds"); }
    else for (let rad = 16; rad > 9; rad -= 2) { g.fillStyle = `rgba(255,250,220,${0.035 * (17 - rad) / 2})`; g.beginPath(); g.arc(mx, my, rad, 0, Math.PI * 2); g.fill(); }
    if (!day) {
      g.fillStyle = "#f6f0d2"; g.beginPath(); g.arc(mx, my, 8, 0, Math.PI * 2); g.fill();
      g.fillStyle = "#ddd5ae"; g.fillRect(mx - 3, my - 2, 2, 2); g.fillRect(mx + 2, my + 2, 3, 2);
    }
    // Two layers of background city with scattered lit windows.
    const winColors = day ? ["#e8f4ff", "#cfe6ff", "#f2f8ff", "#dbeaff"] : ["#ffd166", "#7ad7ff", "#ff7ab8", "#b9a2ff"];
    const layer = (seed, color, minH, maxH, density, yOff) => {
      const r = seeded(seed);
      for (let x = -4; x < W; ) {
        const w = 8 + Math.floor(r() * 14), h = minH + Math.floor(r() * (maxH - minH));
        g.fillStyle = color; g.fillRect(x, gy - h - yOff, w, h + yOff);
        if (r() > 0.75) { g.fillRect(x + Math.floor(w / 2), gy - h - yOff - 6, 1, 6); }
        for (let wy = gy - h - yOff + 3; wy < gy - 3; wy += 4) for (let wx = x + 2; wx < x + w - 2; wx += 3) if (r() < density) { g.fillStyle = winColors[Math.floor(r() * winColors.length)]; g.globalAlpha = 0.55; g.fillRect(wx, wy, 1, 2); g.globalAlpha = 1; }
        x += w + 1 + Math.floor(r() * 3);
      }
    };
    layer("far", day ? "#9cb3d8" : "#16214f", 28, 74, 0.08, 6);
    layer("near", day ? "#7d96c2" : "#0d1538", 16, 46, 0.14, 0);
    // Street: sidewalk, road with dashed line, lamps.
    g.fillStyle = day ? "#c9c1b0" : "#2b335c"; g.fillRect(0, gy, W, 3);
    g.fillStyle = day ? "#4a5063" : "#0a0e22"; g.fillRect(0, gy + 3, W, H - gy - 3);
    g.fillStyle = "#ffc531"; for (let x = 4; x < W; x += 14) g.fillRect(x, gy + 8, 7, 1);
    // Traffic.
    const carCols = ["#e8e8e8", "#d94a4a", "#f0b429", "#3d8bff", "#4fd987"];
    for (let k = 0; k < 4; k++) {
      const dir = k % 2 ? 1 : -1, sp = 0.9 + (k % 3) * 0.5, span = W + 30;
      const pos = (((k * 131 + cityFrame * sp) % span) + span) % span;
      const x = Math.round(dir > 0 ? pos - 15 : W + 15 - pos - 10), y = gy + (dir > 0 ? 10 : 4);
      g.fillStyle = carCols[k % carCols.length]; g.fillRect(x, y, 10, 3); g.fillRect(x + 2, y - 2, 5, 2);
      g.fillStyle = "#9fd3ff"; g.fillRect(x + 3, y - 1, 3, 1);
      g.fillStyle = "#fff3b0"; g.fillRect(dir > 0 ? x + 9 : x, y + 1, 1, 1);
    }

    const comps = S.game.companies, n = comps.length;
    const vNow = CV(S.game);
    const from = S.anim ? S.anim.from : vNow, to = S.anim ? S.anim.to : vNow;
    const val = (id) => from[id] + (to[id] - from[id]) * t;
    const maxV = Math.max(...comps.map((c) => Math.max(0, from[c.id], to[c.id])), 1);
    const slot = W / n;
    cityRects = [];
    comps.forEach((c, i) => {
      const color = colRaw(c.id), light = shade(color, 0.45), dark = shade(color, -0.45), darker = shade(color, -0.7);
      const cx = Math.round(slot * (i + 0.5)), bw = Math.min(62, Math.floor(slot) - 18), x0 = cx - Math.floor(bw / 2);
      const h = c.bankrupt ? 22 : Math.max(26, Math.round(28 + 100 * Math.max(0, val(c.id)) / maxV));
      let top = gy - h;
      const zone = positionOf(c);
      const r = seeded("win" + c.id);
      cityRects.push({ id: c.id, x0, bw, top, zone });
      if (c.bankrupt) {
        g.fillStyle = "#4d3f30"; g.fillRect(x0, top, bw, h);
        g.fillStyle = "#7b6146"; for (let y = top + 3; y < gy - 2; y += 5) g.fillRect(x0 + 2, y, bw - 4, 3);
        g.fillStyle = "#3a2f24"; g.fillRect(x0 + 4, top + 4, 2, h - 6); g.fillRect(x0 + bw - 6, top + 4, 2, h - 6);
      } else if (zone === "premium") {
        // Glass tower in a colored frame, with a setback crown and spire.
        const crown = 10;
        g.fillStyle = dark; g.fillRect(x0, top + crown, bw, h - crown);
        const glass = g.createLinearGradient(x0, 0, x0 + bw, 0);
        glass.addColorStop(0, "#9fb3d9"); glass.addColorStop(0.5, "#5a6f9e"); glass.addColorStop(1, "#2b3762");
        g.fillStyle = glass; g.fillRect(x0 + 3, top + crown + 2, bw - 6, h - crown - 4);
        g.fillStyle = color; for (let x = x0 + 3; x < x0 + bw - 3; x += 7) g.fillRect(x, top + crown + 2, 1, h - crown - 4);
        g.fillStyle = "rgba(255,255,255,0.18)"; for (let y = top + crown + 6; y < gy - 2; y += 6) g.fillRect(x0 + 3, y, bw - 6, 1);
        g.fillStyle = "rgba(255,255,255,0.35)"; g.fillRect(x0 + 5, top + crown + 4, 2, h - crown - 10);
        g.fillStyle = color; g.fillRect(x0 + 6, top + 3, bw - 12, crown);
        g.fillStyle = light; g.fillRect(x0 + 6, top + 3, bw - 12, 2);
        g.fillStyle = "#9fb3d9"; for (let x = x0 + 9; x < x0 + bw - 9; x += 5) g.fillRect(x, top + 7, 3, 4);
        g.fillStyle = light; g.fillRect(cx, top - 10, 1, 13); g.fillStyle = cityFrame % 12 < 6 ? "#ff4d4d" : "#6a1f1f"; g.fillRect(cx, top - 11, 1, 1);
      } else if (zone === "hype") {
        // Dark block covered in neon, with a glowing billboard.
        g.fillStyle = "#1b1530"; g.fillRect(x0, top, bw, h);
        g.fillStyle = color; g.fillRect(x0, top, 2, h); g.fillRect(x0 + bw - 2, top, 2, h);
        for (let y = top + 16; y < gy - 4; y += 5) for (let x = x0 + 4; x < x0 + bw - 4; x += 4) { g.fillStyle = r() > 0.35 ? light : "#2a2148"; g.fillRect(x, y, 2, 3); }
        g.fillStyle = darker; g.fillRect(x0 - 3, top + 3, bw + 6, 10);
        g.fillStyle = color; g.fillRect(x0 - 3, top + 3, bw + 6, 1); g.fillRect(x0 - 3, top + 12, bw + 6, 1);
        g.fillStyle = "#ffffff"; for (let x = x0; x < x0 + bw; x += 4) g.fillRect(x, top + 7, 2, 2);
        g.fillStyle = light; g.fillRect(x0 + 6, top - 8, 1, 8); g.fillRect(x0 + bw - 7, top - 5, 1, 5);
      } else if (zone === "budget") {
        // Big grey block with crenellations, a banner and a lit gate.
        g.fillStyle = "#8790a8"; g.fillRect(x0, top + 4, bw, h - 4);
        g.fillStyle = "#a7afc4"; g.fillRect(x0, top + 4, 3, h - 4);
        g.fillStyle = "#636b85"; g.fillRect(x0 + bw - 4, top + 4, 4, h - 4);
        g.fillStyle = "#8790a8"; for (let x = x0; x < x0 + bw; x += 8) g.fillRect(x, top, 5, 5);
        g.fillStyle = "#636b85"; g.fillRect(x0, top + 9, bw, 2);
        for (let y = top + 14; y < gy - 16; y += 7) for (let x = x0 + 5; x < x0 + bw - 6; x += 7) { g.fillStyle = r() > 0.4 ? LIT : "#3a4160"; g.fillRect(x, y, 3, 4); }
        g.fillStyle = color; g.fillRect(cx - 7, top + 13, 14, 16); g.fillStyle = dark; g.fillRect(cx - 7, top + 27, 14, 2);
        g.fillStyle = "#3a4160"; g.fillRect(cx - 7, gy - 14, 14, 14);
        g.fillStyle = DOOR; g.fillRect(cx - 5, gy - 12, 10, 12); g.fillStyle = DOOR2; g.fillRect(cx - 3, gy - 10, 6, 10);
      } else {
        // Mainstream office: colored grid of lit windows, rooftop units.
        g.fillStyle = dark; g.fillRect(x0, top, bw, h);
        g.fillStyle = color; g.fillRect(x0 + 2, top + 2, bw - 4, h - 2);
        g.fillStyle = darker; for (let x = x0 + 2; x < x0 + bw - 2; x += 6) g.fillRect(x, top + 2, 1, h - 2);
        for (let y = top + 6; y < gy - 4; y += 6) for (let x = x0 + 4; x < x0 + bw - 4; x += 6) { g.fillStyle = r() > 0.3 ? (r() > 0.5 ? LIT : light) : darker; g.fillRect(x, y, 3, 4); }
        g.fillStyle = darker; g.fillRect(x0 - 1, top - 2, bw + 2, 3);
        g.fillStyle = "#56607f"; g.fillRect(x0 + 5, top - 6, 7, 4); g.fillRect(x0 + bw - 13, top - 5, 8, 3);
      }
      if (!c.bankrupt && zone !== "budget") { g.fillStyle = DOOR; g.fillRect(cx - 4, gy - 9, 8, 9); g.fillStyle = DOOR2; g.fillRect(cx - 2, gy - 7, 4, 7); }
      // Own stores: little shopfronts on the pavement in the company's colour.
      for (let k = 0; k < Math.min(c.stores || 0, 4); k++) {
        const sx = x0 - 2 + k * 9, sy = gy - 7;
        g.fillStyle = "#e9e1d0"; g.fillRect(sx, sy, 8, 7);
        g.fillStyle = color; g.fillRect(sx - 1, sy - 2, 10, 2); g.fillStyle = "#fff"; g.fillRect(sx + 1, sy - 2, 2, 2); g.fillRect(sx + 5, sy - 2, 2, 2);
        g.fillStyle = LIT; g.fillRect(sx + 1, sy + 2, 3, 3); g.fillStyle = "#5a3417"; g.fillRect(sx + 5, sy + 2, 2, 5);
      }
      if ((c.stores || 0) > 4) { g.fillStyle = "#fff"; g.fillRect(x0 + 34, gy - 4, 1, 1); g.fillRect(x0 + 36, gy - 4, 1, 1); g.fillRect(x0 + 38, gy - 4, 1, 1); }
      if (c.controlledBy) { g.fillStyle = "#e9e9e9"; g.fillRect(x0 + bw - 5, top - 16, 1, 16); g.fillStyle = colRaw(c.controlledBy); g.fillRect(x0 + bw - 4, top - 16, 9, 6); }
      if (c.id === "you") { g.fillStyle = LIT; g.fillRect(cx - 3, gy + 4, 7, 2); g.fillRect(cx - 2, gy + 3, 5, 1); g.fillRect(cx, gy + 2, 1, 1); }
      // Street lamps between buildings.
      if (i < n - 1) { const lx = Math.round(slot * (i + 1)); g.fillStyle = "#3a4370"; g.fillRect(lx, gy - 14, 1, 14); g.fillStyle = DOOR2; g.fillRect(lx - 1, gy - 15, 3, 2); g.fillStyle = (day ? "rgba(0,0,0,0)" : "rgba(255,232,168,0.12)"); g.fillRect(lx - 4, gy - 13, 9, 13); }
      // Move this company's name sign above its roof.
      const sign = document.querySelector(`[data-sign="${c.id}"]`);
      if (sign) {
        const roof = zone === "premium" && !c.bankrupt ? top - 12 : zone === "hype" && !c.bankrupt ? top - 10 : top - 7;
        sign.style.left = (cx / W) * 100 + "%";
        sign.style.top = Math.max(14, roof) / H * 100 + "%";
      }
    });
  }

  // ---------------- events ----------------
  const RANGES = { "f-sopen": "storesOpen", "f-sclose": "storesClose", "f-rprice": "retailPrice", "f-price": "price", "f-prod": "production", "f-cap": "investCapacity", "f-rnd": "investRnd", "f-mkt": "marketingBudget", "f-brand": "investBrand", "f-loan": "loanChange", "f-buyback": "buyback", "f-bid": "auctionBid", "f-tstake": "takeoverStake", "f-dstake": "defenseStake", "f-hire": "hire" };
  function fmtFor(id) {
    const i = ind();
    if (id.startsWith("f-bk-")) return eur;
    return { "f-sopen": (x) => x + " stores", "f-sclose": (x) => x + " stores", "f-rprice": eur, "f-price": eur, "f-prod": units, "f-cap": eur, "f-rnd": eur, "f-mkt": eur, "f-brand": eur, "f-loan": (x) => (x >= 0 ? "+" : "") + eur(x), "f-buyback": (x) => x + " shares", "f-bid": eur, "f-tstake": eur, "f-dstake": eur, "f-hire": (x) => (x > 0 ? "+" : "") + x + " teams" }[id];
  }
  function exactFor(id) {
    return { "f-sopen": (x) => x + " stores", "f-sclose": (x) => x + " stores", "f-prod": (x) => unitsX(x) + " " + ind().labels.unit, "f-buyback": (x) => x + " shares", "f-loan": (x) => (x >= 0 ? "Borrow " : "Repay ") + eurX(Math.abs(x)), "f-hire": (x) => (x >= 0 ? "Hire " : "Lay off ") + Math.abs(x) + " teams" }[id] || eurX;
  }
  function setRange(id, value) {
    const el = document.getElementById(id);
    if (!el) return;
    const v = Math.min(Number(el.max), Math.max(Number(el.min), value));
    el.value = v;
    let val;
    if (id.startsWith("f-bk-")) { S.draft.bankruptBids = { ...(S.draft.bankruptBids || {}), [id.slice(5)]: Number(el.value) }; val = Number(el.value); }
    else { S.draft[RANGES[id]] = Number(el.value); val = S.draft[RANGES[id]]; }
    const out = document.getElementById(id + "-out");
    out.textContent = fmtFor(id)(val);
    out.dataset.tip = exactFor(id)(val);
    refreshDerived();
  }
  function refreshDerived() {

    const cn = $("#cap-note"); if (cn) cn.textContent = capNote();
    const sn = $("#staff-note"); if (sn) sn.textContent = staffNote();
  }

  function bind() {
    const on = (sel, ev, fn) => document.querySelectorAll(sel).forEach((el) => el.addEventListener(ev, fn));
    on("[data-tab]", "click", (e) => { S.tab = e.currentTarget.dataset.tab; S.tabEnter = true; hideTip(); render(); S.tabEnter = false; });
    on("#city", "pointermove", cityTip);
    on("#city", "pointerdown", cityTip);
    on("#city", "pointerleave", hideTip);
    on("#btn-menu", "click", goTitle);
    bindSubmit();
    on("#btn-help", "click", () => { S.modal = "help"; renderModal(); bindModal(); });
    on("#btn-options", "click", () => { S.modal = "options"; renderModal(); bindModal(); });
    for (const id of Object.keys(RANGES)) on("#" + id, "input", (e) => setRange(id, Number(e.target.value)));
    on('input[id^="f-bk-"]', "input", (e) => setRange(e.target.id, Number(e.target.value)));
    on("[data-step]", "click", (e) => {
      const id = e.currentTarget.dataset.step, el = document.getElementById(id);
      setRange(id, Number(el.value) + Number(e.currentTarget.dataset.dir) * Number(el.step));
    });
    on('input[name="quality"]', "change", (e) => { S.draft.quality = Number(e.target.value); refreshDerived(); });
    on('input[name="campaign"]', "change", (e) => { S.draft.campaign = e.target.value; refreshDerived(); });
    on('input[name="wildcard"]', "change", (e) => {
      const card = e.target.value;
      const sel = $("#wc-target");
      S.draft.wildcard = card ? { card, target: FT.WILDCARDS[card].needsTarget && sel ? sel.value : undefined } : null;
      const wrap = $("#wc-target-wrap"); if (wrap) wrap.hidden = !(card && FT.WILDCARDS[card].needsTarget);
    });
    on("#wc-target", "change", (e) => { if (S.draft.wildcard) S.draft.wildcard.target = e.target.value; });
    on('input[name="vote"]', "change", (e) => { S.draft.vote = e.target.value; render(); });
    on('input[name="jtarget"]', "change", (e) => { S.draft.journalistTarget = e.target.value; });
    on('input[name="research"]', "change", () => { S.draft.research = [...document.querySelectorAll('input[name="research"]:checked')].map((x) => x.value); });
    on("[data-report]", "click", (e) => { S.reportTab = e.currentTarget.dataset.report; render(); });
    on("[data-news-step]", "click", (e) => { S.newsIdx = (S.newsIdx || 0) + Number(e.currentTarget.dataset.newsStep); render(); });
    on("[data-sell-step]", "click", (e) => {
      const id = e.currentTarget.dataset.sellStep, held = byId(id).shares.holders.you || 0;
      S.draft.sellShares = S.draft.sellShares || {};
      const cur = S.draft.sellShares[id] || 0, dir = Number(e.currentTarget.dataset.dir);
      const v = Math.max(0, Math.min(held, dir > 0 ? (cur + 5 > held ? held : cur + 5) : cur - 5));
      if (v) S.draft.sellShares[id] = v; else delete S.draft.sellShares[id];
      document.getElementById("sell-" + id).textContent = v;
    });
    on("[data-buy-step]", "click", (e) => {
      const id = e.currentTarget.dataset.buyStep;
      const max = Math.min(byId(id).shares.float, diff().maxSharesPerRound);
      const v = Math.max(0, Math.min(max, (S.draft.buyShares[id] || 0) + Number(e.currentTarget.dataset.dir) * 5));
      if (v) S.draft.buyShares[id] = v; else delete S.draft.buyShares[id];
      document.getElementById("buy-" + id).textContent = v;
      const sc = document.getElementById("share-cost"); if (sc) sc.textContent = eur(planShareCost());
      refreshDerived();
    });
    bindModal();
  }

  function bindModal() {
    const on = (sel, ev, fn) => modal.querySelectorAll(sel).forEach((el) => el.addEventListener(ev, fn));
    on("#btn-continue", "click", () => { S.modal = afterResults(); render(); });
    on("#btn-show-done", "click", () => { S.modal = S.game.finished ? (S.boardQueue && S.boardQueue.length ? "board" : "final") : "results"; S.boardIndex = 0; render(); });
    on("#btn-board-next", "click", () => {
      S.boardIndex++;
      if (S.boardIndex < S.boardQueue.length) { renderModal(); bindModal(); return; }
      S.boardQueue = [];
      S.modal = S.game.finished ? "final" : (S.tvQueue && S.tvQueue.length ? (S.tvIndex = 0, "tv") : needsVote() ? "vote" : null);
      render();
    });
    on("[data-rename]", "click", (e) => { const inp = modal.querySelector("#rename-input"); if (inp) inp.value = e.currentTarget.dataset.rename; });
    on("#btn-rename", "click", () => {
      const item = S.boardQueue[S.boardIndex], inp = modal.querySelector("#rename-input");
      if (!item || !inp) return;
      S.game = FT.renameCompany(S.game, "you", item.target, inp.value);
      if (S.mp) api().call("rename", { game_id: MP.gameId, target_id: item.target, name: inp.value }).catch(() => {});
      item.renamed = byId(item.target).companyName;
      sfx("profit"); saveGame(); renderModal(); bindModal();
    });
    on("#btn-tv-next", "click", () => { S.tvIndex++; renderModal(); bindModal(); });
    on("#btn-tv-done", "click", () => { S.modal = missionPending() ? "mission" : needsVote() ? "vote" : null; S.tvQueue = []; render(); });
    on("#btn-mission-ok", "click", () => { S.missionSeen = true; if (S.mp) { try { localStorage.setItem("ft-mission-" + MP.gameId, "1"); } catch (e) {} } sfx("click"); S.modal = needsVote() ? "vote" : null; saveGame(); render(); });
    on("[data-vote]", "click", (e) => { S.draft.vote = e.currentTarget.dataset.vote; sfx("click"); S.modal = S.afterVote || null; S.afterVote = null; render(); });
    on("[data-edit]", "click", (e) => { S.tab = e.currentTarget.dataset.edit; S.modal = null; render(); });
    on("#btn-confirm", "click", () => {
      if (S.mp) { S.modal = null; mpSubmit(); return; }
      const win = modal.querySelector(".win");
      if (win && !reduceMotion() && !window.__ftFast) {
        sfx("submit");
        const st = document.createElement("div"); st.className = "stamp"; st.textContent = "Submitted!"; win.appendChild(st);
        setTimeout(() => { S.modal = null; endRound(true); }, 650);
      } else { S.modal = null; endRound(); }
    });
    on("[data-goto-report]", "click", (e) => { S.tab = "reports"; S.reportTab = e.currentTarget.dataset.gotoReport; render(); });
    on("#btn-close", "click", () => {
      S.afterVote = null;
      if (S.modal === "help") { try { localStorage.setItem("ft-help-seen", "1"); } catch (e) {} }
      if (S.modal === "help" && S.pendingTv) { S.pendingTv = false; S.modal = "tv"; S.tvIndex = 0; renderModal(); bindModal(); return; }
      if (S.modal === "help" && missionPending()) { S.modal = "mission"; renderModal(); bindModal(); return; }
      S.modal = null; renderModal(); bindModal();
    });
    on("#btn-menu-final", "click", goTitle);
    on("#btn-mp-create", "click", () => onlineAction("create"));
    on("#btn-change", "click", () => { MP.submitted = 0; S.modal = null; renderModal(); const b = $("#btn-submit"); if (b) { b.outerHTML = submitButton(); bindSubmit(); } });
    on("#btn-mp-join", "click", () => onlineAction("join"));
    on("#btn-mp-rejoin", "click", () => onlineAction("rejoin"));
    on("#btn-skip", "click", async (e) => {
      e.currentTarget.disabled = true; e.currentTarget.textContent = "Starting the next round…";
      try { await api().call("resolve", { game_id: MP.gameId }); MP.error = ""; } catch (er) { MP.error = er.message; renderModal(); bindModal(); }
      mpRefresh();
    });
    on("[data-theme-pick]", "click", (e) => { applyTheme(e.currentTarget.dataset.themePick); sfx("click"); render(); });
    on("[data-pref]", "click", (e) => {
      const key = e.currentTarget.dataset.pref;
      if (key === "sfx") { SND.sfx = !SND.sfx; saveSound(); }
      else if (key === "music") setMusic(!SND.music);
      else if (key === "help") { try { if (localStorage.getItem("ft-help-seen")) localStorage.removeItem("ft-help-seen"); else localStorage.setItem("ft-help-seen", "1"); } catch (er) {} }
      else { PREFS[key] = !PREFS[key]; savePrefs(); if (key === "anim") { document.documentElement.dataset.motion = PREFS.anim ? "on" : "off"; if (S.screen === "title") runTitle(); else if (S.game) animateSkyline(); } }
      sfx("click");
      const btn = modal.querySelector(`[data-pref="${key}"]`);
      if (btn) btn.setAttribute("aria-checked", btn.getAttribute("aria-checked") === "true" ? "false" : "true");
    });
    on("[data-vol]", "input", (e) => { const k = e.target.dataset.vol, v = Number(e.target.value) / 100; setVolume(k, v); const l = modal.querySelector("#vol-" + k); if (l) l.textContent = Math.round(v * 100) + "%"; });
    on('[data-vol="sfx"]', "change", () => sfx("profit"));
    on("#o-delete", "click", () => { try { localStorage.removeItem("ft-save"); } catch (e) {} renderModal(); bindModal(); if (S.screen === "title") { const m = S.modal; render(); S.modal = m; renderModal(); bindModal(); } });
    on("#btn-again", "click", () => { if (S.mp) { mpForget(); goTitle(); return; } S.modal = "setup"; renderModal(); bindModal(); });
    on("#btn-start", "click", () => {
      const val = (name) => (modal.querySelector(`input[name="${name}"]:checked`) || {}).value;
      newGame({
        name: modal.querySelector("#s-name").value.trim() || "You",
        company: modal.querySelector("#s-company").value.trim() || "My Company",
        industry: val("industry") || "chocolate",
        bots: Number(val("bots") || 4),
        difficulty: val("difficulty") || "standard",
        trait: val("trait") || "visionary",
        botSkill: val("botSkill") || "normal",
        rounds: Number(val("rounds") || 8),
      }, true);
    });
  }
  document.addEventListener("keydown", (e) => { if (e.key === "Escape" && S && S.modal && !["final", "show", "board"].includes(S.modal)) { if (S.modal === "tv") S.tvQueue = []; S.modal = null; renderModal(); } });
  window.addEventListener("resize", () => { if (S && S.screen !== "title") drawCity(1); });
  try { document.fonts && document.fonts.ready.then(() => S && drawCity(1)); } catch (e) {}

  // Test hook (only in the automated smoke test).
  if (window.__ftFast) window.__ftDebug = { get S() { return S; }, render: () => render(), endRound: () => endRound() };
  window.claude?.hot?.snapshot?.(() => (S ? { S: JSON.parse(JSON.stringify({ ...S, anim: null })) } : {}));
  function start(data) {
    if (data && data.S && data.S.screen === "title") { S = data.S; render(); return; }
    if (data && data.S && data.S.game && data.S.marketHist && data.S.game.companies[0].mission) { S = data.S; render(); return; }
    S = { screen: "title", opts: DEFAULT_OPTS, modal: null };
    let join = null;
    try { join = new URLSearchParams(location.search).get("join"); } catch (e) {}
    if (join && /^[A-Za-z0-9]{6}$/.test(join)) { S.modal = "online"; S.joinCode = join.toUpperCase(); }
    render();
  }
  window.claude?.hot?.ready ? window.claude.hot.ready(start) : start(window.claude?.hot?.data ?? {});
})();
</script>
